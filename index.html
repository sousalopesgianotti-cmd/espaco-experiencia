    // --- COMPONENTE: HISTÓRICO DE VISITANTES COM GESTÃO À VISTA & RELATÓRIO PDF ---
    function VisitorHistoryModal({ onClose, currentYear = new Date().getFullYear(), showToast, visitorsList = [] }) {
      const [selectedYear, setSelectedYear] = useState(currentYear);
      const [selectedMonth, setSelectedMonth] = useState(null);
      const [historyData, setHistoryData] = useState(null);
      const [loading, setLoading] = useState(true);

      // Estados de Filtro Temporal da Gestão à Vista
      const [periodoFiltro, setPeriodoFiltro] = useState('ano'); // 'hoje', 'semana', 'mes', 'ano', 'custom'
      const [dataInicio, setDataInicio] = useState('');
      const [dataFim, setDataFim] = useState('');

      // Helper fuso Brasília para Hoje
      const getBrasiliaTodayStr = () => {
        try {
          const formatter = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'America/Sao_Paulo',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
          });
          return formatter.format(new Date());
        } catch (e) {
          return new Date().toISOString().slice(0, 10);
        }
      };

      // Helper fuso Brasília para Semana Atual (Segunda a Domingo)
      const getBrasiliaWeekRange = () => {
        const todayStr = getBrasiliaTodayStr();
        const [y, m, d] = todayStr.split('-').map(Number);
        const dt = new Date(Date.UTC(y, m - 1, d, 12, 0, 0));
        const dayOfWeek = dt.getDay(); // 0 é Domingo, 1 é Segunda...
        const monOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
        const sunOffset = monOffset + 6;
        const mon = new Date(dt.getTime() + monOffset * 86400000);
        const sun = new Date(dt.getTime() + sunOffset * 86400000);
        return {
          start: mon.toISOString().slice(0, 10),
          end: sun.toISOString().slice(0, 10)
        };
      };

      // Bloquear rolagem do fundo (body + html) e fechar com ESC
      useEffect(() => {
        const originalBodyOverflow = document.body.style.overflow;
        const originalHtmlOverflow = document.documentElement.style.overflow;
        document.body.style.overflow = 'hidden';
        document.documentElement.style.overflow = 'hidden';

        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);

        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          document.body.style.overflow = originalBodyOverflow || '';
          document.documentElement.style.overflow = originalHtmlOverflow || '';
        };
      }, [onClose]);

      useEffect(() => {
        setLoading(true);
        const url = selectedMonth
          ? `/api/visitors/history?ano=${selectedYear}&mes=${selectedMonth}`
          : `/api/visitors/history?ano=${selectedYear}`;
        fetch(url)
          .then(res => res.json())
          .then(data => {
            if (data && data.success) {
              setHistoryData(data);
            }
          })
          .catch(() => {})
          .finally(() => setLoading(false));
      }, [selectedYear, selectedMonth]);

      const anosDisponiveis = historyData?.anos_disponiveis || [currentYear];
      const meses = historyData?.meses || [];

      // Conjunto consolidado de visitantes (lista viva ou dados do ano)
      const poolVisitantes = useMemo(() => {
        if (visitorsList && visitorsList.length > 0) return visitorsList;
        if (historyData?.visitantes_ano && historyData.visitantes_ano.length > 0) return historyData.visitantes_ano;
        return [];
      }, [visitorsList, historyData]);

      // Filtragem dinâmica baseada no período selecionado
      const filteredVisitors = useMemo(() => {
        const todayStr = getBrasiliaTodayStr();
        const week = getBrasiliaWeekRange();

        return poolVisitantes.filter(v => {
          if (!v || !v.data) return false;
          const dataV = String(v.data).slice(0, 10);

          if (periodoFiltro === 'hoje') {
            return dataV === todayStr;
          }
          if (periodoFiltro === 'semana') {
            return dataV >= week.start && dataV <= week.end;
          }
          if (periodoFiltro === 'mes') {
            const mesAlvo = selectedMonth || (new Date().getMonth() + 1);
            const mesStr = String(mesAlvo).padStart(2, '0');
            return dataV.startsWith(`${selectedYear}-${mesStr}`);
          }
          if (periodoFiltro === 'custom') {
            if (dataInicio && dataV < dataInicio) return false;
            if (dataFim && dataV > dataFim) return false;
            return true;
          }
          // Default: 'ano'
          return dataV.startsWith(String(selectedYear));
        });
      }, [poolVisitantes, periodoFiltro, selectedYear, selectedMonth, dataInicio, dataFim]);

      // Métricas e agregação dos 3 blocos (Cliente, Prospect, Visitante Interno)
      const metrics3Blocos = useMemo(() => {
        let clientePessoas = 0, clienteVisitas = 0;
        let prospectPessoas = 0, prospectVisitas = 0;
        let internoPessoas = 0, internoVisitas = 0;

        filteredVisitors.forEach(v => {
          const qtd = Math.max(1, parseInt(v.numero_pessoas, 10) || 1);
          const tipo = (v.tipo_visitante || '').toLowerCase();
          if (tipo === 'cliente') {
            clientePessoas += qtd;
            clienteVisitas += 1;
          } else if (tipo === 'prospect') {
            prospectPessoas += qtd;
            prospectVisitas += 1;
          } else {
            // visitante_interno ou visitante_externo legado
            internoPessoas += qtd;
            internoVisitas += 1;
          }
        });

        const totalPessoas = clientePessoas + prospectPessoas + internoPessoas;
        const totalVisitas = clienteVisitas + prospectVisitas + internoVisitas;

        const clientePct = totalPessoas > 0 ? (clientePessoas / totalPessoas) * 100 : 0;
        const prospectPct = totalPessoas > 0 ? (prospectPessoas / totalPessoas) * 100 : 0;
        const internoPct = totalPessoas > 0 ? (internoPessoas / totalPessoas) * 100 : 0;

        return {
          cliente: { pessoas: clientePessoas, visitas: clienteVisitas, pct: clientePct },
          prospect: { pessoas: prospectPessoas, visitas: prospectVisitas, pct: prospectPct },
          interno: { pessoas: internoPessoas, visitas: internoVisitas, pct: internoPct },
          totalPessoas,
          totalVisitas
        };
      }, [filteredVisitors]);

      // Rótulo textual amigável do período ativo
      const getPeriodoLabel = () => {
        if (periodoFiltro === 'hoje') {
          const t = getBrasiliaTodayStr().split('-').reverse().join('/');
          return `Hoje (${t})`;
        }
        if (periodoFiltro === 'semana') {
          const w = getBrasiliaWeekRange();
          return `Esta Semana (${w.start.split('-').reverse().join('/')} a ${w.end.split('-').reverse().join('/')})`;
        }
        if (periodoFiltro === 'mes') {
          const mIdx = (selectedMonth || (new Date().getMonth() + 1)) - 1;
          const nomeM = meses[mIdx]?.nome || `Mês ${mIdx + 1}`;
          return `${nomeM} de ${selectedYear}`;
        }
        if (periodoFiltro === 'custom') {
          const ini = dataInicio ? dataInicio.split('-').reverse().join('/') : 'Início';
          const fim = dataFim ? dataFim.split('-').reverse().join('/') : 'Fim';
          return `Período Personalizado: ${ini} até ${fim}`;
        }
        return `Ano de ${selectedYear}`;
      };

      // Exportação Executiva para PDF via template de impressão corporativo
      const handleExportarPDF = () => {
        const periodoTxt = getPeriodoLabel();
        const dataEmissao = new Date().toLocaleString('pt-BR');
        const { cliente, prospect, interno, totalPessoas, totalVisitas } = metrics3Blocos;

        const linhasTabela = filteredVisitors.map(v => {
          const dtFmt = v.data ? v.data.split('-').reverse().join('/') : '—';
          let catLabel = 'Visitante Interno';
          let catColor = '#D97706';
          if (v.tipo_visitante === 'cliente') {
            catLabel = 'Cliente';
            catColor = '#002554';
          } else if (v.tipo_visitante === 'prospect') {
            catLabel = 'Prospect';
            catColor = '#0D9488';
          }
          return `
            <tr>
              <td style="padding: 8px 10px; border-bottom: 1px solid #E2E8F0; font-size: 11px;">${dtFmt}</td>
              <td style="padding: 8px 10px; border-bottom: 1px solid #E2E8F0; font-size: 11px; font-weight: bold; color: #0F172A;">${v.empresa || v.nome || '—'}</td>
              <td style="padding: 8px 10px; border-bottom: 1px solid #E2E8F0; font-size: 11px;">
                <span style="display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 10px; font-weight: bold; color: #FFF; background-color: ${catColor};">

              <td style="padding: 8px 10px; border-bottom: 1px solid #E2E8F0; font-size: 11px; color: #475569;">${v.responsavel || 'Equipe TOTVS'}</td>

        }).join('');

        return `${yyyy}-${mm}-${dd}`;
      });
      const [empresa, setEmpresa] = useState('');
      const [tipoVisitante, setTipoVisitante] = useState('');
      const [numeroPessoas, setNumeroPessoas] = useState(1);

        if (admLogado && admLogado.nome) return admLogado.nome;

          return typeof plantonistaHoje === 'string' ? plantonistaHoje : (plantonistaHoje.nome || '');
        }
        return '';
      });
      const [salvando, setSalvando] = useState(false);
      const [copiedFormLink, setCopiedFormLink] = useState(false);

      const googleFormsUrl = "https://docs.google.com/forms/d/e/1FAIpQLSfQWaQrpLcHNW1HkOhe2RQ2AnpNEzb-Duna6hyP1__FxGalmQ/viewform";

      // Bloquear rolagem do fundo (body + html) e fechar com ESC
      useEffect(() => {
        const originalBodyOverflow = document.body.style.overflow;
        const originalHtmlOverflow = document.documentElement.style.overflow;
        document.body.style.overflow = 'hidden';
        document.documentElement.style.overflow = 'hidden';

        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);

        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          document.body.style.overflow = originalBodyOverflow || '';
          document.documentElement.style.overflow = originalHtmlOverflow || '';
        };
      }, [onClose]);

      const handleCopyLink = () => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(googleFormsUrl).then(() => {
            setCopiedFormLink(true);
            setTimeout(() => setCopiedFormLink(false), 3000);
            if (showToast) showToast('Link do formulário copiado! 📋');
          }).catch(() => {

        window.open(googleFormsUrl, '_blank', 'noopener,noreferrer');

          const res = await fetch('/api/visitors/form-opened', { method: 'POST' });

          return;

    // --- COMPONENTE: ABA DO VÍDEO INSTITUCIONAL DA GESTÃO (PAINEL ADM) ---
    function AdminVideoTab({ videoGestao, admLogado, onVideoGestaoChange, showToast }) {
      const [tipo, setTipo] = useState(videoGestao?.tipo || 'arquivo');
      const [titulo, setTitulo] = useState(videoGestao?.titulo || 'Discurso da Gestão');
      const [mensagem, setMensagem] = useState(videoGestao?.mensagem || 'Veja seu discurso aqui');
      const [subtitulo, setSubtitulo] = useState(videoGestao?.subtitulo || 'Mensagem institucional da liderança aos visitantes do Espaço Experiência');
      const [urlLink, setUrlLink] = useState(videoGestao?.tipo === 'link' ? (videoGestao?.url || '') : '');
      const [videoAtivo, setVideoAtivo] = useState(videoGestao?.ativo !== false);
      
      const [arquivoSelecionado, setArquivoSelecionado] = useState(null);
      const [uploadProgress, setUploadProgress] = useState(0);
      const [uploading, setUploading] = useState(false);
      const [uploadMsg, setUploadMsg] = useState('');
      const [salvandoConfig, setSalvandoConfig] = useState(false);
      const [excluindoVideo, setExcluindoVideo] = useState(false);
      const [previewError, setPreviewError] = useState(false);

      useEffect(() => {
        setPreviewError(false);
        if (videoGestao) {
          setTipo(videoGestao.tipo || 'arquivo');
          setTitulo(videoGestao.titulo || 'Discurso da Gestão');
          setMensagem(videoGestao.mensagem || 'Veja seu discurso aqui');
          setSubtitulo(videoGestao.subtitulo || 'Mensagem institucional da liderança aos visitantes do Espaço Experiência');
          if (videoGestao.tipo === 'link') setUrlLink(videoGestao.url || '');
          setVideoAtivo(videoGestao.ativo !== false);
        }
      }, [videoGestao]);

      // Excluir Vídeo Atual (Apaga arquivo do disco e reseta URL)
      const handleExcluirVideo = async () => {
        const nomeAlvo = videoGestao?.nome_arquivo || (videoGestao?.tipo === 'link' ? 'link externo' : 'vídeo atual');
        if (!confirm(`Deseja realmente excluir o vídeo (${nomeAlvo})? Esta ação removerá o arquivo do servidor e limpará a exibição.`)) {
          return;
        }

        setExcluindoVideo(true);
        try {
          const res = await fetch('/api/admin/video', {
            method: 'DELETE',
            headers: {
              'Content-Type': 'application/json',
              'X-Admin': encodeURIComponent(admLogado?.nome || 'Administrador')
            }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            if (onVideoGestaoChange) onVideoGestaoChange();
            if (showToast) showToast('Vídeo institucional excluído com sucesso! 🗑️');
            setUrlLink('');
            setArquivoSelecionado(null);
            setUploadMsg('');
            setPreviewError(false);
          } else {
            alert(data.message || data.error || 'Erro ao excluir vídeo.');
          }
        } catch (err) {
          alert('Erro de conexão ao excluir vídeo.');
        } finally {
          setExcluindoVideo(false);
        }
      };

      // Upload com XHR (suporte a grandes arquivos de 713 MB com stream direto para disco e barra de progresso)
      const handleUploadFile = () => {
        if (!arquivoSelecionado) {
          alert('Por favor, selecione um arquivo de vídeo do seu computador antes de iniciar o upload.');
          return;
        }

        const fileSizeMB = (arquivoSelecionado.size / 1024 / 1024).toFixed(2);
        setUploading(true);
        setUploadProgress(0);
        setUploadMsg(`Iniciando upload de "${arquivoSelecionado.name}" (${fileSizeMB} MB)...`);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/admin/video/upload', true);
        xhr.setRequestHeader('X-Filename', encodeURIComponent(arquivoSelecionado.name));
        xhr.setRequestHeader('X-Author', encodeURIComponent(admLogado?.nome || 'Administrador'));
        xhr.setRequestHeader('Content-Type', arquivoSelecionado.type || 'application/octet-stream');
        xhr.timeout = 15 * 60 * 1000; // 15 minutos de timeout para uploads pesados

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            const loadedMB = (e.loaded / 1024 / 1024).toFixed(1);
            const totalMB = (e.total / 1024 / 1024).toFixed(1);
            setUploadProgress(percent);
            setUploadMsg(`Enviando: ${percent}% (${loadedMB} MB de ${totalMB} MB)...`);
          }
        };

        xhr.onload = () => {
          setUploading(false);
          try {
            const data = JSON.parse(xhr.responseText);
            if (xhr.status >= 200 && xhr.status < 300 && data.success) {
              setUploadProgress(100);
              setUploadMsg(`✅ Upload de "${data.nome_arquivo}" concluído com sucesso (${data.tamanho_mb} MB)!`);
              setArquivoSelecionado(null);
              if (onVideoGestaoChange) onVideoGestaoChange();
              if (showToast) showToast('Vídeo institucional carregado com sucesso! 🎬');
            } else {
              setUploadMsg(`❌ Erro no upload: ${data.message || data.error || 'Falha no processamento.'}`);
              alert(data.message || data.error || 'Erro no upload.');
            }
          } catch (err) {
            setUploadMsg('❌ Erro inesperado na resposta do servidor.');
          }
        };

        xhr.onerror = () => {
          setUploading(false);
          setUploadMsg('❌ Erro de conexão ao enviar vídeo.');
          alert('Falha na conexão durante o upload.');
        };

        xhr.ontimeout = () => {
          setUploading(false);
          setUploadMsg('❌ Tempo limite de envio excedido.');
          alert('Tempo limite de upload excedido.');
        };

        xhr.send(arquivoSelecionado);
      };

      // Salvar Configurações (Textos, URL Externa, Status Ativo)
      const handleSalvarConfig = async (e) => {
        if (e) e.preventDefault();
        setSalvandoConfig(true);
        try {
          const payload = {
            ativo: videoAtivo,
            tipo,
            titulo: titulo.trim(),
            mensagem: mensagem.trim(),
            subtitulo: subtitulo.trim(),
            autor: admLogado?.nome || 'Administrador'
          };

          if (tipo === 'link') {
            if (!urlLink.trim()) {
              alert('Por favor, informe a URL do vídeo externo (Google Drive, YouTube, etc.).');
              setSalvandoConfig(false);
              return;
            }
            payload.url = urlLink.trim();
          }

          const res = await fetch('/api/admin/video/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok && data.success) {
            if (onVideoGestaoChange) onVideoGestaoChange();
            if (showToast) showToast('Configurações do vídeo da gestão atualizadas com sucesso! ✅');
          } else {
            alert(data.error || 'Erro ao salvar configurações do vídeo.');
          }
        } catch (err) {
          alert('Erro de conexão ao salvar configurações.');
        } finally {
          setSalvandoConfig(false);
        }
      };

      return (
        <div className="space-y-6">
          {/* Card de Apresentação e Boas Práticas */}
          <div className="p-4 rounded-2xl bg-gradient-to-r from-slate-900 via-totvs-dark to-slate-900 text-white shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4 border border-totvs-cyan/30">
            <div>
              <div className="flex items-center gap-2 mb-1">
                <span className="text-[10px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-full bg-totvs-cyan/20 text-totvs-cyan border border-totvs-cyan/30">
                  Vídeo Institucional da Liderança
                </span>
                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${videoAtivo ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-700 text-slate-300'}`}>
                  {videoAtivo ? 'Exibição Ativa no Topo ✅' : 'Exibição Oculta ⏸️'}
                </span>
              </div>
              <h4 className="font-black text-base text-white">
                Gestão do Vídeo de Boas-Vindas & Discurso
              </h4>
              <p className="text-xs text-slate-300 mt-0.5 max-w-xl">
                Configurado para exibir miniatura no topo com a mensagem <strong>"{mensagem}"</strong>. Suporta arquivo pesado (.MOV de 713 MB ou .MP4) com streaming HTTP 206 sem travamentos.
              </p>
            </div>

    // --- COMPONENTE: PAINEL ADMINISTRATIVO (ADMS, CONVITES, VISITAS, AUDITORIA & VÍDEO) ---
    function AdminModal({
      admLogado,
      onUpdateAdmProfile,
      activeTab = 'adms',
      onTabChange,
      admsList = [],
      onAdmsChange,
      convitesList = [],
      onConvitesChange,
      metricsData = {},
      accessLogs = [],
      auditLogs = [],
      segmentos = [],
      visitorsList = [],
      onVisitorsChange,
      visitorMetrics = {},
      onOpenVisitorModal,
      onClose,
      onRefresh,
      onLogout,
      videoGestao,
      onVideoGestaoChange,
      showToast,
      authEspecialistaObrigatoria = false,
      onAuthModeChange
    }) {
      // Bloquear rolagem do fundo e fechar com a tecla ESC
      useEffect(() => {
        const originalBodyOverflow = document.body.style.overflow;
        const originalHtmlOverflow = document.documentElement.style.overflow;
        document.body.style.overflow = 'hidden';
        document.documentElement.style.overflow = 'hidden';

        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          document.body.style.overflow = originalBodyOverflow || '';
          document.documentElement.style.overflow = originalHtmlOverflow || '';
        };
      }, [onClose]);

      // Usuário PMM não pode visualizar abas de administradores, convites ou auditoria
      useEffect(() => {
        if (admLogado?.perfil === 'pmm' && (activeTab === 'adms' || activeTab === 'convites' || activeTab === 'audit')) {
          if (onTabChange) onTabChange('visitas');
        }
      }, [admLogado?.perfil, activeTab, onTabChange]);

      const [copiedToken, setCopiedToken] = useState(null);
      const [gerandoConvite, setGerandoConvite] = useState(false);
      const [conviteRecemCriado, setConviteRecemCriado] = useState(null);
      const [deletingId, setDeletingId] = useState(null);
      const [actionLoadingId, setActionLoadingId] = useState(null);
      const [filterAudit, setFilterAudit] = useState('');
      const [subTabAudit, setSubTabAudit] = useState('conteudo'); // 'conteudo' ou 'acessos'
      const [filterAuditPerfil, setFilterAuditPerfil] = useState('todos'); // 'todos', 'pmm', 'adm'
      const [filterAccessPerfil, setFilterAccessPerfil] = useState('todos'); // 'todos', 'pmm', 'adm', 'visitante'
      const [filterVisitas, setFilterVisitas] = useState('');
      const [filterVisitors, setFilterVisitors] = useState('');
      const [deletingVisitorId, setDeletingVisitorId] = useState(null);

      // Estados para Novo Convite com Nome e E-mail obrigatórios
      const [novoAdmNome, setNovoAdmNome] = useState('');
      const [novoAdmEmail, setNovoAdmEmail] = useState('');
      const [perfilConvite, setPerfilConvite] = useState('especialista');

      // Estados para Catálogo e Links Rápidos de Especialistas (44 especialistas da planilha oficial)
      const [especialistasCatalogo, setEspecialistasCatalogo] = useState([]);
      const [buscaEspecialista, setBuscaEspecialista] = useState('');
      const [copiandoEspId, setCopiandoEspId] = useState(null);

      // Estados para Filtro de Período em Auditoria / Acessos
      const [filterAccessPeriodo, setFilterAccessPeriodo] = useState('todos'); // 'todos', 'hoje', 'semana', 'mes', 'custom'
      const [filterAccessDataInicio, setFilterAccessDataInicio] = useState('');
      const [filterAccessDataFim, setFilterAccessDataFim] = useState('');

      useEffect(() => {
        fetch('/api/plantonistas')
          .then(res => res.json())
          .then(data => {
            if (data && Array.isArray(data.especialistas)) {
              setEspecialistasCatalogo(data.especialistas);
            }
          })
          .catch(() => {});
      }, []);

      // Estados para Exclusão e Limpeza de Convites
      const [modalLimparConvites, setModalLimparConvites] = useState(false);
      const [deletingInviteToken, setDeletingInviteToken] = useState(null);
      const [limpandoConvites, setLimpandoConvites] = useState(false);

      // Estados para Edição do Próprio Perfil (Nome & Senha do Usuário Logado)
      const [modalMeuPerfil, setModalMeuPerfil] = useState(false);
      const [meuNomeInput, setMeuNomeInput] = useState('');
      const [minhaNovaSenhaInput, setMinhaNovaSenhaInput] = useState('');
      const [confirmaMinhaNovaSenhaInput, setConfirmaMinhaNovaSenhaInput] = useState('');
      const [salvandoMeuPerfil, setSalvandoMeuPerfil] = useState(false);
      const [erroMeuPerfil, setErroMeuPerfil] = useState('');

      // Estados para Edição de Terceiros na Lista de Perfis Cadastrados
      const [modalEditarPerfil, setModalEditarPerfil] = useState(false);
      const [editUserAlvo, setEditUserAlvo] = useState(null);
      const [editNomeInput, setEditNomeInput] = useState('');
      const [editNovaSenhaInput, setEditNovaSenhaInput] = useState('');
      const [editConfirmaSenhaInput, setEditConfirmaSenhaInput] = useState('');
      const [salvandoEditPerfil, setSalvandoEditPerfil] = useState(false);
      const [erroEditPerfil, setErroEditPerfil] = useState('');

      // Alternância da Chave Mestra do Perfil Especialista (Dono do Produto)
      const [togglingAuthMode, setTogglingAuthMode] = useState(false);

      const handleToggleAuthMode = async () => {
        if (!admLogado?.dono_produto) {
          if (showToast) showToast('Apenas o Dono do Produto pode alterar esta chave.');
          return;
        }
        setTogglingAuthMode(true);
        const novoValor = !authEspecialistaObrigatoria;

        try {
          const res = await fetch('/api/config/auth-mode', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              obrigatoria: novoValor,
              autorNome: admLogado.nome,
              autorEmail: admLogado.email,
              dono_produto: admLogado.dono_produto
            })
          });
          const data = await res.json();
          if (data && data.success) {
            if (onAuthModeChange) onAuthModeChange(data.auth_especialista_obrigatoria);
            if (showToast) showToast(data.message || 'Chave alterada com sucesso! ✅');
            if (onRefresh) onRefresh();
          } else {
            if (showToast) showToast(data.message || 'Erro ao alterar chave mestra.');
          }
        } catch (err) {
          if (showToast) showToast('Erro de comunicação ao alternar chave mestra.');
        } finally {
          setTogglingAuthMode(false);
        }
      };
      const handleAbrirMeuPerfil = () => {
        setMeuNomeInput(admLogado?.nome || '');
        setMinhaNovaSenhaInput('');
        setConfirmaMinhaNovaSenhaInput('');
        setErroMeuPerfil('');
        setModalMeuPerfil(true);
      };

      const handleSalvarMeuPerfil = async (e) => {
        if (e) e.preventDefault();
        setErroMeuPerfil('');

        const nomeLimpo = meuNomeInput.trim();
        if (!nomeLimpo) {
          setErroMeuPerfil('O nome completo não pode ficar em branco.');
          return;
        }

        const senhaLimpa = minhaNovaSenhaInput.trim();
        if (senhaLimpa) {
          if (senhaLimpa.length < 6 || !/^(?=.*[a-zA-Z])(?=.*[0-9]).{6,}$/.test(senhaLimpa)) {
            setErroMeuPerfil('A nova senha deve possuir no mínimo 6 caracteres e conter letras e números.');
            return;
          }
          if (senhaLimpa !== confirmaMinhaNovaSenhaInput.trim()) {
            setErroMeuPerfil('A confirmação da nova senha não confere.');
            return;
          }
        }

        if (!senhaLimpa && nomeLimpo === (admLogado?.nome || '').trim()) {
          setErroMeuPerfil('Nenhuma alteração foi realizada.');
          return;
        }

        setSalvandoMeuPerfil(true);
        const payload = {
          email: admLogado.email,
          nome: nomeLimpo,
          novaSenha: senhaLimpa || undefined,
          autorEmail: admLogado.email,
          autorNome: admLogado.nome
        };

        if (typeof google !== 'undefined' && google && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((res) => {
              setSalvandoMeuPerfil(false);
              if (res && res.success) {

      // Upload de Foto de Perfil do Administrador
      const handleUploadAvatar = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
          alert('Por favor, selecione um arquivo de imagem válido (JPG, PNG ou WebM).');
          return;

        if (file.size > 5 * 1024 * 1024) {
          alert('A foto selecionada deve ter no máximo 5 MB.');
          return;
        }

        setUploadingAvatar(true);
        const reader = new FileReader();
        reader.onload = () => {
          const rawBase64 = reader.result;
          const img = new Image();
          img.onload = async () => {
            // Redimensionar para tamanho ideal de avatar (160x160 JPEG)
            const canvas = document.createElement('canvas');
            const MAX_DIM = 160;
            let w = img.width;
            let h = img.height;
            if (w > h) {
              if (w > MAX_DIM) { h = Math.round((h * MAX_DIM) / w); w = MAX_DIM; }
            } else {
              if (h > MAX_DIM) { w = Math.round((w * MAX_DIM) / h); h = MAX_DIM; }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const base64Data = canvas.toDataURL('image/jpeg', 0.82);
          try {
            const res = await fetch('/api/admin/avatar', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({

            setUploadingAvatar(false);

          };
          img.src = rawBase64;
        };

                        </strong>
                        <p className="text-[11px] text-slate-500 mt-0.5 leading-snug">
                          Remove do histórico apenas os convites já aceitos. Todos os links pendentes continuarão válidos e ativos.
                        </p>
                      </div>
                    </button>

                    {/* Opção 2: Excluir Todo o Histórico */}
                    <button
                      type="button"
                      disabled={limpandoConvites}
                      onClick={() => handleLimparConvites('all')}
                      className="w-full text-left p-4 rounded-2xl border border-rose-200 bg-rose-50/40 hover:bg-rose-50 transition cursor-pointer flex items-start gap-3 group"
                    >
                      <div className="w-8 h-8 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center font-bold text-base shrink-0 group-hover:scale-105 transition">
                        ⚠️
                      </div>
                      <div>
                        <strong className="text-xs font-bold text-rose-700 block">
                          Excluir Todo o Histórico (Revogação Geral)
                        </strong>
                        <p className="text-[11px] text-rose-600/90 mt-0.5 leading-snug">
                          Limpa todos os convites e <strong>cancela/revoga imediatamente todos os links pendentes</strong>. Ninguém mais conseguirá se cadastrar por nenhum link gerado anteriormente.
                        </p>
                      </div>
                    </button>
                  </div>

                  <div className="flex items-center justify-end gap-2 pt-3 border-t border-slate-100">
                    <button
                      type="button"
                      disabled={limpandoConvites}
                      onClick={() => setModalLimparConvites(false)}
                      className="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 font-bold text-xs transition cursor-pointer"
                    >
                      {limpandoConvites ? 'Limpando...' : 'Cancelar'}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Error Boundary Global: Isolamento preventivo de falhas de renderização
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error('ErrorBoundary capturou erro:', error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-6 text-center">
              <div className="w-16 h-16 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-3xl mb-4 border border-rose-500/30">
                ⚠️
              </div>
              <h2 className="text-xl font-bold mb-2">Instabilidade visual isolada</h2>
              <p className="text-xs text-slate-400 max-w-md mb-6 leading-relaxed">
                Um erro visual foi contido com sucesso para proteger seus dados e navegação.
              </p>
              <button
                type="button"
                onClick={() => window.location.reload()}
                className="px-6 py-2.5 rounded-xl bg-totvs-blue hover:bg-totvs-cyan hover:text-slate-900 text-white font-bold text-xs transition cursor-pointer shadow-lg"
              >
                Recarregar Aplicação
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // Renderizar Aplicação
    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
