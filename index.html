    // --- COMPONENTE: REGISTRO DE VISITANTE NO ESPAÇO EXPERIÊNCIA (ACESSO ABERTO) ---
    function VisitorRegisterModal({ onClose, onSuccess, onFormOpened, showToast, admLogado }) {
      const [dataVisita, setDataVisita] = useState(() => {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      });
      const [empresa, setEmpresa] = useState('');
      const [numeroPessoas, setNumeroPessoas] = useState(1);
      const [responsavel, setResponsavel] = useState(admLogado ? admLogado.nome : '');
      const [salvando, setSalvando] = useState(false);
      const [copiedFormLink, setCopiedFormLink] = useState(false);

      const googleFormsUrl = "https://docs.google.com/forms/d/e/1FAIpQLSfQWaQrpLcHNW1HkOhe2RQ2AnpNEzb-Duna6hyP1__FxGalmQ/viewform";

      // Bloquear rolagem do fundo (body + html) e fechar com ESC
      useEffect(() => {
        const originalBodyOverflow = document.body.style.overflow;
        const originalHtmlOverflow = document.documentElement.style.overflow;
        document.body.style.overflow = 'hidden';
        document.documentElement.style.overflow = 'hidden';

        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);

        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          document.body.style.overflow = originalBodyOverflow || '';
          document.documentElement.style.overflow = originalHtmlOverflow || '';
        };
      }, [onClose]);

      const handleCopyLink = () => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(googleFormsUrl).then(() => {
            setCopiedFormLink(true);
            setTimeout(() => setCopiedFormLink(false), 3000);
            if (showToast) showToast('Link do formulário copiado! 📋');
          }).catch(() => {
            prompt('Copie o link do formulário abaixo:', googleFormsUrl);
          });
        } else {
          prompt('Copie o link do formulário abaixo:', googleFormsUrl);
        }
      };

      const handleOpenForm = async () => {
        window.open(googleFormsUrl, '_blank', 'noopener,noreferrer');
        try {
          const res = await fetch('/api/visitors/form-opened', { method: 'POST' });
          const data = await res.json();
          if (data && data.success && onFormOpened) {
            onFormOpened();
          }
        } catch (err) {}
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!dataVisita) {
          alert('Por favor, informe a Data da Visita.');
          return;
        }
        if (!empresa.trim()) {
          alert('Por favor, informe o Nome da Empresa ou Instituição visitante.');
          return;
        }
        const qtd = parseInt(numeroPessoas, 10);
        if (isNaN(qtd) || qtd < 1) {
          alert('Por favor, informe o Número de Pessoas (mínimo 1).');
          return;
        }
        if (!responsavel.trim()) {
          alert('Por favor, informe o Responsável / Anfitrião TOTVS que acompanhou a visita.');
          return;
        }
        setSalvando(true);
        try {
          const res = await fetch('/api/visitors', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              data: dataVisita,
              empresa: empresa.trim(),
              nome: empresa.trim(),
              numero_pessoas: qtd,
              responsavel: responsavel.trim()
            })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            if (onSuccess) onSuccess(data.metrics, data.registro || data.visitante);
            if (showToast) showToast(`Visita de "${empresa.trim()}" (${qtd} pessoa${qtd > 1 ? 's' : ''}) registrada! 🎉`);
            onClose();
          } else {
            alert(data.message || data.error || 'Erro ao registrar visita.');
          }
        } catch (err) {
          alert('Falha de conexão com o servidor ao registrar visita.');
        } finally {
          setSalvando(false);
        }
      };

      return (
        <div 
          className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-3 sm:p-4 md:p-6 overflow-hidden overscroll-none"
          onClick={(e) => {
            if (e.target === e.currentTarget) onClose();
          }}
          onTouchMove={(e) => {
            if (e.target === e.currentTarget) e.preventDefault();
          }}
          onWheel={(e) => {
            if (e.target === e.currentTarget) e.preventDefault();
          }}
        >
          <div 
            className="bg-white rounded-3xl shadow-2xl max-w-lg w-full max-h-[92vh] sm:max-h-[88vh] flex flex-col overflow-hidden border border-slate-200 animate-in fade-in zoom-in-95 duration-150 my-auto"
            onClick={(e) => e.stopPropagation()}
          >
            
            {/* Header Fixo do Modal */}
            <div 
              className="bg-gradient-to-r from-totvs-dark via-totvs-blue to-[#003B8E] text-white p-4 sm:p-5 shrink-0 relative flex items-center justify-between"
              onTouchMove={(e) => e.stopPropagation()}
              onWheel={(e) => e.stopPropagation()}
            >
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 sm:w-11 sm:h-11 rounded-2xl bg-totvs-cyan/20 border border-totvs-cyan/40 text-totvs-cyan flex items-center justify-center font-bold shadow-inner shrink-0">
                  <Icons.UserPlus />
                </div>
                <div>
                  <span className="text-[10px] font-bold uppercase tracking-widest px-2 py-0.5 rounded-full bg-totvs-cyan/20 text-totvs-cyan border border-totvs-cyan/30">
                    Registro Diário de Acesso
                  </span>
                  <h3 className="font-extrabold text-base sm:text-lg text-white mt-0.5 leading-tight">
                    Registrar Visitante
                  </h3>
                  <p className="text-[11px] sm:text-xs text-slate-200">
                    Contabilização no Espaço Experiência TOTVS
                  </p>
                </div>
              </div>
              
              <button
                type="button"
                onClick={onClose}
                className="text-white/80 hover:text-white p-2 rounded-xl hover:bg-white/10 transition shrink-0 ml-2 cursor-pointer"
                title="Fechar modal (ESC)"
              >
                <Icons.X />
              </button>
            </div>

            {/* Formulário com Rolagem Interna Exclusiva */}
            <form onSubmit={handleSubmit} className="flex flex-col flex-1 min-h-0 overflow-hidden">
              
              {/* Área com rolagem suave isolada (sem rolar o fundo da página) */}
              <div 
                className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 sm:space-y-5 scrollbar-thin"
                style={{ 
                  overscrollBehavior: 'contain', 
                  overscrollBehaviorY: 'contain',
                  WebkitOverflowScrolling: 'touch',
                  touchAction: 'pan-y'
                }}
              >
                
                {/* Campo Data */}
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                    <Icons.Calendar />
                    <span>Data da Visita *</span>
                  </label>
                  <input
                    type="date"
                    value={dataVisita}
                    onChange={(e) => setDataVisita(e.target.value)}
                    required
                    className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-totvs-blue focus:bg-white transition"
                  />
                </div>

                {/* Campo Nome da Empresa / Instituição */}
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                    <Icons.Building />
                    <span>Nome da Empresa / Instituição *</span>
                  </label>
                  <input
                    type="text"
                    placeholder="Ex: Raízen, Unimed, Magalu, Hospital ABC..."
                    value={empresa}
                    onChange={(e) => setEmpresa(e.target.value)}
                    required
                    className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 font-medium text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-totvs-blue focus:bg-white transition"
                  />
                </div>

                {/* Campo Número de Pessoas */}
                <div>
                  <div className="flex items-center justify-between mb-1.5">
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
                      <Icons.Users />
                      <span>Número de Pessoas *</span>
                    </label>
                    <span className="text-[11px] text-totvs-blue font-semibold">
                      Contabilizado no painel
                    </span>
                  </div>
                  <div className="relative">
                    <input
                      type="number"
                      min="1"
                      max="999"
                      value={numeroPessoas}
                      onChange={(e) => {
                        const val = parseInt(e.target.value, 10);
                        setNumeroPessoas(isNaN(val) ? '' : Math.max(1, val));
                      }}
                      onBlur={() => {
                        if (!numeroPessoas || numeroPessoas < 1) setNumeroPessoas(1);
                      }}
                      required
                      className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-totvs-blue focus:bg-white transition"
                    />
                    <div className="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-xs font-semibold text-slate-400">
                      pessoa(s)
                    </div>
                  </div>
                </div>

                {/* Campo Responsável / Anfitrião TOTVS */}
                <div>
                  <div className="flex items-center justify-between mb-1.5">
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
                      <Icons.UserCheck />
                      <span>Responsável / Anfitrião TOTVS *</span>
                    </label>
                    <span className="text-[10px] text-slate-400">
                      (Obrigatório • não soma aos visitantes)
                    </span>
                  </div>
                  <input
                    type="text"
                    placeholder="Ex: André Gianotti (ou Anfitrião Responsável)"
                    value={responsavel}
                    onChange={(e) => setResponsavel(e.target.value)}
                    required
                    className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 font-medium text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-totvs-blue focus:bg-white transition"
                  />
                </div>

                {/* Card em Destaque: Formulário Google Forms */}
                <div className="p-4 rounded-2xl bg-gradient-to-br from-slate-50 to-blue-50/40 border border-blue-200/70 space-y-3">
                  <div className="flex items-start justify-between gap-2">
                    <div className="flex items-center gap-2">
                      <span className="w-8 h-8 rounded-xl bg-totvs-blue text-white flex items-center justify-center text-xs font-bold shrink-0 shadow-sm">
                        <Icons.ExternalLink />
                      </span>
                      <div>
                        <h4 className="text-xs font-extrabold text-slate-800">
                          Formulário de Pré/Pós-Visita (Google Forms)
                        </h4>
                        <p className="text-[11px] text-slate-500">
                          Questionário institucional para preenchimento do visitante
                        </p>
                      </div>
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={handleOpenForm}
                      className="flex-1 flex items-center justify-center gap-2 bg-totvs-blue hover:bg-totvs-dark text-white text-xs font-bold py-2.5 px-3 rounded-xl transition shadow-sm cursor-pointer"
                    >
                      <span>Abrir Formulário</span>
                      <Icons.ExternalLink />
                    </button>
                    <button
                      type="button"
                      onClick={handleCopyLink}
                      className="px-3.5 py-2.5 rounded-xl bg-white hover:bg-slate-100 text-slate-700 font-semibold text-xs border border-slate-200 flex items-center gap-1.5 transition shrink-0 cursor-pointer"
                      title="Copiar link do formulário"
                    >
                      <Icons.Copy />
                      <span>{copiedFormLink ? 'Copiado!' : 'Copiar Link'}</span>
                    </button>
                  </div>
                </div>

                {/* Informação sobre visibilidade pública */}
                <p className="text-[11px] text-slate-500 flex items-center gap-1.5">
                  <Icons.CheckCircle />
                  <span>O total numérico de pessoas será somado imediatamente no painel à vista do topo.</span>
                </p>

              </div>

              {/* Footer de Ações Fixo na Base */}
              <div 
                className="shrink-0 bg-slate-50 px-4 sm:px-6 py-3.5 sm:py-4 border-t border-slate-200 flex items-center justify-between gap-3"
                onTouchMove={(e) => e.stopPropagation()}
                onWheel={(e) => e.stopPropagation()}
              >
                <button
                  type="button"
                  onClick={onClose}
                  disabled={salvando}
                  className="bg-white hover:bg-slate-100 text-slate-700 font-semibold text-xs px-4 py-2.5 rounded-xl border border-slate-200 transition cursor-pointer"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  disabled={salvando || !empresa.trim() || !responsavel.trim() || !dataVisita || !numeroPessoas}
                  className="flex-1 bg-gradient-to-r from-totvs-blue to-[#003B8E] hover:from-[#003B8E] hover:to-totvs-dark text-white font-extrabold text-xs px-5 py-2.5 rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2 disabled:opacity-50 cursor-pointer"
                >
                  <Icons.UserPlus />
                  <span>{salvando ? 'Salvando...' : 'Confirmar e Salvar Visita'}</span>
                </button>
              </div>

            </form>

          </div>
        </div>
      );
    }

    // --- COMPONENTE: ABA DO VÍDEO INSTITUCIONAL DA GESTÃO (PAINEL ADM) ---
    function AdminVideoTab({ videoGestao, admLogado, onVideoGestaoChange, showToast }) {
      const [tipo, setTipo] = useState(videoGestao?.tipo || 'arquivo');
      const [titulo, setTitulo] = useState(videoGestao?.titulo || 'Discurso da Gestão');
      const [mensagem, setMensagem] = useState(videoGestao?.mensagem || 'Veja seu discurso aqui');
      const [subtitulo, setSubtitulo] = useState(videoGestao?.subtitulo || 'Mensagem institucional da liderança aos visitantes do Espaço Experiência');
      const [urlLink, setUrlLink] = useState(videoGestao?.tipo === 'link' ? (videoGestao?.url || '') : '');
      const [videoAtivo, setVideoAtivo] = useState(videoGestao?.ativo !== false);
      
      const [arquivoSelecionado, setArquivoSelecionado] = useState(null);
      const [uploadProgress, setUploadProgress] = useState(0);
      const [uploading, setUploading] = useState(false);
      const [uploadMsg, setUploadMsg] = useState('');
      const [salvandoConfig, setSalvandoConfig] = useState(false);
      const [excluindoVideo, setExcluindoVideo] = useState(false);
      const [previewError, setPreviewError] = useState(false);

      useEffect(() => {
        setPreviewError(false);
        if (videoGestao) {
          setTipo(videoGestao.tipo || 'arquivo');
          setTitulo(videoGestao.titulo || 'Discurso da Gestão');
          setMensagem(videoGestao.mensagem || 'Veja seu discurso aqui');
          setSubtitulo(videoGestao.subtitulo || 'Mensagem institucional da liderança aos visitantes do Espaço Experiência');
          if (videoGestao.tipo === 'link') setUrlLink(videoGestao.url || '');
          setVideoAtivo(videoGestao.ativo !== false);
        }
      }, [videoGestao]);

      // Excluir Vídeo Atual (Apaga arquivo do disco e reseta URL)
      const handleExcluirVideo = async () => {
        const nomeAlvo = videoGestao?.nome_arquivo || (videoGestao?.tipo === 'link' ? 'link externo' : 'vídeo atual');
        if (!confirm(`Deseja realmente excluir o vídeo (${nomeAlvo})? Esta ação removerá o arquivo do servidor e limpará a exibição.`)) {
          return;
        }

        setExcluindoVideo(true);
        try {
          const res = await fetch('/api/admin/video', {
            method: 'DELETE',
            headers: {
              'Content-Type': 'application/json',
              'X-Admin': encodeURIComponent(admLogado?.nome || 'Administrador')
            }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            if (onVideoGestaoChange) onVideoGestaoChange();
            if (showToast) showToast('Vídeo institucional excluído com sucesso! 🗑️');
            setUrlLink('');
            setArquivoSelecionado(null);
            setUploadMsg('');
            setPreviewError(false);
          } else {
            alert(data.message || data.error || 'Erro ao excluir vídeo.');
          }
        } catch (err) {
          alert('Erro de conexão ao excluir vídeo.');
        } finally {
          setExcluindoVideo(false);
        }
      };

      // Upload com XHR (suporte a grandes arquivos de 713 MB com stream direto para disco e barra de progresso)
      const handleUploadFile = () => {
        if (!arquivoSelecionado) {
          alert('Por favor, selecione um arquivo de vídeo do seu computador antes de iniciar o upload.');
          return;
        }

        const fileSizeMB = (arquivoSelecionado.size / 1024 / 1024).toFixed(2);
        setUploading(true);
        setUploadProgress(0);
        setUploadMsg(`Iniciando upload de "${arquivoSelecionado.name}" (${fileSizeMB} MB)...`);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/admin/video/upload', true);
        xhr.setRequestHeader('X-Filename', encodeURIComponent(arquivoSelecionado.name));
        xhr.setRequestHeader('X-Author', encodeURIComponent(admLogado?.nome || 'Administrador'));
        xhr.setRequestHeader('Content-Type', arquivoSelecionado.type || 'application/octet-stream');
        xhr.timeout = 15 * 60 * 1000; // 15 minutos de timeout para uploads pesados

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            const loadedMB = (e.loaded / 1024 / 1024).toFixed(1);
            const totalMB = (e.total / 1024 / 1024).toFixed(1);
            setUploadProgress(percent);
            setUploadMsg(`Enviando: ${percent}% (${loadedMB} MB de ${totalMB} MB)...`);
          }
        };

        xhr.onload = () => {
          setUploading(false);
          try {
            const data = JSON.parse(xhr.responseText);
            if (xhr.status >= 200 && xhr.status < 300 && data.success) {
              setUploadProgress(100);
              setUploadMsg(`✅ Upload de "${data.nome_arquivo}" concluído com sucesso (${data.tamanho_mb} MB)!`);
              setArquivoSelecionado(null);
              if (onVideoGestaoChange) onVideoGestaoChange();
              if (showToast) showToast('Vídeo institucional carregado com sucesso! 🎬');
            } else {
              setUploadMsg(`❌ Erro no upload: ${data.message || data.error || 'Falha no processamento.'}`);
              alert(data.message || data.error || 'Erro no upload.');
            }
          } catch (err) {
            setUploadMsg('❌ Erro inesperado na resposta do servidor.');
          }
        };

        xhr.onerror = () => {
          setUploading(false);
          setUploadMsg('❌ Erro de conexão ao enviar vídeo.');
          alert('Falha na conexão durante o upload.');
        };

        xhr.ontimeout = () => {
          setUploading(false);
          setUploadMsg('❌ Tempo limite de envio excedido.');
          alert('Tempo limite de upload excedido.');
        };

        xhr.send(arquivoSelecionado);
      };

      // Salvar Configurações (Textos, URL Externa, Status Ativo)
      const handleSalvarConfig = async (e) => {
        if (e) e.preventDefault();
        setSalvandoConfig(true);
        try {
          const payload = {
            ativo: videoAtivo,
            tipo,
            titulo: titulo.trim(),
            mensagem: mensagem.trim(),
            subtitulo: subtitulo.trim(),
            autor: admLogado?.nome || 'Administrador'
          };

          if (tipo === 'link') {
            if (!urlLink.trim()) {
              alert('Por favor, informe a URL do vídeo externo (Google Drive, YouTube, etc.).');
              setSalvandoConfig(false);
              return;
            }
            payload.url = urlLink.trim();
          }

          const res = await fetch('/api/admin/video/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok && data.success) {
            if (onVideoGestaoChange) onVideoGestaoChange();
            if (showToast) showToast('Configurações do vídeo da gestão atualizadas com sucesso! ✅');
          } else {
            alert(data.error || 'Erro ao salvar configurações do vídeo.');
          }
        } catch (err) {
          alert('Erro de conexão ao salvar configurações.');
        } finally {
          setSalvandoConfig(false);
        }
      };

      return (
        <div className="space-y-6">
          {/* Card de Apresentação e Boas Práticas */}
          <div className="p-4 rounded-2xl bg-gradient-to-r from-slate-900 via-totvs-dark to-slate-900 text-white shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4 border border-totvs-cyan/30">
            <div>
              <div className="flex items-center gap-2 mb-1">
                <span className="text-[10px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-full bg-totvs-cyan/20 text-totvs-cyan border border-totvs-cyan/30">
                  Vídeo Institucional da Liderança
                </span>
                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${videoAtivo ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-700 text-slate-300'}`}>
                  {videoAtivo ? 'Exibição Ativa no Topo ✅' : 'Exibição Oculta ⏸️'}
                </span>
              </div>
              <h4 className="font-black text-base text-white">
                Gestão do Vídeo de Boas-Vindas & Discurso
              </h4>
              <p className="text-xs text-slate-300 mt-0.5 max-w-xl">
                Configurado para exibir miniatura no topo com a mensagem <strong>"{mensagem}"</strong>. Suporta arquivo pesado (.MOV de 713 MB ou .MP4) com streaming HTTP 206 sem travamentos.
              </p>
            </div>

            <label className="flex items-center gap-2.5 bg-white/10 hover:bg-white/15 px-3.5 py-2 rounded-xl border border-white/20 cursor-pointer select-none shrink-0 transition">
              <input
                type="checkbox"
                checked={videoAtivo}
                onChange={(e) => setVideoAtivo(e.target.checked)}
                className="w-4 h-4 rounded text-totvs-cyan focus:ring-totvs-cyan"
              />
              <span className="text-xs font-bold text-white">Ativo no Topo</span>
            </label>
          </div>

          {/* Seletor de Modo: Arquivo Local vs Link Externo */}
          <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-4">
            <h5 className="text-xs font-bold uppercase tracking-wider text-slate-700 flex items-center gap-1.5">
              <Icons.Film />
              <span>Origem do Vídeo Institucional</span>
            </h5>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <button
                type="button"
                onClick={() => setTipo('arquivo')}
                className={`p-3.5 rounded-xl border text-left transition flex items-start gap-3 cursor-pointer ${
                  tipo === 'arquivo'
                    ? 'border-totvs-blue bg-blue-50/70 text-totvs-blue shadow-xs ring-2 ring-totvs-blue/20'
                    : 'border-slate-200 bg-white hover:bg-slate-50 text-slate-700'
                }`}
              >
                <div className={`w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${tipo === 'arquivo' ? 'bg-totvs-blue text-white' : 'bg-slate-100 text-slate-500'}`}>
                  <Icons.Upload />
                </div>
                <div>
                  <span className="font-extrabold text-xs block">Arquivo no Servidor Local</span>
                  <span className="text-[11px] text-slate-500 block mt-0.5">
                    Upload de .MP4 ou .MOV. <strong>Recomendado:</strong> use .MP4 (H.264) para compatibilidade universal em navegadores Windows.
                  </span>
                </div>
              </button>

              <button
                type="button"
                onClick={() => setTipo('link')}
                className={`p-3.5 rounded-xl border text-left transition flex items-start gap-3 cursor-pointer ${
                  tipo === 'link'
                    ? 'border-totvs-blue bg-blue-50/70 text-totvs-blue shadow-xs ring-2 ring-totvs-blue/20'
                    : 'border-slate-200 bg-white hover:bg-slate-50 text-slate-700'
                }`}
              >
                <div className={`w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${tipo === 'link' ? 'bg-totvs-blue text-white' : 'bg-slate-100 text-slate-500'}`}>
                  <Icons.Link />
                </div>
                <div>
                  <span className="font-extrabold text-xs block">Link Externo / Nuvem (Altamente Recomendado)</span>
                  <span className="text-[11px] text-slate-500 block mt-0.5">
                    Google Drive Corporativo TOTVS ou YouTube (não-listado). Processamento em nuvem e compatibilidade total.
                  </span>
                </div>
              </button>
            </div>

            {/* Painel do Modo Arquivo Local */}
            {tipo === 'arquivo' && (
              <div className="mt-4 p-4 rounded-xl bg-white border border-slate-200 space-y-4">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
                  <div>
                    <h6 className="font-bold text-xs text-slate-800">Upload de Arquivo Pesado (.MP4 / .MOV)</h6>
                    <p className="text-[11px] text-slate-500">
                      Formatos aceitos: MP4, QuickTime (.MOV), WebM. Limite: até 1.5 GB.
                    </p>
                  </div>
                  {videoGestao?.url && videoGestao.tipo === 'arquivo' && (
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="text-[11px] font-mono text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200 shrink-0">
                        Arquivo atual: {videoGestao.nome_arquivo || 'video_gestao'} ({videoGestao.tamanho_mb || '—'} MB)
                      </span>
                      <button
                        type="button"
                        onClick={handleExcluirVideo}
                        disabled={excluindoVideo}
                        className="px-2.5 py-1 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-bold transition flex items-center gap-1 cursor-pointer disabled:opacity-50 shrink-0"
                        title="Excluir arquivo do servidor para liberar espaço"
                      >
                        <Icons.Trash />
                        <span>{excluindoVideo ? 'Excluindo...' : 'Excluir'}</span>
                      </button>
                    </div>
                  )}
                </div>

                <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                  <label className="flex-1 flex items-center justify-center gap-2 px-4 py-3 border-2 border-dashed border-slate-300 hover:border-totvs-blue rounded-xl bg-slate-50/50 hover:bg-blue-50/30 text-xs font-semibold text-slate-600 cursor-pointer transition">
                    <Icons.Upload />
                    <span className="truncate">
                      {arquivoSelecionado ? `${arquivoSelecionado.name} (${(arquivoSelecionado.size / 1024 / 1024).toFixed(2)} MB)` : 'Selecionar arquivo do computador (.MOV, .MP4)...'}
                    </span>
                    <input
                      type="file"
                      accept="video/quicktime,video/mp4,video/*,.mov,.mp4"
                      className="hidden"
                      onChange={(e) => {
                        const file = e.target.files && e.target.files[0];
                        if (file) {
                          setArquivoSelecionado(file);
                          setUploadMsg('');
                          setUploadProgress(0);
                        }
                      }}
                      disabled={uploading}
                    />
                  </label>

                  <button
                    type="button"
                    onClick={handleUploadFile}
                    disabled={!arquivoSelecionado || uploading}
                    className={`px-5 py-3 rounded-xl font-bold text-xs text-white shadow-sm transition flex items-center justify-center gap-2 shrink-0 ${
                      !arquivoSelecionado || uploading
                        ? 'bg-slate-300 cursor-not-allowed opacity-70'
                        : 'bg-totvs-blue hover:bg-totvs-dark cursor-pointer'
                    }`}
                  >
                    <Icons.Upload />
                    <span>{uploading ? 'Enviando...' : 'Iniciar Upload'}</span>
                  </button>
                </div>

                {/* Barra de Progresso Real em % */}
                {uploading && (
                  <div className="space-y-1.5 animate-in fade-in duration-150">
                    <div className="flex items-center justify-between text-[11px] font-bold text-slate-700">
                      <span>Progresso do Envio:</span>
                      <span className="font-mono text-totvs-blue">{uploadProgress}%</span>
                    </div>
                    <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden border border-slate-200 p-0.5">
                      <div
                        className="h-full bg-gradient-to-r from-totvs-blue to-totvs-cyan rounded-full transition-all duration-150 ease-out shadow-xs"
                        style={{ width: `${uploadProgress}%` }}
                      ></div>
                    </div>
                  </div>
                )}

                {uploadMsg && (
                  <div className={`p-3 rounded-xl text-xs font-medium ${
                    uploadMsg.includes('✅')
                      ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
                      : uploadMsg.includes('❌')
                      ? 'bg-rose-50 text-rose-700 border border-rose-200'
                      : 'bg-blue-50 text-totvs-blue border border-blue-200'
                  }`}>
                    {uploadMsg}
                  </div>
                )}

                <div className="p-3 rounded-xl bg-slate-50 border border-slate-200 text-[11px] text-slate-600 space-y-1">
                  <div className="flex items-center gap-1.5 font-bold text-slate-700">
                    <Icons.CheckCircle />
                    <span>Compatibilidade e Proteção GitHub:</span>
                  </div>
                  <p>
                    • Arquivos de vídeo enviados ficam armazenados em <code className="text-totvs-blue font-mono font-bold">uploads/videos/</code>, diretório já configurado no <code className="text-slate-800 font-mono">.gitignore</code> para proteger o limite de 100 MB do GitHub.
                  </p>
                  <p>
                    • O servidor local entrega o vídeo via <strong>HTTP Range Requests (status 206)</strong>, permitindo adiantar, retroceder e reproduzir instantaneamente vídeos pesados sem travamentos.
                  </p>
                </div>
              </div>
            )}

            {/* Painel do Modo Link Externo */}
            {tipo === 'link' && (
              <div className="mt-4 p-4 rounded-xl bg-white border border-slate-200 space-y-3">
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
                  <Icons.Link />
                  <span>URL do Vídeo Externo (Google Drive, YouTube ou CDN) *</span>
                </label>
                <input
                  type="url"
                  placeholder="Ex: https://drive.google.com/file/d/.../view ou https://youtu.be/..."
                  value={urlLink}
                  onChange={(e) => setUrlLink(e.target.value)}
                  className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 font-mono text-slate-800 focus:outline-none focus:ring-2 focus:ring-totvs-blue focus:bg-white transition"
                />
                <p className="text-[11px] text-slate-500">
                  💡 <strong>Google Drive:</strong> Links de visualização compartilhada no padrão <code className="font-mono">drive.google.com/file/d/.../view</code> são automaticamente convertidos para exibição embutida no lightbox cinema.
                </p>
              </div>
            )}
          </div>

          {/* Textos Institucionais & Mensagens do Topo */}
          <form onSubmit={handleSalvarConfig} className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-4">
            <h5 className="text-xs font-bold uppercase tracking-wider text-slate-700 flex items-center gap-1.5">
              <Icons.Edit />
              <span>Textos Institucionais e Chamadas no Topo</span>
            </h5>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">
                  Mensagem em Destaque na Miniatura (Banner do Topo) *
                </label>
                <input
                  type="text"
                  value={mensagem}
                  onChange={(e) => setMensagem(e.target.value)}
                  required
                  placeholder="Ex: Veja seu discurso aqui"
                  className="w-full text-xs bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-totvs-blue transition"
                />
                <span className="text-[10px] text-slate-400 mt-0.5 block">
                  Exibida em destaque na miniatura ao lado do título da vitrine.
                </span>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">
                  Título Institucional do Vídeo *
                </label>
                <input
                  type="text"
                  value={titulo}
                  onChange={(e) => setTitulo(e.target.value)}
                  required
                  placeholder="Ex: Discurso da Gestão"
                  className="w-full text-xs bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-totvs-blue transition"
                />
                <span className="text-[10px] text-slate-400 mt-0.5 block">
                  Exibido no topo do player lightbox de cinema.
                </span>
              </div>
            </div>

            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1">
                Subtítulo / Descrição Explicativa
              </label>
              <textarea
                rows="2"
                value={subtitulo}
                onChange={(e) => setSubtitulo(e.target.value)}
                placeholder="Ex: Mensagem institucional da liderança aos visitantes do Espaço Experiência"
                className="w-full text-xs bg-white border border-slate-200 rounded-xl p-3 text-slate-700 focus:outline-none focus:ring-2 focus:ring-totvs-blue transition"
              ></textarea>
            </div>

            {/* Pré-visualização do Vídeo Atual se houver URL */}
            {videoGestao?.url ? (
              <div className="p-3.5 rounded-xl bg-white border border-slate-200 space-y-3">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2 border-b border-slate-100">
                  <div>
                    <span className="text-[11px] font-bold text-slate-700 uppercase tracking-wider block">
                      Pré-visualização do Vídeo Ativo:
                    </span>
                    <span className="text-[10px] text-slate-400">
                      {videoGestao.tipo === 'link' ? 'Origem: Link Externo' : `Arquivo: ${videoGestao.nome_arquivo || 'Local'} (${videoGestao.tamanho_mb || '—'} MB)`}
                    </span>
                  </div>
                  <button
                    type="button"
                    onClick={handleExcluirVideo}
                    disabled={excluindoVideo}
                    className="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-bold transition flex items-center gap-1.5 cursor-pointer disabled:opacity-50 self-start sm:self-auto"
                    title="Excluir vídeo para liberar espaço ou subir outro"
                  >
                    <Icons.Trash />
                    <span>{excluindoVideo ? 'Excluindo...' : '🗑️ Excluir Vídeo Atual'}</span>
                  </button>
                </div>

                <div className="rounded-xl overflow-hidden bg-black max-w-md mx-auto aspect-video relative flex items-center justify-center">
                  {videoGestao.tipo === 'link' ? (
                    <iframe
                      src={videoGestao.url.includes('drive.google.com/file/d/') ? videoGestao.url.replace(/\/view(\?.*)?$/, '/preview') : videoGestao.url}
                      title="Prévia"
                      className="w-full h-full border-0"
                      allowFullScreen
                    />
                  ) : previewError ? (
                    <div className="p-4 text-center text-slate-300 space-y-2">
                      <div className="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center mx-auto text-amber-400">
                        <Icons.AlertCircle />
                      </div>
                      <p className="text-xs font-bold text-white">Incompatibilidade de Codec no Navegador</p>
                      <p className="text-[11px] text-slate-400 leading-tight">
                        Este arquivo (.MOV com codec Apple HEVC) não decodifica no Chrome para Windows. Recomendamos <strong>excluir</strong> e substituir por <strong>.MP4 (H.264)</strong> ou link do <strong>Google Drive / YouTube</strong>.
                      </p>
                    </div>
                  ) : (
                    <video
                      src={videoGestao.url}
                      controls
                      onError={() => setPreviewError(true)}
                      className="w-full h-full object-contain bg-black"
                    >
                      Seu navegador não suporta este formato de vídeo.
                    </video>
                  )}
                </div>
              </div>
            ) : (
              <div className="p-4 rounded-xl bg-white border border-slate-200 text-center text-slate-500 text-xs">
                Nenhum vídeo institucional vinculado no momento. Selecione um arquivo .MP4 ou informe um link externo acima.
              </div>
            )}

            {/* Botão Salvar Configurações */}
            <div className="pt-2 flex items-center justify-end">
              <button
                type="submit"
                disabled={salvandoConfig}
                className="px-6 py-2.5 bg-totvs-blue hover:bg-totvs-dark text-white font-bold text-xs rounded-xl shadow-md transition flex items-center gap-2 cursor-pointer disabled:opacity-50"
              >
                <Icons.CheckCircle />
                <span>{salvandoConfig ? 'Gravando Alterações...' : 'Salvar Configurações do Vídeo'}</span>
              </button>
            </div>
          </form>
        </div>
      );
    }

    // --- COMPONENTE: PAINEL ADMINISTRATIVO (ADMS, CONVITES, VISITAS, AUDITORIA & VÍDEO) ---
    function AdminModal({
      admLogado,
      activeTab = 'adms',
      onTabChange,
      admsList = [],
      onAdmsChange,
      convitesList = [],
      onConvitesChange,
      metricsData = {},
      accessLogs = [],
      auditLogs = [],
      segmentos = [],
      visitorsList = [],

        window.addEventListener('keydown', handleKeyDown);
        return () => {

        const nomeEmpresa = vis.empresa || vis.nome;
        if (!confirm(`Deseja realmente remover o registro de visita de "${nomeEmpresa}"?`)) return;
        setDeletingVisitorId(vis.id);
        try {
          const res = await fetch(`/api/visitors/${vis.id}`, { method: 'DELETE' });
          const data = await res.json();
          if (res.ok && data.success) {
            if (onVisitorsChange) onVisitorsChange();
            if (showToast) showToast(`Registro de "${nomeEmpresa}" removido com sucesso.`);
          } else {
            alert(data.error || 'Erro ao excluir registro de visitante.');
          }
        } catch (err) {
          alert('Falha na comunicação com o servidor ao excluir visitante.');
        } finally {
          setDeletingVisitorId(null);
        }
      };

      const filteredVisitors = useMemo(() => {
        if (!filterVisitors.trim()) return visitorsList;
        const q = filterVisitors.toLowerCase();
        return visitorsList.filter(v =>
          (v.empresa && v.empresa.toLowerCase().includes(q)) ||
          (v.nome && v.nome.toLowerCase().includes(q)) ||
          (v.responsavel && v.responsavel.toLowerCase().includes(q)) ||
          (v.data && v.data.toLowerCase().includes(q))

      const handleGerarConvite = async () => {
        setGerandoConvite(true);
        try {
          const res = await fetch('/api/admin/invite', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },

            if (onConvitesChange) onConvitesChange();
            if (showToast) showToast('Link de convite gerado com sucesso! 🔗');
          } else {
            alert(data.error || 'Erro ao gerar convite.');
          }
        } catch (err) {
          alert('Falha de conexão ao gerar link de convite.');
        } finally {
          setGerandoConvite(false);
        }
      };

      const handleCopyLink = (tokenOrLink) => {
        const url = (tokenOrLink && tokenOrLink.startsWith('http'))
          ? tokenOrLink
          : `${window.location.origin}${window.location.pathname}?convite=${tokenOrLink}`;
        
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(() => {
            setCopiedToken(tokenOrLink);
            setTimeout(() => setCopiedToken(null), 3000);
            if (showToast) showToast('Link copiado para a área de transferência! 📋');

      const handleDeleteAdm = async (adm) => {
        if (!admsList || admsList.length <= 1) {
          alert('Ação bloqueada: Não é permitido remover o único administrador do sistema!');
          return;

        const isSelf = adm.id === admLogado?.id || adm.email === admLogado?.email;
        const msg = isSelf

        try {
          const res = await fetch(`/api/admin/users/${adm.id}`, { method: 'DELETE' });

                        <span className="text-[10px] uppercase font-bold text-slate-400 tracking-wider block">Esta Semana</span>
                        <div className="text-2xl font-black text-slate-800 flex items-baseline gap-1">
                          <span>{visitorMetrics?.semana || 0}</span>
                          <span className="text-[10px] text-slate-400 font-medium">pessoas</span>
                        </div>
                      </div>

                      <div className="p-3.5 rounded-xl bg-white border border-slate-200 shadow-sm">
                        <span className="text-[10px] uppercase font-bold text-slate-400 tracking-wider block">Este Mês</span>
                        <div className="text-2xl font-black text-slate-800 flex items-baseline gap-1">
                          <span>{visitorMetrics?.mes || 0}</span>
                          <span className="text-[10px] text-slate-400 font-medium">pessoas</span>
                        </div>
                      </div>

                      <div className="p-3.5 rounded-xl bg-white border border-slate-200 shadow-sm">
                        <div className="flex items-center justify-between">
                          <span className="text-[10px] uppercase font-bold text-slate-400 tracking-wider block">Ano</span>
                          <span className="text-[9px] font-black px-1.5 py-0.2 rounded-full bg-totvs-blue/10 text-totvs-blue">
                            {visitorMetrics?.ano_atual || new Date().getFullYear()}
                          </span>
                        </div>
                        <div className="text-2xl font-black text-slate-800 flex items-baseline gap-1">
                          <span>{visitorMetrics?.ano !== undefined ? visitorMetrics.ano : (visitorMetrics?.total || 0)}</span>
                          <span className="text-[10px] text-slate-400 font-medium">pessoas</span>
                        </div>
                      </div>

                      <div className="p-3.5 rounded-xl bg-gradient-to-br from-totvs-blue to-[#003B8E] text-white shadow-sm">
                        <span className="text-[10px] uppercase font-bold text-blue-200 tracking-wider block">Total Geral</span>
                        <div className="text-2xl font-black text-white flex items-baseline gap-1">
                          <span>{visitorMetrics?.total !== undefined ? visitorMetrics.total : visitorsList.reduce((acc, v) => acc + (v.numero_pessoas || 1), 0)}</span>
                          <span className="text-[10px] text-totvs-cyan font-medium">pessoas</span>
                        </div>
                      </div>
                    </div>

                    {/* Barra de Filtro e Tabela de Visitantes */}
                    <div className="space-y-3 pt-2">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <h5 className="font-bold text-xs uppercase tracking-wider text-slate-500">
                          Lista de Cadastros ({filteredVisitors.length})
                        </h5>
                        <input
                          type="text"
                          placeholder="Buscar por empresa, data, responsável..."
                          value={filterVisitors}
                          onChange={(e) => setFilterVisitors(e.target.value)}
                          className="text-xs px-3 py-1.5 rounded-xl border border-slate-200 focus:outline-none focus:border-totvs-blue w-full sm:w-64 bg-white"
                        />
                      </div>

                      {(!filteredVisitors || filteredVisitors.length === 0) ? (
                        <div className="p-8 text-center bg-white border border-slate-200 rounded-2xl text-slate-400 text-xs">
                          {filterVisitors ? 'Nenhum visitante encontrado para o filtro digitado.' : 'Nenhum visitante presencial cadastrado até o momento.'}
                        </div>
                      ) : (
                        <div className="divide-y divide-slate-100 border border-slate-200 rounded-2xl overflow-hidden bg-white shadow-sm max-h-72 overflow-y-auto">
                          {filteredVisitors.slice().reverse().map((vis) => (
                            <div key={vis.id} className="p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50 transition">
                              <div className="flex items-center gap-3">
                                <span className="w-9 h-9 rounded-xl bg-blue-50 text-totvs-blue flex items-center justify-center font-bold text-xs shrink-0 border border-blue-100">
                                  <Icons.Building />
                                </span>
                                <div>
                                  <div className="flex items-center gap-2 flex-wrap">
                                    <span className="font-extrabold text-xs text-slate-900">
                                      {vis.empresa || vis.nome}
                                    </span>
                                    <span className="text-[10px] font-extrabold bg-cyan-50 text-totvs-blue px-2 py-0.5 rounded-full border border-totvs-cyan/30 flex items-center gap-1">
                                      <Icons.Users />
                                      <span>{vis.numero_pessoas || 1} { (vis.numero_pessoas || 1) === 1 ? 'pessoa' : 'pessoas' }</span>
                                    </span>
                                    <span className="text-[10px] font-bold bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full border border-slate-200">
                                      {vis.data ? vis.data.split('-').reverse().join('/') : '—'}
                                    </span>
                                  </div>
                                  <p className="text-[11px] text-slate-500 mt-0.5">
                                    Anfitrião TOTVS: <strong className="text-slate-700">{vis.responsavel || 'Equipe TOTVS'}</strong>
                                    {vis.criado_em ? ` • Registrado em: ${new Date(vis.criado_em).toLocaleDateString('pt-BR')}` : ''}
                                  </p>
                                </div>
                              </div>

                              <div className="flex items-center gap-2 self-end sm:self-center">
                                {vis.link_formulario && (
                                  <a
                                    href={vis.link_formulario}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold text-[11px] flex items-center gap-1 transition"
                                    title="Abrir Formulário Google"
                                  >
                                    <Icons.ExternalLink />
                                    <span className="hidden sm:inline">Formulário</span>
                                  </a>
                                )}
                                <button
                                  type="button"
                                  disabled={deletingVisitorId === vis.id}
                                  onClick={() => handleDeleteVisitor(vis)}
                                  className="p-1.5 text-rose-500 hover:text-rose-700 hover:bg-rose-50 rounded-xl transition disabled:opacity-50 cursor-pointer"
                                  title="Excluir este registro"
                                >
                                  <Icons.Trash />
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>

                  {/* SEÇÃO 2: HISTÓRICO DE SESSÕES WEB (ACESSOS SILENCIOSOS) */}
                  <div className="space-y-4 pt-2">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                      <div>
                        <h4 className="font-bold text-xs uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                          <Icons.Monitor />
                          <span>Sessões Web Silenciosas ({filteredAccessLogs.length})</span>
                        </h4>
                        <p className="text-[11px] text-slate-400">
                          Total de acessos únicos por sessão de navegador ({totalVisitasCount})
                        </p>
                      </div>
                      <input
                        type="text"
                        placeholder="Filtrar por data, tipo, IP..."
                        value={filterVisitas}
                        onChange={(e) => setFilterVisitas(e.target.value)}
                        className="text-xs px-3 py-1.5 rounded-xl border border-slate-200 focus:outline-none focus:border-totvs-blue w-full sm:w-64"
                      />
                    </div>

                    {(!filteredAccessLogs || filteredAccessLogs.length === 0) ? (
                      <div className="p-6 text-center bg-slate-50 border border-slate-200 rounded-2xl text-slate-400 text-xs">
                        Nenhum registro de acesso web encontrado.
                      </div>
                    ) : (
                      <div className="divide-y divide-slate-100 border border-slate-200 rounded-2xl overflow-hidden bg-white shadow-sm max-h-64 overflow-y-auto">
                        {filteredAccessLogs.slice().reverse().map((log, idx) => (
                          <div key={idx} className="p-3 flex items-center justify-between text-xs hover:bg-slate-50 transition">
                            <div className="flex items-center gap-3">
                              <span className="w-7 h-7 rounded-lg bg-blue-50 text-totvs-blue flex items-center justify-center font-bold text-xs shrink-0">
                                <Icons.Eye />
                              </span>
                              <div>
                                <span className="font-semibold text-slate-800 block">
                                  {log.tipo || log.acao || 'Visita Institucional de Visitante'}
                                </span>
                                <span className="text-[10px] text-slate-400 font-mono">
                                  {log.ip || log.ip_dispositivo || log.origem || 'Navegador Web'} {log.usuario ? `• ${log.usuario}` : ''}
                                </span>
                              </div>
                            </div>
                            <span className="text-[11px] text-slate-500 font-mono shrink-0">
                              {log.data_formatada && log.horario_formatado ? `${log.data_formatada} às ${log.horario_formatado}` : (log.data ? new Date(log.data).toLocaleString('pt-BR') : 'Hoje')}
                            </span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* ABA 4: AUDITORIA DE EDIÇÕES */}
              {activeTab === 'audit' && (
                <div className="space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                    <div>
                      <h4 className="font-bold text-slate-800 text-sm">Histórico de Alterações de Conteúdo</h4>
                      <p className="text-xs text-slate-500">Rastreamento de edições feitas nas estações pelos administradores</p>
                    </div>
                    <input
                      type="text"
                      placeholder="Filtrar por estação, autor..."
                      value={filterAudit}
                      onChange={(e) => setFilterAudit(e.target.value)}
                      className="text-xs px-3 py-1.5 rounded-xl border border-slate-200 focus:outline-none focus:border-totvs-blue w-full sm:w-64"
                    />
                  </div>

                  {(!filteredAuditLogs || filteredAuditLogs.length === 0) ? (
                    <div className="p-8 text-center bg-slate-50 border border-slate-200 rounded-2xl text-slate-400 text-xs">
                      Nenhuma alteração registrada até o momento.
                    </div>
                  ) : (
                    <div className="divide-y divide-slate-100 border border-slate-200 rounded-2xl overflow-hidden bg-white shadow-sm max-h-96 overflow-y-auto">
                      {filteredAuditLogs.slice().reverse().map((audit, idx) => (
                        <div key={idx} className="p-4 hover:bg-slate-50 transition space-y-1">
                          <div className="flex items-center justify-between text-xs">
                            <span className="font-bold text-slate-800 flex items-center gap-2">
                              <span className="w-2 h-2 rounded-full bg-totvs-blue"></span>
                              {audit.segmento || 'Estação'}
                            </span>
                            <span className="text-[10px] text-slate-400 font-mono">
                              {audit.data ? new Date(audit.data).toLocaleString('pt-BR') : ''}
                            </span>
                          </div>
                          <p className="text-xs text-slate-600 pl-4">
                            {audit.acao || 'Edição realizada'}
                          </p>
                          <span className="text-[10px] text-slate-400 pl-4 block">
                            Por: <strong className="text-slate-700">{audit.usuario || 'Administrador'}</strong>
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {/* ABA 5: VÍDEO INSTITUCIONAL DA GESTÃO */}
              {activeTab === 'video' && (
                <AdminVideoTab
                  videoGestao={videoGestao}
                  admLogado={admLogado}
                  onVideoGestaoChange={onVideoGestaoChange}
                  showToast={showToast}
                />
              )}

            </div>

            {/* Footer do Modal */}
            <div className="bg-slate-100 p-4 border-t border-slate-200 flex items-center justify-between">
              <span className="text-[11px] text-slate-500">
                Espaço Experiência TOTVS • Painel Exclusivo de Gestão
              </span>
              <button
                onClick={onClose}
                className="bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold px-5 py-2.5 rounded-xl transition"
              >
                Fechar Painel
              </button>
            </div>

          </div>
        </div>
      );
    }

    // Renderizar Aplicação
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
