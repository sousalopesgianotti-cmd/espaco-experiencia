      let baseUrl = (typeof window !== 'undefined' && window.SERVER_WEB_APP_URL) ? window.SERVER_WEB_APP_URL : '';
      if (!baseUrl || baseUrl.includes('script.googleusercontent.com') || baseUrl.includes('userCodeAppPanel')) {
        if (typeof google !== 'undefined' && google.script) {
          baseUrl = 'https://script.google.com/a/macros/totvs.com.br/s/AKfycbw1MxTh0_1-PMbw-GqL7vsBVA6IzLA_4HkYv5BdxcGIaA70MKZK5UuFwAouIFS3bVrq/exec';
        } else {
          baseUrl = window.location.origin + window.location.pathname;
        }
      }
      baseUrl = baseUrl.split('?')[0];
      return baseUrl + '?convite=' + token;
    };

    const resolveMediaUrl = (url) => {
      if (!url || typeof url !== 'string') return '';
      const trimmed = url.trim();
      if (trimmed.startsWith('http://') || trimmed.startsWith('https://') || trimmed.startsWith('data:') || trimmed.startsWith('blob:')) {
        return trimmed;
      }
      const cleanPath = trimmed.replace(/^\.?\//, '');
      return 'https://raw.githubusercontent.com/sousalopesgianotti-cmd/espaco-experiencia/main/' + cleanPath;
    };

      if (!e.target.dataset.fallbackApplied) {
        e.target.dataset.fallbackApplied = 'true';

          e.target.src = 'https://espaco-experiencia.onrender.com/' + clean;

    // Componente dedicado para exibição e cópia de credenciais de PC da bancada
    function StationCredentialsBox({ credenciais, onEdit }) {
      const [copied, setCopied] = useState(null); // 'user' | 'pass' | null

      if (!credenciais) return null;

      const copyToClipboard = (text, type) => {
        if (!text) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            setCopied(type);
            setTimeout(() => setCopied(null), 1800);
          }).catch(() => fallbackCopy(text, type));
        } else {
          fallbackCopy(text, type);
        }
      };

      const fallbackCopy = (text, type) => {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          setCopied(type);
          setTimeout(() => setCopied(null), 1800);
        } catch (e) {
          console.error('Falha ao copiar:', e);
        }
      };

      return (
        <div className="bg-white rounded-xl border border-slate-200/90 shadow-2xs p-2.5 space-y-1.5">
          {/* Topo do Box: Identificação do Equipamento */}

                Bancada
              </span>
            </div>
          </div>

          {/* Bloco do Usuário (Valor Completo Sem Cortes) */}
          <div className="bg-slate-50/90 hover:bg-slate-50 p-1.5 rounded-lg border border-slate-200/60 transition space-y-0.5">
            <div className="flex items-center justify-between">
              <span className="text-[9px] font-extrabold text-slate-500 uppercase tracking-wider">

              </span>
              <button
                type="button"

                title="Copiar usuário"
              >
                {copied === 'user' ? (
                  <>
                    <Icons.Check />
                    <span className="text-[8.5px]">Copiado!</span>
                  </>
                ) : (
                  <>
                    <Icons.Copy />
                    <span className="text-[8.5px] text-slate-500 hover:text-totvs-blue">Copiar</span>
                  </>
                )}
              </button>
            </div>
            <div

      const handleFileUpload = async (file) => {
        if (!file) return;
        setUploading(true);
        setUploadMsg(`Enviando foto da bancada "${file.name}"... ⏳`);
        try {
          const res = await fetch('/api/upload', {
            method: 'POST',
            headers: {
              'X-Filename': encodeURIComponent(file.name),
              'Content-Type': file.type || 'application/octet-stream'
            },
            body: file
          });
          const data = await res.json();
          if (data.success && data.url) {
            setFotoBancada(data.url);
            setUploadMsg('Foto carregada com sucesso! ✅');
          } else {
            throw new Error(data.message || 'Falha ao processar imagem.');
          }
        } catch (err) {
          alert(`Erro ao fazer upload da foto: ${err.message}`);
          setUploadMsg('❌ Erro no upload. Tente novamente.');
        } finally {
          setUploading(false);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();

          nome: nome.trim(),

    }) {
      const [loading, setLoading] = useState(true);
      const [especialistas, setEspecialistas] = useState([]);
      const [escalas, setEscalas] = useState({});
      
      // Data atual do sistema em Brasília
      const today = new Date();
      const [viewYear, setViewYear] = useState(today.getFullYear());
      const [viewMonth, setViewMonth] = useState(today.getMonth());

      // Estado para edição de plantão pelo ADM
      const [editingDate, setEditingDate] = useState(null);
      const [selectedEspId, setSelectedEspId] = useState('');
      const [customTurno, setCustomTurno] = useState('08:00 as 17:30');
      const [customObs, setCustomObs] = useState('');
      const [savingEscala, setSavingEscala] = useState(false);

      // Estados para importação de planilha anual Excel (.xlsx)
      const fileInputRef = useRef(null);
      const [importPreview, setImportPreview] = useState(null);
      const [importandoLote, setImportandoLote] = useState(false);

      const nomesMeses = [
        'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
        'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
      ];
      const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

      const carregarDados = () => {
        setLoading(true);
        fetch('/api/plantonistas')
          .then(res => res.json())
          .then(data => {
            if (data && data.success) {
              setEspecialistas(data.especialistas || []);
              setEscalas(data.escalas || {});
            }
            setLoading(false);
          })
          .catch(() => {
            setLoading(false);
          });
      };

      useEffect(() => {
        carregarDados();
      }, []);

      const formatIsoDate = (y, m, d) => {
        const mm = String(m + 1).padStart(2, '0');
        const dd = String(d).padStart(2, '0');
        return `${y}-${mm}-${dd}`;
      };

      const todayIso = formatIsoDate(today.getFullYear(), today.getMonth(), today.getDate());
      const plantonistaHoje = escalas[todayIso];
      const especialistaHoje = plantonistaHoje?.especialista_id 
        ? especialistas.find(e => e.id === plantonistaHoje.especialista_id)
        : null;

      const daysMatrix = useMemo(() => {
        const firstDayIndex = new Date(viewYear, viewMonth, 1).getDay();
        const totalDays = new Date(viewYear, viewMonth + 1, 0).getDate();
        const matrix = [];
        for (let i = 0; i < firstDayIndex; i++) {
          matrix.push(null);
        }
        for (let d = 1; d <= totalDays; d++) {
          matrix.push(d);
        }
        return matrix;
      }, [viewYear, viewMonth]);

      const handlePrevMonth = () => {
        if (viewMonth === 0) {
          setViewMonth(11);
          setViewYear(prev => prev - 1);
        } else {
          setViewMonth(prev => prev - 1);
        }
      };

      const handleNextMonth = () => {
        if (viewMonth === 11) {
          setViewMonth(0);
          setViewYear(prev => prev + 1);
        } else {
          setViewMonth(prev => prev + 1);
        }
      };

      const handleGoToday = () => {
        setViewYear(today.getFullYear());
        setViewMonth(today.getMonth());
      };

      const podeEditarEscala = !authEspecialistaObrigatoria || !!admLogado;

      const handleOpenEditDate = (d) => {
        if (!podeEditarEscala) return;
        const iso = formatIsoDate(viewYear, viewMonth, d);
        setEditingDate(iso);
        const currentEscala = escalas[iso];
        setSelectedEspId(currentEscala?.especialista_id || '');
        setCustomTurno(currentEscala?.turno || '08:00 as 17:30');
        setCustomObs(currentEscala?.observacoes || '');
      };

      const handleSaveEscala = async (e) => {
        e.preventDefault();
        if (!editingDate) return;
        setSavingEscala(true);

        const espSelected = especialistas.find(esp => esp.id === selectedEspId);
        const nomeFinal = espSelected ? espSelected.nome : '';

        try {
          const res = await fetch('/api/plantonistas/escala', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              data: editingDate,
              especialista_id: selectedEspId || null,
              nome: nomeFinal,
              turno: customTurno,
              observacoes: customObs,
              autor: {
                nome: admLogado?.nome || 'Especialista',
                email: admLogado?.email || 'especialista@totvs.com.br'
              }
            })
          });
          const result = await res.json();
          if (result && result.success) {
            setEscalas(result.escalas);
            setEditingDate(null);
            if (showToast) showToast('Escala de plantão atualizada com sucesso! ✅');
          }
        } catch (err) {
          if (showToast) showToast('Erro ao atualizar escala de plantão.');
        } finally {
          setSavingEscala(false);
        }
      };

      // Leitura e Processamento da Planilha Excel (.xlsx) Oficial TOTVS
      const handleFileSelected = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        if (typeof XLSX === 'undefined') {
          if (showToast) showToast('Biblioteca de leitura Excel ainda carregando. Tente novamente em alguns segundos.');
          return;
        }

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = evt.target.result;
            const workbook = XLSX.read(data, { type: 'binary' });
            if (!workbook || !workbook.SheetNames || workbook.SheetNames.length === 0) {
              if (showToast) showToast('Planilha vazia ou em formato não reconhecido.');
              return;
            }

            // Procurar aba do ano ativo (ex: "Espaço Experiência 2026")
            const targetYear = viewYear;
            let sheetName = workbook.SheetNames.find(s => s.toLowerCase().includes(String(targetYear)));
            if (!sheetName) {
              sheetName = workbook.SheetNames.find(s => s.toLowerCase().includes('experiência') || s.toLowerCase().includes('experiencia')) || workbook.SheetNames[0];
            }

            const sheet = workbook.Sheets[sheetName];
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
            if (!rows || rows.length === 0) {
              if (showToast) showToast(`A aba "${sheetName}" não possui dados para importação.`);
              return;
            }

            const mesesMap = {
              'janeiro': '01', 'fevereiro': '02', 'março': '03', 'marco': '03',
              'abril': '04', 'maio': '05', 'junho': '06', 'julho': '07',
              'agosto': '08', 'setembro': '09', 'outubro': '10', 'novembro': '11', 'dezembro': '12'
            };

            const escalasMapeadas = {};
            const novosEsps = [];
            let currentMonth = '';
            let feriadosCount = 0;
            let normaisCount = 0;
            const amostra = [];

            for (let i = 0; i < rows.length; i++) {
              const row = rows[i];
              if (!row || row.length === 0) continue;

              const mRaw = (row[0] || row[1] || '').toString().trim().toLowerCase();
              if (mesesMap[mRaw]) {
                currentMonth = mesesMap[mRaw];
              }

              const dRaw = row[2];
              const dayNum = parseInt(dRaw, 10);
              if (!dayNum || isNaN(dayNum) || dayNum < 1 || dayNum > 31) continue;
              if (!currentMonth) continue;

              const dd = String(dayNum).padStart(2, '0');
              const isoDate = `${targetYear}-${currentMonth}-${dd}`;

              const rawNome = (row[4] || '').toString().trim();
              if (!rawNome) continue;

              const isFeriado = /feriado|ponte|fechado|recesso/i.test(rawNome);

              if (isFeriado) {
                escalasMapeadas[isoDate] = {
                  especialista_id: null,
                  nome: rawNome,
                  turno: 'Feriado',
                  status_rotulo: rawNome,
                  observacoes: '',
                  tipo: 'feriado'
                };
                feriadosCount++;
                if (amostra.length < 10) {
                  amostra.push({ data: isoDate, diaSemana: row[3] || '', nome: rawNome, tipo: 'feriado', turno: 'Feriado' });
                }
              } else {
                const email = (row[5] || '').toString().trim();
                const segmento = (row[6] || '').toString().trim();

                const espExistente = especialistas.find(esp => 
                  (email && esp.email && esp.email.trim().toLowerCase() === email.toLowerCase()) ||
                  (esp.nome && esp.nome.trim().toLowerCase() === rawNome.toLowerCase()) ||
                  (esp.nome && rawNome.toLowerCase().includes(esp.nome.trim().toLowerCase()))
                );

                let espId = espExistente ? espExistente.id : null;

                if (!espExistente) {
                  espId = 'esp-' + rawNome.toLowerCase().replace(/[^a-z0-9]/g, '-').slice(0, 25);
                  if (!novosEsps.some(n => n.id === espId || (email && n.email && n.email.toLowerCase() === email.toLowerCase()))) {
                    const avatarCores = ['bg-totvs-blue', 'bg-cyan-600', 'bg-emerald-600', 'bg-pink-600', 'bg-sky-600', 'bg-rose-600', 'bg-indigo-600', 'bg-teal-600', 'bg-amber-600', 'bg-purple-600'];
                    const cor = avatarCores[novosEsps.length % avatarCores.length];
                    novosEsps.push({
                      id: espId,
                      nome: rawNome,
                      cargo: segmento ? `Especialista • ${segmento}` : 'Especialista do Espaço Experiência',
                      email: email || '',
                      ramal: '',
                      avatar_cor: cor,
                      estacao_foco: segmento || 'Soluções TOTVS'
                    });
                  }
                }

                escalasMapeadas[isoDate] = {
                  especialista_id: espId,
                  nome: rawNome,
                  turno: '08:00 as 17:30',
                  observacoes: '',
                  tipo: 'normal'
                };
                normaisCount++;
                if (amostra.length < 10) {
                  amostra.push({ data: isoDate, diaSemana: row[3] || '', nome: rawNome, tipo: 'normal', turno: '08:00 as 17:30', segmento });
                }
              }
            }

            if (Object.keys(escalasMapeadas).length === 0) {
              if (showToast) showToast('Nenhuma data válida encontrada na aba selecionada da planilha.');
              return;
            }

            setImportPreview({
              ano: targetYear,
              sheetName,
              nomeArquivo: file.name,
              totalDias: Object.keys(escalasMapeadas).length,
              totalNormais: normaisCount,
              totalFeriados: feriadosCount,
              novosEspecialistas: novosEsps,
              escalasNovas: escalasMapeadas,
              amostra
            });

          } catch (err) {
            console.error('Erro ao processar planilha Excel:', err);
            if (showToast) showToast('Erro ao ler arquivo Excel: ' + (err.message || 'Formato incompatível'));
          } finally {
            if (e.target) e.target.value = '';
          }
        };
        reader.readAsBinaryString(file);
      };

      // Confirmação e Gravação em Lote no Backend
      const handleConfirmarImportacao = async () => {
        if (!importPreview) return;
        setImportandoLote(true);
        try {
          const res = await fetch('/api/plantonistas/importar-lote', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              ano: importPreview.ano,
              escalasNovas: importPreview.escalasNovas,
              novosEspecialistas: importPreview.novosEspecialistas,
              autor: {
                nome: admLogado?.nome || 'Administrador',
                email: admLogado?.email || 'admin@totvs.com.br'
              }
            })
          });
          const result = await res.json();
          if (result && result.success) {
            if (result.especialistas) setEspecialistas(result.especialistas);
            if (result.escalas) setEscalas(result.escalas);
            const totalGravado = importPreview.totalDias;
            const anoGravado = importPreview.ano;
            setImportPreview(null);
            if (showToast) showToast(`Escala de ${anoGravado} importada com sucesso! (${totalGravado} datas atualizadas) ✅`);
          } else {
            if (showToast) showToast(result?.message || 'Erro ao gravar escala.');
          }
        } catch (err) {
          if (showToast) showToast('Falha na comunicação com o servidor ao importar escala.');
        } finally {
          setImportandoLote(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-950/75 backdrop-blur-xs flex items-center justify-center p-3 sm:p-5 animate-in fade-in duration-200">
          <div className="bg-white rounded-3xl shadow-2xl max-w-5xl w-full border border-slate-200 overflow-hidden flex flex-col max-h-[92vh]">
            
            {/* CABEÇALHO DO MODAL */}
            <div className="bg-gradient-to-r from-totvs-dark via-totvs-cardDark to-totvs-blue text-white p-5 sm:p-6 flex items-center justify-between border-b border-slate-700">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-totvs-blue to-totvs-cyan flex items-center justify-center text-white shadow-md">
                  <Icons.CalendarDays />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h2 className="text-base sm:text-lg font-black tracking-tight text-white">
                      Calendário dos Plantonistas
                    </h2>
                    <span className="text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full bg-totvs-cyan/20 text-totvs-cyan border border-totvs-cyan/30">
                      Espaço Experiência
                    </span>
                  </div>
                  <p className="text-xs text-slate-300">
                    Gestão da escala anual dos especialistas de atendimento e demonstrações
                  </p>
                </div>
              </div>
              <button
                type="button"
                onClick={onClose}
                className="p-2 text-slate-300 hover:text-white rounded-xl hover:bg-white/10 transition cursor-pointer"
                title="Fechar"
              >
                <Icons.X />
              </button>
            </div>

            {/* CORPO DO MODAL (SCROLLABLE) */}
            <div className="p-4 sm:p-6 space-y-5 overflow-y-auto flex-1 bg-slate-50">

              {/* CARD DE DESTAQUE: PLANTONISTA DE HOJE */}
              <div className="bg-gradient-to-r from-totvs-blue via-totvs-vibrant to-totvs-cyan p-0.5 rounded-2xl shadow-md">
                <div className="bg-slate-900 rounded-[15px] p-4 sm:p-5 text-white flex flex-col sm:flex-row items-center justify-between gap-4">
                  <div className="flex items-center gap-4 text-center sm:text-left">
                    <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-totvs-blue via-blue-600 to-totvs-cyan text-white font-black text-xl flex items-center justify-center shadow-lg shrink-0">
                      {plantonistaHoje?.tipo === 'feriado' || plantonistaHoje?.turno === 'Feriado'
                        ? '⏸️'
                        : especialistaHoje ? especialistaHoje.nome.charAt(0) : 'P'}
                    </div>
                    <div>
                      <div className="flex items-center gap-2 justify-center sm:justify-start">
                        {plantonistaHoje?.tipo === 'feriado' || plantonistaHoje?.turno === 'Feriado' ? (
                          <span className="text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30 flex items-center gap-1.5">
                            <span className="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                            Recesso / Fechado Hoje ({today.toLocaleDateString('pt-BR')})
                          </span>
                        ) : (
                          <span className="text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 flex items-center gap-1.5">
                            <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                            Plantonista de Hoje ({today.toLocaleDateString('pt-BR')})
                          </span>
                        )}
                      </div>
                      <h3 className={`text-base sm:text-lg font-black mt-1 ${
                        plantonistaHoje?.tipo === 'feriado' || plantonistaHoje?.turno === 'Feriado'
                          ? 'text-amber-300 line-through decoration-amber-400/80'
                          : 'text-white'
                      }`}>
                        {plantonistaHoje ? plantonistaHoje.nome : 'Sem especialista escalado para hoje'}
                      </h3>
                      <p className="text-xs text-slate-300">
                        {plantonistaHoje?.tipo === 'feriado' || plantonistaHoje?.turno === 'Feriado'
                          ? 'Espaço Fechado / Sem plantão presencial'
                          : especialistaHoje ? especialistaHoje.cargo : 'Consulte a programação do mês abaixo'}
                      </p>
                    </div>
                  </div>

                  {plantonistaHoje && (
                    <div className="bg-white/10 rounded-xl p-3 border border-white/15 flex flex-wrap items-center gap-3 sm:gap-4 text-xs shrink-0 justify-center">
                      <div className="text-left">
                        <span className="text-[10px] uppercase text-totvs-cyan font-extrabold block">
                          {plantonistaHoje.tipo === 'feriado' || plantonistaHoje.turno === 'Feriado' ? 'Status' : 'Horário'}
                        </span>
                        <span className="font-bold text-white">
                          {plantonistaHoje.tipo === 'feriado' || plantonistaHoje.turno === 'Feriado'
                            ? (plantonistaHoje.status_rotulo || 'Recesso')
                            : (plantonistaHoje.turno || '08:00 as 17:30')}
                        </span>
                      </div>
                      {!(plantonistaHoje.tipo === 'feriado' || plantonistaHoje.turno === 'Feriado') && especialistaHoje?.ramal && (
                        <div className="text-left border-l border-white/20 pl-3">
                          <span className="text-[10px] uppercase text-totvs-cyan font-extrabold block">Ramal</span>
                          <span className="font-bold text-white flex items-center gap-1">
                            <Icons.Phone />
                            <span>{especialistaHoje.ramal}</span>
                          </span>
                        </div>
                      )}
                      {!(plantonistaHoje.tipo === 'feriado' || plantonistaHoje.turno === 'Feriado') && especialistaHoje?.estacao_foco && (
                        <div className="text-left border-l border-white/20 pl-3 hidden md:block">
                          <span className="text-[10px] uppercase text-totvs-cyan font-extrabold block">Foco</span>
                          <span className="font-bold text-slate-200 text-[11px] truncate max-w-[140px] block">{especialistaHoje.estacao_foco}</span>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>

              {/* NAVEGAÇÃO ENTRE MESES E ANO */}
              <div className="bg-white/95 backdrop-blur-xs rounded-2xl border border-slate-200 p-3.5 shadow-sm flex flex-wrap items-center justify-between gap-3 sticky top-0 z-20">
                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={handlePrevMonth}
                    className="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition cursor-pointer font-bold"
                    title="Mês Anterior"
                  >
                    <Icons.ChevronLeft />
                  </button>
                  <h3 className="text-base sm:text-lg font-black text-slate-800 min-w-[170px] text-center">
                    {nomesMeses[viewMonth]} {viewYear}
                  </h3>
                  <button
                    type="button"
                    onClick={handleNextMonth}
                    className="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition cursor-pointer font-bold"
                    title="Próximo Mês"
                  >
                    <Icons.ChevronRight />
                  </button>
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  <button
                    type="button"
                    onClick={handleGoToday}
                    className="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition cursor-pointer"
                  >
                    Ir para Hoje
                  </button>
                  {admLogado && (
                    <>
                      {/* Botão de Importar Planilha (.xlsx) exclusivo para ADM / Dono do Produto */}
                      {(admLogado.perfil === 'adm' || admLogado.dono_produto) && (
                        <>
                          <button
                            type="button"
                            onClick={() => fileInputRef.current?.click()}
                            className="px-3 py-1.5 rounded-xl bg-gradient-to-r from-totvs-blue to-totvs-vibrant hover:from-totvs-dark hover:to-totvs-blue text-white font-bold text-xs transition cursor-pointer flex items-center gap-1.5 shadow-xs"
                            title={`Importar escala anual a partir da planilha oficial TOTVS para o ano de ${viewYear}`}
                          >
                            <Icons.FileSpreadsheet />
                            <span>Importar Escala {viewYear} (.xlsx)</span>
                          </button>
                          <input
                            ref={fileInputRef}
                            type="file"
                            accept=".xlsx, .xls, .csv"
                            className="hidden"
                            onChange={handleFileSelected}
                          />
                        </>
                      )}
                      <span className={`text-[10.5px] font-bold px-2.5 py-1 rounded-lg border flex items-center gap-1 ${
                        admLogado.perfil === 'especialista'
                          ? 'text-purple-700 bg-purple-50 border-purple-200'
                          : 'text-emerald-700 bg-emerald-50 border-emerald-200'
                      }`}>
                        <Icons.Shield />
                        <span>
                          {admLogado.perfil === 'especialista'
                            ? 'Modo Plantonista Ativo (Especialista)'
                            : (admLogado.perfil === 'pmm' ? 'Modo Edição (PMM)' : 'Modo Edição Geral (ADM)')}
                        </span>
                      </span>
                    </>
                  )}
                  {!admLogado && !authEspecialistaObrigatoria && (
                    <span className="text-[10.5px] font-bold px-2.5 py-1 rounded-lg border flex items-center gap-1 text-purple-700 bg-purple-50 border-purple-200" title="Chave Mestra em Modo Aberto: Edição de plantão liberada para especialistas">
                      <Icons.Shield />
                      <span>Modo Especialista Aberto (Sem Login)</span>
                    </span>
                  )}
                </div>
              </div>

              {/* GRADE DO CALENDÁRIO */}
              <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                {/* Cabeçalho dos Dias da Semana */}
                <div className="grid grid-cols-7 border-b border-slate-200 bg-slate-100/80 text-center font-bold text-xs text-slate-600">
                  {diasSemana.map((dia, idx) => (
                    <div key={idx} className={`py-2.5 ${idx === 0 || idx === 6 ? 'text-slate-400 bg-slate-100/50' : ''}`}>
                      {dia}
                    </div>
                  ))}
                </div>

                {/* Células dos Dias */}
                <div className="grid grid-cols-7 divide-x divide-y divide-slate-100">
                  {daysMatrix.map((dayNum, idx) => {
                    if (!dayNum) {
                      return <div key={idx} className="min-h-[85px] bg-slate-50/50"></div>;
                    }

                    const isoDate = formatIsoDate(viewYear, viewMonth, dayNum);
                    const isToday = isoDate === todayIso;
                    const escalaDoDia = escalas[isoDate];
                    const isWeekend = (idx % 7 === 0) || (idx % 7 === 6);

                    return (
                      <div
                        key={idx}
                        onClick={() => podeEditarEscala && handleOpenEditDate(dayNum)}
                        className={`min-h-[85px] p-2 flex flex-col justify-between transition relative ${
                          isWeekend ? 'bg-slate-50/70' : 'bg-white hover:bg-slate-50'
                        } ${isToday ? 'ring-2 ring-totvs-cyan ring-inset bg-cyan-50/30' : ''} ${
                          podeEditarEscala ? 'cursor-pointer hover:border-totvs-cyan/60' : ''
                        }`}
                      >
                        {/* Topo da Célula: Número do Dia */}
                        <div className="flex items-center justify-between">
                          <span
                            className={`w-6 h-6 rounded-lg flex items-center justify-center text-xs font-black ${
                              isToday
                                ? 'bg-totvs-cyan text-slate-950 font-black shadow-xs'
                                : isWeekend ? 'text-slate-400' : 'text-slate-700'
                            }`}
                          >
                            {dayNum}
                          </span>
                          {podeEditarEscala && (
                            <span className="text-[9px] text-slate-400 hover:text-totvs-cyan transition">
                              ✏️
                            </span>
                          )}
                        </div>

                        {/* Conteúdo do Plantão */}
                        <div className="mt-1">
                          {escalaDoDia ? (
                            escalaDoDia.tipo === 'feriado' || escalaDoDia.turno === 'Feriado' ? (
                              <div
                                className="p-1 rounded-md text-[9.5px] leading-tight font-bold bg-amber-50/90 text-amber-950 border border-amber-300 ring-1 ring-amber-300/40 shadow-2xs"
                                title={`${escalaDoDia.status_rotulo || escalaDoDia.nome} • Espaço Fechado / Recesso`}
                              >
                                <p className="truncate line-through decoration-amber-600/80 decoration-1 font-black">
                                  {escalaDoDia.status_rotulo || escalaDoDia.nome}
                                </p>
                                <span className="text-[8px] uppercase tracking-wider text-amber-700/90 font-extrabold flex items-center gap-1 mt-0.5">
                                  <span className="w-1.5 h-1.5 rounded-full bg-amber-500 shrink-0"></span>
                                  Recesso
                                </span>
                              </div>
                            ) : (
                              <div
                                className={`p-1 rounded-md text-[10px] leading-tight font-bold border transition ${
                                  isToday
                                    ? 'bg-totvs-blue text-white border-totvs-blue shadow-xs'
                                    : 'bg-blue-50 text-totvs-blue border-blue-200 hover:bg-blue-100/60'
                                }`}
                                title={`${escalaDoDia.nome} • ${escalaDoDia.turno || '08:00 as 17:30'}${escalaDoDia.observacoes ? ` (${escalaDoDia.observacoes})` : ''}`}
                              >
                                <p className="truncate">{escalaDoDia.nome}</p>
                                <span className="text-[8.5px] opacity-80 block truncate font-medium">
                                  {escalaDoDia.turno || '08:00 as 17:30'}
                                </span>
                              </div>
                            )
                          ) : isWeekend ? (
                            <span className="text-[9px] text-slate-300 italic block">
                              Final de semana
                            </span>
                          ) : (
                            <span className="text-[9px] text-slate-300 italic block">
                              Livre
                            </span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

            </div>

            {/* PAINEL FLUTUANTE DE EDIÇÃO DE ESCALA (APENAS QUANDO ADM CLICA EM UM DIA) */}
            {editingDate && admLogado && (
              <div className="p-4 bg-slate-900 text-white border-t border-slate-700 animate-in slide-in-from-bottom duration-200">
                <form onSubmit={handleSaveEscala} className="max-w-4xl mx-auto flex flex-col sm:flex-row items-end gap-3">
                  <div className="flex-1 w-full sm:w-auto">
                    <label className="text-[10px] uppercase font-bold text-totvs-cyan block mb-1">
                      Data Selecionada: <span className="text-white">{editingDate}</span>
                    </label>
                    <select
                      value={selectedEspId}
                      onChange={(e) => setSelectedEspId(e.target.value)}
                      className="w-full bg-slate-800 border border-slate-700 text-white text-xs rounded-xl p-2 focus:ring-2 focus:ring-totvs-cyan"
                    >
                      <option value="">-- Selecione o Especialista --</option>
                      {especialistas.map((esp) => (
                        <option key={esp.id} value={esp.id}>
                          {esp.nome} ({esp.cargo})
                        </option>
                      ))}
                    </select>
                  </div>

                  <div className="w-full sm:w-44">
                    <label className="text-[10px] uppercase font-bold text-slate-300 block mb-1">
                      Turno / Horário
                    </label>
                    <input
                      type="text"
                      value={customTurno}
                      onChange={(e) => setCustomTurno(e.target.value)}
                      placeholder="08:00 as 17:30"
                      className="w-full bg-slate-800 border border-slate-700 text-white text-xs rounded-xl p-2 focus:ring-2 focus:ring-totvs-cyan"
                    />
                  </div>

                  <div className="flex-1 w-full sm:w-auto">
                    <label className="text-[10px] uppercase font-bold text-slate-300 block mb-1">
                      Observações / Foco
                    </label>
                    <input
                      type="text"
                      value={customObs}
                      onChange={(e) => setCustomObs(e.target.value)}
                      placeholder="Ex: Foco Manufatura & MES"
                      className="w-full bg-slate-800 border border-slate-700 text-white text-xs rounded-xl p-2 focus:ring-2 focus:ring-totvs-cyan"
                    />
                  </div>

                  <div className="flex items-center gap-2 shrink-0 w-full sm:w-auto">
                    <button
                      type="submit"
                      disabled={savingEscala}
                      className="flex-1 sm:flex-initial bg-gradient-to-r from-totvs-cyan to-teal-300 text-slate-950 font-black text-xs px-4 py-2 rounded-xl hover:opacity-90 transition cursor-pointer"
                    >
                      {savingEscala ? 'Salvando...' : 'Salvar'}
                    </button>
                    <button
                      type="button"
                      onClick={() => setEditingDate(null)}
                      className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold transition cursor-pointer"
                    >
                      Cancelar
                    </button>
                  </div>
                </form>
              </div>
            )}

            {/* RODAPÉ DO MODAL */}
            <div className="p-4 bg-white border-t border-slate-200 flex flex-wrap items-center justify-between gap-3 text-xs text-slate-500">
              <div className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                <span>Plantonistas atualizados diariamente pela gestão do Espaço Experiência.</span>
              </div>
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition cursor-pointer"
              >
                Fechar
              </button>
            </div>

            {/* MODAL DE PRÉ-VISUALIZAÇÃO DA IMPORTAÇÃO EXCEL */}
            {importPreview && (
              <div className="fixed inset-0 z-60 bg-slate-950/80 backdrop-blur-xs flex items-center justify-center p-3 sm:p-5 animate-in fade-in duration-150">
                <div className="bg-white rounded-3xl shadow-2xl max-w-2xl w-full border border-slate-200 overflow-hidden flex flex-col max-h-[90vh]">
                  {/* Cabeçalho */}
                  <div className="bg-gradient-to-r from-totvs-dark via-totvs-cardDark to-totvs-blue text-white p-5 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-2xl bg-white/10 flex items-center justify-center text-totvs-cyan border border-white/20">
                        <Icons.FileSpreadsheet />
                      </div>
                      <div>
                        <h3 className="text-base font-black text-white">Prévia da Importação da Escala {importPreview.ano}</h3>
                        <p className="text-xs text-slate-300">Aba detectada: <span className="font-mono text-totvs-cyan font-bold">{importPreview.sheetName}</span> • Arquivo: <span className="text-white font-medium">{importPreview.nomeArquivo}</span></p>
                      </div>
                    </div>
                    <button
                      type="button"
                      onClick={() => setImportPreview(null)}
                      className="p-1.5 text-slate-300 hover:text-white rounded-xl hover:bg-white/10 transition cursor-pointer"
                      title="Fechar prévia"
                    >
                      <Icons.X />
                    </button>
                  </div>

                  {/* Conteúdo */}
                  <div className="p-5 space-y-4 overflow-y-auto flex-1 bg-slate-50 text-slate-800">
                    {/* Cards de Métricas */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                      <div className="bg-white p-3 rounded-2xl border border-slate-200 shadow-2xs">
                        <span className="text-[10px] uppercase font-bold text-slate-400 block">Total de Datas</span>
                        <span className="text-xl font-black text-totvs-blue">{importPreview.totalDias}</span>
                      </div>
                      <div className="bg-white p-3 rounded-2xl border border-slate-200 shadow-2xs">
                        <span className="text-[10px] uppercase font-bold text-slate-400 block">Plantões Normais</span>
                        <span className="text-xl font-black text-emerald-600">{importPreview.totalNormais}</span>
                      </div>
                      <div className="bg-white p-3 rounded-2xl border border-slate-200 shadow-2xs">
                        <span className="text-[10px] uppercase font-bold text-slate-400 block">Feriados / Recessos</span>
                        <span className="text-xl font-black text-amber-600">{importPreview.totalFeriados}</span>
                      </div>
                      <div className="bg-white p-3 rounded-2xl border border-slate-200 shadow-2xs">
                        <span className="text-[10px] uppercase font-bold text-slate-400 block">Novos Especialistas</span>
                        <span className="text-xl font-black text-totvs-cyan">{importPreview.novosEspecialistas.length}</span>
                      </div>
                    </div>

                    {/* Resumo de Regras */}
                    <div className="p-3 bg-blue-50/80 rounded-2xl border border-blue-200/80 text-xs text-slate-700 space-y-1">
                      <div className="flex items-center gap-1.5 font-bold text-totvs-blue">
                        <Icons.CheckCircle />
                        <span>Padrão de Importação Validado</span>
                      </div>
                      <p className="text-[11px] text-slate-600">
                        • Horário padronizado: <strong className="text-slate-900">08:00 as 17:30</strong> para todos os plantões normais.<br />
                        • Feriados/Pontes receberão tarja âmbar com tachado discreto sobre o status.<br />
                        • Observações/Foco mantidos vazios para preenchimento manual conforme necessário.
                      </p>
                    </div>

                    {/* Tabela de Amostra */}
                    <div className="space-y-1.5">
                      <span className="text-xs font-bold text-slate-700 block">Amostra dos Primeiros Registros Identificados:</span>
                      <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-2xs">
                        <table className="w-full text-[11px] text-left">
                          <thead className="bg-slate-100 text-slate-600 font-bold border-b border-slate-200">
                            <tr>
                              <th className="py-2 px-3">Data</th>
                              <th className="py-2 px-3">Dia</th>
                              <th className="py-2 px-3">Especialista / Status</th>
                              <th className="py-2 px-3">Tipo / Horário</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {importPreview.amostra.map((item, idx) => (
                              <tr key={idx} className={item.tipo === 'feriado' ? 'bg-amber-50/40' : ''}>
                                <td className="py-2 px-3 font-mono font-bold text-slate-700">{item.data}</td>
                                <td className="py-2 px-3 text-slate-500">{item.diaSemana}</td>
                                <td className="py-2 px-3 font-bold text-slate-900">
                                  {item.tipo === 'feriado' ? (
                                    <span className="line-through decoration-amber-600 text-amber-900 font-bold">{item.nome}</span>
                                  ) : (
                                    <span>{item.nome} {item.segmento ? <span className="text-[9.5px] font-normal text-slate-500">({item.segmento})</span> : null}</span>
                                  )}
                                </td>
                                <td className="py-2 px-3">
                                  {item.tipo === 'feriado' ? (
                                    <span className="px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-amber-100 text-amber-800 border border-amber-200">Feriado</span>
                                  ) : (
                                    <span className="text-slate-600 font-medium">{item.turno}</span>
                                  )}
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>

                  {/* Rodapé / Ações */}
                  <div className="p-4 bg-white border-t border-slate-200 flex items-center justify-between gap-3">
                    <button
                      type="button"
                      onClick={() => setImportPreview(null)}
                      disabled={importandoLote}
                      className="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition cursor-pointer"
                    >
                      Cancelar
                    </button>
                    <button
                      type="button"
                      onClick={handleConfirmarImportacao}
                      disabled={importandoLote}
                      className="px-5 py-2 rounded-xl bg-gradient-to-r from-totvs-blue to-totvs-vibrant hover:opacity-90 text-white font-black text-xs transition cursor-pointer flex items-center gap-2 shadow-md"
                    >
                      {importandoLote ? (
                        <>
                          <div className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                          <span>Gravando Escala...</span>
                        </>
                      ) : (
                        <>
                          <Icons.Check />
                          <span>Confirmar e Gravar Escala {importPreview.ano}</span>
                        </>
                      )}
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    function App() {
      const [segmentos, setSegmentos] = useState([]);
      const [loading, setLoading] = useState(true);
      const [admLogado, setAdmLogado] = useState(null);
      
      // Modais
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [showForcarTrocaSenhaModal, setShowForcarTrocaSenhaModal] = useState(false);
      const [usuarioTrocaSenhaPendente, setUsuarioTrocaSenhaPendente] = useState(null);
      const [showAcceptInviteModal, setShowAcceptInviteModal] = useState(false);
      const [showMeuPerfilModal, setShowMeuPerfilModal] = useState(false);
      const [conviteToken, setConviteToken] = useState(null);
      const [activeSegment, setActiveSegment] = useState(null);
      const [editSegment, setEditSegment] = useState(null);
      const [quickBancadaSegment, setQuickBancadaSegment] = useState(null);
      const [validationModal, setValidationModal] = useState(null);
      const [lightboxSegment, setLightboxSegment] = useState(null);
      
      // Painel ADM
      const [adminModal, setAdminModal] = useState(false);
      const [adminTab, setAdminTab] = useState('adms'); // 'adms', 'convites', 'visitas', 'audit'
      const [admsList, setAdmsList] = useState([]);
      const [convitesList, setConvitesList] = useState([]);
      const [metricsData, setMetricsData] = useState(null);
      const [accessLogs, setAccessLogs] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]);

      // Contabilização e Registro de Visitantes do Espaço Experiência
      const [visitorMetrics, setVisitorMetrics] = useState({ 
        hoje: 0, 
        semana: 0, 
        mes: 0, 
        ano: 0, 
        ano_atual: new Date().getFullYear(), 
        total: 0,
        formulario_aberto_hoje: false
      });
      const [showVisitorModal, setShowVisitorModal] = useState(false);
      const [showVisitorHistoryModal, setShowVisitorHistoryModal] = useState(false);
      const [dismissedReminderToday, setDismissedReminderToday] = useState(false);
      const [visitorsList, setVisitorsList] = useState([]);

      // Governança: Chave Mestra do Perfil Especialista & Plantonista de Hoje
      const [authEspecialistaObrigatoria, setAuthEspecialistaObrigatoria] = useState(false);
      const [plantonistaHoje, setPlantonistaHoje] = useState(null);

      const carregarAuthMode = () => {
        fetch('/api/config/auth-mode')
          .then(res => res.json())
          .then(data => {
            if (data && data.success && data.auth_especialista_obrigatoria !== undefined) {
              setAuthEspecialistaObrigatoria(data.auth_especialista_obrigatoria === true);
            }
          })
          .catch(() => {});
      };

      const carregarPlantonistaHoje = () => {
        fetch('/api/plantonistas')
          .then(res => res.json())
          .then(data => {
            if (data && data.success && data.escalas) {
              const today = new Date();
              const yyyy = today.getFullYear();
              const mm = String(today.getMonth() + 1).padStart(2, '0');
              const dd = String(today.getDate()).padStart(2, '0');
              const todayIso = `${yyyy}-${mm}-${dd}`;
              const plantao = data.escalas[todayIso];
              if (plantao && plantao.nome) {
                setPlantonistaHoje(plantao.nome);
              }
            }
          })
          .catch(() => {});
      };

      const carregarVisitorMetrics = () => {
        fetch('/api/visitors/metrics')
          .then(res => res.json())
          .then(data => {
            if (data && data.success) {
              setVisitorMetrics({
                hoje: data.hoje || 0,
                semana: data.semana || 0,
                mes: data.mes || 0,
                ano: data.ano !== undefined ? data.ano : (data.total || 0),
                ano_atual: data.ano_atual || new Date().getFullYear(),
                total: data.total || 0,
                formulario_aberto_hoje: Boolean(data.formulario_aberto_hoje)
              });
            }
          })
          .catch(() => {});
      };

      const carregarVisitantes = () => {
        fetch('/api/visitors')
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data)) setVisitorsList(data);
          })
          .catch(() => {});
      };

      // Vídeo Institucional da Gestão ("Veja seu discurso aqui")
      const [videoGestao, setVideoGestao] = useState(null);
      const [showVideoModal, setShowVideoModal] = useState(false);

      const carregarVideoGestao = () => {
        fetch('/api/video/gestao')
          .then(res => res.json())
          .then(data => {
            if (data && data.success && data.video) {
              setVideoGestao(data.video);
            }
          })
          .catch(() => {});
      };

      const handleOpenGoogleForm = async () => {
        const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSfQWaQrpLcHNW1HkOhe2RQ2AnpNEzb-Duna6hyP1__FxGalmQ/viewform";
        window.open(formUrl, '_blank', 'noopener,noreferrer');
        try {
          const res = await fetch('/api/visitors/form-opened', { method: 'POST' });
          const data = await res.json();
          if (data && data.success) {
            setVisitorMetrics(prev => ({ ...prev, formulario_aberto_hoje: true }));
          }
        } catch (e) {}
      };

      // Lembrete inteligente das 17:00 (se formulário não foi aberto hoje)
      // Permite testar via query param ?test_lembrete=1
      const isTestLembrete = useMemo(() => {
        try {
          return new URLSearchParams(window.location.search).get('test_lembrete') === '1';
        } catch (e) {
          return false;
        }
      }, []);
      const currentHour = new Date().getHours();
      const shouldShowFormReminder = (currentHour >= 17 || isTestLembrete) && 
        !visitorMetrics.formulario_aberto_hoje && 
        !dismissedReminderToday;

      // Busca, Barra Lateral e Calendário dos Plantonistas
      const [searchTerm, setSearchTerm] = useState('');
      const [isSidebarExpanded, setIsSidebarExpanded] = useState(false);
      const [showPlantonistasModal, setShowPlantonistasModal] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 4000);
      };

      // Carregamento inicial de dados
      useEffect(() => {
        // 1. Contador silencioso de visitas (1 por sessão de navegador)
        if (!sessionStorage.getItem('totvs_visita_registrada')) {
          fetch('/api/access', { method: 'POST' })
            .then(() => sessionStorage.setItem('totvs_visita_registrada', '1'))
            .catch(() => {});
        }

                  // 2. Verificar se há parâmetro de convite (Google Apps Script ou URL direta)
          let convParam = null;
          if (typeof window !== 'undefined' && window.SERVER_CONVITE_PARAM && window.SERVER_CONVITE_PARAM.trim() !== '') {
            convParam = window.SERVER_CONVITE_PARAM.trim();
          } else {
            const urlParams = new URLSearchParams(window.location.search);
            convParam = urlParams.get('convite');
          }

          // Escutar via API oficial do Google Apps Script
          if (typeof google !== 'undefined' && google && google.script && google.script.url) {
            google.script.url.getLocation(function(loc) {
              if (loc && loc.parameter && loc.parameter.convite) {
                const tokenUrl = String(loc.parameter.convite).trim();
                setConviteToken(tokenUrl);
                setAdmLogado(null);
                setShowAcceptInviteModal(true);
              }
            });
          }

          if (convParam) {
            setConviteToken(convParam);
            setShowAcceptInviteModal(true);
            // IMPORTANTE: Quando um convite é aberto, NÃO restaurar sessão anterior deste navegador
            setAdmLogado(null);
          } else {
            // 3. Restaurar sessão salva de administrador apenas se NÃO houver convite ativo
            // Para garantir que cada nova sessão de navegador abra deslogada, usamos sessionStorage e limpamos localStorage legado
            try { localStorage.removeItem('totvs_adm_session'); } catch(e){}
            const savedAdm = sessionStorage.getItem('totvs_adm_session');
            if (savedAdm) {
              try {
                const parsed = JSON.parse(savedAdm);
                setAdmLogado(parsed);
                if (!sessionStorage.getItem('totvs_adm_welcome_shown')) {
                  sessionStorage.setItem('totvs_adm_welcome_shown', '1');
                  setTimeout(() => {
                    const cargoNome = parsed.perfil === 'especialista' ? 'Especialista' : (parsed.perfil === 'pmm' ? 'PMM' : 'Administrador');
                    showToast(`Olá, ${parsed.nome}! Bem-vindo ao Espaço Experiência TOTVS (${cargoNome}). 👋`);
                  }, 700);
                }
              } catch(e){}
            }
          }

        // 4. Carregar métricas de visitantes, governança e vídeo
        carregarVisitorMetrics();
        carregarVisitantes();
        carregarAuthMode();
        carregarPlantonistaHoje();
        carregarVideoGestao();

        // 5. Buscar segmentos
        fetch('/api/segmentos')
          .then(res => res.json())
          .then(data => {
            setSegmentos(data);
            setLoading(false);
          })
          .catch(err => {
            fetch('./data/segmentos.json')
              .then(res => res.json())
              .then(data => {
                setSegmentos(data);
                setLoading(false);
              })
              .catch(() => setLoading(false));
          });
      }, []);

      // Login bem-sucedido (Especialista, PMM ou Administrador)
      const handleLoginSuccess = (usuario) => {
        if (usuario.precisa_trocar_senha === true) {
          setShowLoginModal(false);
          setUsuarioTrocaSenhaPendente(usuario);
          setShowForcarTrocaSenhaModal(true);
          return;
        }
        setAdmLogado(usuario);
        sessionStorage.setItem('totvs_adm_session', JSON.stringify(usuario));
        try { localStorage.removeItem('totvs_adm_session'); } catch(e){}
        setShowLoginModal(false);
        const perfilLabel = usuario.perfil === 'especialista' ? 'Especialista' : (usuario.perfil === 'pmm' ? 'PMM' : 'Administrador');
        showToast(`Olá, ${usuario.nome}! Bem-vindo ao Espaço Experiência TOTVS. Perfil de ${perfilLabel} ativado! 🚀`);
      };

      // Logout da Conta Corporativa
      const handleLogoutAdm = () => {
        setAdmLogado(null);
        sessionStorage.removeItem('totvs_adm_session');
        try { localStorage.removeItem('totvs_adm_session'); } catch(e){}
        showToast('Você saiu da sua conta corporativa. Ambiente em modo somente leitura.');
      };

      // Ativação bem-sucedida de novo Convidado (Especialista, PMM ou ADM)
      const handleAcceptInviteSuccess = (usuario) => {
        setAdmLogado(usuario);
        sessionStorage.setItem('totvs_adm_session', JSON.stringify(usuario));
        try { localStorage.removeItem('totvs_adm_session'); } catch(e){}
        setShowAcceptInviteModal(false);
        setConviteToken(null);
        window.history.replaceState({}, document.title, window.location.pathname);
        const perfilLabel = usuario.perfil === 'especialista' ? 'Especialista' : (usuario.perfil === 'pmm' ? 'PMM' : 'ADM');
        showToast(`Olá, ${usuario.nome}! Bem-vindo ao Espaço Experiência TOTVS. Perfil de ${perfilLabel} ativado! 🎉`);
      };

      // Atualizar dados de perfil (foto / senha)
      const handleUpdateAdmProfile = (usuarioAtualizado) => {
        setAdmLogado(usuarioAtualizado);
        sessionStorage.setItem('totvs_adm_session', JSON.stringify(usuarioAtualizado));
        try { localStorage.removeItem('totvs_adm_session'); } catch(e){}
      };

      // Abrir Edição Completa (apenas ADM)
      const handleOpenEdit = (seg) => {
        if (!admLogado) {
          showToast('Apenas administradores podem editar o projeto.');
          setShowLoginModal(true);
          return;
        }
        setEditSegment(JSON.parse(JSON.stringify(seg)));
      };

      // Salvar com Checkpoint de Validação
      const handleTriggerSave = (editedData) => {
        setValidationModal({
          segmento: editedData,
          confirmedCheck: false
        });
      };

      const handleConfirmSave = () => {
        if (!validationModal) return;
        const segToSave = validationModal.segmento;
        const autorNome = admLogado ? admLogado.nome : 'Administrador TOTVS';
        const autorEmail = admLogado ? admLogado.email : 'admin@totvs.com.br';

        segToSave.ultima_atualizacao = {
          data: new Date().toLocaleString('pt-BR'),
          autor: autorNome
        };

        fetch(`/api/segmentos/${segToSave.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            segmento: segToSave,
            autor: { nome: autorNome, email: autorEmail, perfil: admLogado?.perfil || 'adm' },
            detalhes: `Atualização de conteúdo realizada por ${autorNome}.`
          })
        })
        .then(res => res.json())
        .then(() => {
          setSegmentos(prev => prev.map(s => s.id === segToSave.id ? segToSave : s));
          setValidationModal(null);
          setEditSegment(null);
          if (activeSegment && activeSegment.id === segToSave.id) {
            setActiveSegment(segToSave);
          }
          showToast(`Alterações do segmento "${segToSave.nome}" publicadas por ${autorNome}! ✅`);
        })
        .catch(() => {
          setSegmentos(prev => {
            const list = prev.map(s => s.id === segToSave.id ? segToSave : s);
            return list.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
          });
          setValidationModal(null);
          setEditSegment(null);
          showToast(`Salvo localmente com sucesso!`);
        });
      };

      // Salvar Edição Rápida da Foto da Bancada, Credenciais e Soluções
      const handleSaveQuickBancada = (dadosAtualizados) => {
        if (!quickBancadaSegment) return;
        const segId = quickBancadaSegment.id;
        const autorNome = admLogado ? admLogado.nome : 'Administrador TOTVS';
        const autorEmail = admLogado ? admLogado.email : 'admin@totvs.com.br';

        const segToSave = {
          ...quickBancadaSegment,
          nome: dadosAtualizados.nome !== undefined ? dadosAtualizados.nome : quickBancadaSegment.nome,
          ordem: dadosAtualizados.ordem !== undefined ? dadosAtualizados.ordem : quickBancadaSegment.ordem,
          foto_bancada: dadosAtualizados.foto_bancada !== undefined ? dadosAtualizados.foto_bancada : quickBancadaSegment.foto_bancada,
          credenciais: dadosAtualizados.credenciais !== undefined ? dadosAtualizados.credenciais : quickBancadaSegment.credenciais,
          badge_solucoes: dadosAtualizados.badge_solucoes !== undefined ? dadosAtualizados.badge_solucoes : quickBancadaSegment.badge_solucoes,
          ultima_atualizacao: {
            data: new Date().toLocaleString('pt-BR'),
            autor: autorNome
          }
        };

        fetch(`/api/segmentos/${segId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            segmento: segToSave,
            autor: { nome: autorNome, email: autorEmail, perfil: admLogado?.perfil || 'adm' },
            detalhes: `Ajuste da Estação "${segToSave.nome}" (Estação ${segToSave.ordem}) realizado por ${autorNome}.`
          })
        })
        .then(res => res.json())
        .then(() => {
          setSegmentos(prev => {
            const list = prev.map(s => s.id === segId ? segToSave : s);
            return list.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
          });
          setQuickBancadaSegment(null);
          if (activeSegment && activeSegment.id === segId) {
            setActiveSegment(segToSave);
          }
          showToast(`Estação "${segToSave.nome}" salva com sucesso! ✅`);
        })
        .catch(() => {
          setSegmentos(prev => {
            const list = prev.map(s => s.id === segId ? segToSave : s);
            return list.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
          });
          setQuickBancadaSegment(null);
          showToast(`Salvo localmente com sucesso! ✅`);
        });
      };

      // Painel ADM / Meu Perfil
      const handleOpenAdmin = () => {
        if (!admLogado) {
          setShowLoginModal(true);
          return;
        }
        if (admLogado.perfil === 'especialista') {
          setShowMeuPerfilModal(true);
          return;
        }
        setAdminModal(true);
        carregarDadosAdmin();
      };

      const carregarDadosAdmin = () => {
        fetch('/api/admin/users').then(res => res.json()).then(setAdmsList).catch(() => {});
        fetch('/api/admin/invites').then(res => res.json()).then(setConvitesList).catch(() => {});
        fetch('/api/admin/metrics').then(res => res.json()).then(d => { if (d.success) setMetricsData(d); }).catch(() => {});
        fetch('/api/logs/access').then(res => res.json()).then(setAccessLogs).catch(() => {});
        fetch('/api/logs/audit').then(res => res.json()).then(setAuditLogs).catch(() => {});
        carregarVisitorMetrics();
        carregarVisitantes();
        carregarVideoGestao();
      };

      // Filtro de busca
      const filteredSegmentos = useMemo(() => {
        if (!searchTerm.trim()) return segmentos;
        const q = searchTerm.toLowerCase();
        return segmentos.filter(s => 
          s.nome.toLowerCase().includes(q) ||
          s.tagline.toLowerCase().includes(q) ||
          s.pitch.toLowerCase().includes(q) ||
          (s.badge_solucoes && s.badge_solucoes.some(b => b.toLowerCase().includes(q)))
        );
      }, [segmentos, searchTerm]);

      // Contexto de Navegação Ativo na Barra Lateral
      const activeNav = useMemo(() => {
        if (showPlantonistasModal) return 'plantonistas';
        if (showVisitorHistoryModal) return 'historico';
        if (adminModal || showMeuPerfilModal) return 'admin';
        return 'showroom';
      }, [showPlantonistasModal, showVisitorHistoryModal, adminModal, showMeuPerfilModal]);

      // Ação Universal: Retornar ao Showroom (Reset Geral / Fechar Modais / Limpar Filtros)
      const handleReturnToShowroom = () => {
        const algumModalAberto = showPlantonistasModal || adminModal || showVisitorHistoryModal || showVisitorModal || showMeuPerfilModal || lightboxSegment || showVideoModal || editSegment || quickBancadaSegment || validationModal || showLoginModal || showAcceptInviteModal || showForcarTrocaSenhaModal;
        
        setShowPlantonistasModal(false);
        setAdminModal(false);
        setShowVisitorHistoryModal(false);
        setShowVisitorModal(false);
        setShowMeuPerfilModal(false);
        setLightboxSegment(null);
        setShowVideoModal(false);
        setEditSegment(null);
        setQuickBancadaSegment(null);
        setValidationModal(null);
        setShowLoginModal(false);
        setShowAcceptInviteModal(false);
        setShowForcarTrocaSenhaModal(false);

        if (searchTerm) setSearchTerm('');
        window.scrollTo({ top: 0, behavior: 'smooth' });

        if (algumModalAberto) {
          showToast('Retornou ao Showroom principal! 🏠');
        }
      };

      return (
        <div className="min-h-screen flex bg-slate-50">
          
          {/* BARRA LATERAL RETRÁTIL (SAAS RAIL À ESQUERDA) */}
          <SidebarNav
            isExpanded={isSidebarExpanded}
            onToggle={() => setIsSidebarExpanded(prev => !prev)}
            activeNav={activeNav}
            onOpenShowroom={handleReturnToShowroom}
            onOpenPlantonistas={() => setShowPlantonistasModal(true)}
            onOpenHistorico={() => {
              if (!admLogado || (admLogado.perfil !== 'adm' && !admLogado.dono_produto) || admLogado.perfil === 'especialista') {
                showToast('Acesso restrito: Funcionalidade exclusiva de Administradores.');
                return;
              }
              setShowVisitorHistoryModal(true);
            }}
            onOpenAdmin={handleOpenAdmin}
            onLogoutAdm={handleLogoutAdm}
            admLogado={admLogado}
          />

          {/* CONTEÚDO PRINCIPAL (COM MARGEM DINÂMICA PARA ACOMODAR A SIDEBAR) */}
          <div className={`flex-1 flex flex-col min-w-0 transition-all duration-300 ease-in-out ${
            isSidebarExpanded ? 'pl-60 sm:pl-64' : 'pl-16'
