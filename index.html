              x="78"
              y="18"
              width="48"
              height="11"
              rx="5.5"
              transform="rotate(-52 78 18)"
              fill="#00E5FF"

            <circle cx="58" cy="106" r="2" fill="#00E5FF" fillOpacity="0.6" />

    // Componente dedicado para exibição e cópia de credenciais de PC da bancada
    function StationCredentialsBox({ credenciais, onEdit }) {
      const [copied, setCopied] = useState(null); // 'user' | 'pass' | null

      if (!credenciais) return null;

      const copyToClipboard = (text, type) => {
        if (!text) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            setCopied(type);
            setTimeout(() => setCopied(null), 1800);
          }).catch(() => fallbackCopy(text, type));
        } else {
          fallbackCopy(text, type);
        }
      };

      const fallbackCopy = (text, type) => {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          setCopied(type);
          setTimeout(() => setCopied(null), 1800);
        } catch (e) {
          console.error('Falha ao copiar:', e);
        }
      };

      return (
        <div className="bg-white rounded-xl border border-slate-200/90 shadow-sm p-3 space-y-2">
          {/* Topo do Box: Identificação do Equipamento */}
          <div className="flex items-center justify-between pb-1.5 border-b border-slate-100">
            <div className="flex items-center gap-1.5 min-w-0">
              <span className="w-5 h-5 rounded-md bg-totvs-blue/10 text-totvs-blue flex items-center justify-center shrink-0">
                <Icons.Monitor />
              </span>
              <span className="font-bold text-[11px] text-slate-800 truncate" title={credenciais.equipamento}>
                {credenciais.equipamento || 'Computador da Bancada'}
              </span>
            </div>
            <div className="flex items-center gap-1.5 shrink-0">
              <span className="text-[9px] font-extrabold uppercase px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200">
                Acesso Bancada
              </span>
            </div>
          </div>

          {/* Bloco do Usuário (Valor Completo Sem Cortes) */}
          <div className="bg-slate-50/90 hover:bg-slate-50 p-2 rounded-lg border border-slate-200/60 transition space-y-1">
            <div className="flex items-center justify-between">
              <span className="text-[9.5px] font-extrabold text-slate-500 uppercase tracking-wider">
                Usuário:
              </span>
              <button
                type="button"
                onClick={() => copyToClipboard(credenciais.usuario, 'user')}
                className={`p-1 px-1.5 rounded-md transition flex items-center gap-1 text-[10px] font-semibold ${
                  copied === 'user'
                    ? 'bg-emerald-500 text-white shadow-xs'
                    : 'text-slate-400 hover:text-totvs-blue hover:bg-slate-200/60'
                }`}
                title="Copiar usuário"
              >
                {copied === 'user' ? (
                  <>
                    <Icons.Check />
                    <span className="text-[9px]">Copiado!</span>
                  </>
                ) : (
                  <>
                    <Icons.Copy />
                    <span className="text-[9px] text-slate-500 hover:text-totvs-blue">Copiar</span>
                  </>
                )}
              </button>
            </div>
            <div
              className="font-mono text-slate-800 text-[11px] font-semibold select-all break-all leading-tight"
              title={credenciais.usuario}
            >
              {credenciais.usuario || '—'}
            </div>
          </div>

          {/* Bloco da Senha (Sempre Visível Sem Cortes) */}
          <div className="bg-slate-50/90 hover:bg-slate-50 p-2 rounded-lg border border-slate-200/60 transition space-y-1">
            <div className="flex items-center justify-between">
              <span className="text-[9.5px] font-extrabold text-slate-500 uppercase tracking-wider">

              </span>
              <button
                type="button"
                onClick={() => copyToClipboard(credenciais.senha, 'pass')}

                }`}

                    <span className="text-[9px] text-slate-500 hover:text-totvs-blue">Copiar</span>
                  </>
                )}
              </button>
            </div>
            <div
              className="font-mono text-slate-800 text-[11px] font-semibold select-all break-all leading-tight tracking-tight"

    // --- COMPONENTE: MODAL RÁPIDO PARA EDITAR ESTAÇÃO, BANCADA E SOLUÇÕES ---
    function QuickBancadaModal({ segment, onClose, onSave }) {
      const [nome, setNome] = useState(segment?.nome || '');
      const [ordem, setOrdem] = useState(segment?.ordem || 1);
      const [equipamento, setEquipamento] = useState(segment?.credenciais?.equipamento || `PC ${segment?.nome || ''}`);
      const [usuario, setUsuario] = useState(segment?.credenciais?.usuario || 'ens.experiencia@totvs.com.br');
      const [senha, setSenha] = useState(segment?.credenciais?.senha || 'Experienciastotvs@2026');
      const [fotoBancada, setFotoBancada] = useState(segment?.foto_bancada || '');
      const [solucoes, setSolucoes] = useState(() => Array.isArray(segment?.badge_solucoes) ? [...segment.badge_solucoes] : []);
      const [novaSolucao, setNovaSolucao] = useState('');
      const [uploading, setUploading] = useState(false);
      const [uploadMsg, setUploadMsg] = useState('');
      const [salvando, setSalvando] = useState(false);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [onClose]);

      const handleAddSolucao = () => {
        const item = novaSolucao.trim();
        if (!item) return;
        if (!solucoes.includes(item)) {
          setSolucoes(prev => [...prev, item]);
        }
        setNovaSolucao('');
      };

      const handleRemoveSolucao = (indexToRemove) => {
        setSolucoes(prev => prev.filter((_, idx) => idx !== indexToRemove));
      };

      const handleFileUpload = async (file) => {
        if (!file) return;
        setUploading(true);
        setUploadMsg(`Enviando foto da bancada "${file.name}"... ⏳`);
        try {
          const res = await fetch('/api/upload', {
            method: 'POST',
            headers: {
              'X-Filename': encodeURIComponent(file.name),
              'Content-Type': file.type || 'application/octet-stream'
            },
            body: file
          });
          const data = await res.json();
          if (data.success && data.url) {
            setFotoBancada(data.url);
            setUploadMsg('Foto carregada com sucesso! ✅');
          } else {
            throw new Error(data.message || 'Falha ao processar imagem.');
          }
        } catch (err) {
          alert(`Erro ao fazer upload da foto: ${err.message}`);
          setUploadMsg('❌ Erro no upload. Tente novamente.');
        } finally {
          setUploading(false);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        setSalvando(true);
        onSave({
          nome: nome.trim(),
          ordem: parseInt(ordem, 10) || segment.ordem,
          foto_bancada: fotoBancada.trim(),
          credenciais: {
            equipamento: equipamento.trim(),
            usuario: usuario.trim(),
            senha: senha.trim()
          },
          badge_solucoes: solucoes
        });
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/75 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-200 animate-in fade-in zoom-in-95 duration-150">
            {/* Header */}
            <div className="bg-gradient-to-r from-totvs-dark to-totvs-blue text-white p-5 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-totvs-cyan/20 border border-totvs-cyan/40 text-totvs-cyan flex items-center justify-center font-bold">
                  <Icons.Monitor />
                </div>
                <div>
                  <span className="text-[10px] font-extrabold uppercase tracking-widest text-totvs-cyan block">
                    Editar Estação & Segmento
                  </span>
                  <h3 className="text-base font-black text-white leading-tight">
                    Estação {ordem.toString().padStart(2, '0')} • {nome || segment.nome}
                  </h3>
                </div>
              </div>
              <button
                onClick={onClose}
                className="text-slate-300 hover:text-white p-1 rounded-lg transition"
                title="Fechar (ESC)"
              >
                <Icons.X />
              </button>
            </div>

            {/* Formulário */}

                <label className="font-extrabold text-slate-800 text-xs flex items-center gap-1.5">
                  <Icons.Edit />
                  <span>Identificação da Estação:</span>

                      Nº Estação:
                    </label>
                    <input
                      type="number"

                  </div>
                ) : (
                  <div className="h-24 rounded-xl border border-dashed border-slate-300 bg-white flex flex-col items-center justify-center p-3 text-center text-slate-400">
                    <span className="text-[11px] font-bold text-slate-600 block">Sem foto vinculada</span>
                    <span className="text-[10px] text-slate-400">Escolha uma imagem do seu computador abaixo</span>
                  </div>
                )}

                {/* Botão de Upload e Input de Caminho */}
                <div className="space-y-2">
                  <label className="w-full flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 font-bold text-xs cursor-pointer transition shadow-xs">
                    <Icons.Upload />
                    <span>{uploading ? 'Enviando imagem...' : '📁 Escolher Foto da Bancada do Computador'}</span>
                    <input
                      type="file"
                      accept="image/*"
                      onChange={e => {
                        if (e.target.files && e.target.files[0]) {
                          handleFileUpload(e.target.files[0]);
                        }
                      }}
                      disabled={uploading}
                      className="hidden"
                    />
                  </label>

                  <input
                    type="text"
                    placeholder="Ou digite o caminho (ex: uploads/foto.jpg)"
                    value={fotoBancada}
                    onChange={e => setFotoBancada(e.target.value)}
                    className="w-full p-2 border border-slate-300 rounded-lg bg-white font-mono text-[11px] focus:ring-2 focus:ring-totvs-cyan"
                  />
                </div>

                {uploadMsg && (
                  <div className="text-[11px] font-semibold text-totvs-blue bg-white p-2 rounded-lg border border-blue-200 flex items-center gap-2">
                    <Icons.CheckCircle />
                    <span>{uploadMsg}</span>
                  </div>
                )}
              </div>

              {/* Credenciais de Acesso */}
              <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                <label className="font-extrabold text-slate-800 text-xs flex items-center gap-1.5">
                  <Icons.Key />
                  <span>Credenciais do PC / Notebook da Bancada:</span>
                </label>

                <div className="space-y-2.5">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-600 mb-1">
                      Nome do Equipamento:
                    </label>
                    <input
                      type="text"
                      placeholder="Ex: PC Logistica"
                      value={equipamento}
                      onChange={e => setEquipamento(e.target.value)}
                      className="w-full p-2.5 border border-slate-300 rounded-xl bg-white font-bold text-slate-800 text-xs focus:ring-2 focus:ring-totvs-cyan"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-600 mb-1">
                      Usuário de Acesso:
                    </label>
                    <input
                      type="text"
                      placeholder="ens.experiencia@totvs.com.br"
                      value={usuario}
                      onChange={e => setUsuario(e.target.value)}
                      className="w-full p-2.5 border border-slate-300 rounded-xl bg-white font-mono text-slate-800 text-xs focus:ring-2 focus:ring-totvs-cyan"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-600 mb-1">
                      Senha de Acesso:
                    </label>
                    <input
                      type="text"
                      placeholder="Experienciastotvs@2026"
                      value={senha}
                      onChange={e => setSenha(e.target.value)}
                      className="w-full p-2.5 border border-slate-300 rounded-xl bg-white font-mono text-slate-800 text-xs focus:ring-2 focus:ring-totvs-cyan"
                      required
                    />
                  </div>
                </div>
              </div>

              {/* Rodapé com Ações */}
              <div className="pt-2 flex items-center justify-between gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold transition text-xs"
                >
                  Cancelar
                </button>

                <button
                  type="submit"
                  disabled={salvando || uploading}
                  className="flex-1 py-2.5 px-4 rounded-xl bg-gradient-to-r from-totvs-blue to-totvs-cyan hover:from-[#003B8E] hover:to-[#00B4D8] text-white font-black text-xs transition shadow-md flex items-center justify-center gap-2"
                >
                  <Icons.Check />
                  <span>{salvando ? 'Salvando...' : 'Salvar Alterações do Card'}</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function App() {
      const [segmentos, setSegmentos] = useState([]);
      const [loading, setLoading] = useState(true);
      const [admLogado, setAdmLogado] = useState(null);
      
      // Modais
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [showAcceptInviteModal, setShowAcceptInviteModal] = useState(false);
      const [conviteToken, setConviteToken] = useState(null);
      const [activeSegment, setActiveSegment] = useState(null);
      const [editSegment, setEditSegment] = useState(null);
      const [quickBancadaSegment, setQuickBancadaSegment] = useState(null);
      const [validationModal, setValidationModal] = useState(null);
      const [lightboxSegment, setLightboxSegment] = useState(null);
      
      // Painel ADM
      const [adminModal, setAdminModal] = useState(false);
      const [adminTab, setAdminTab] = useState('adms'); // 'adms', 'convites', 'visitas', 'audit'
      const [admsList, setAdmsList] = useState([]);
      const [convitesList, setConvitesList] = useState([]);
      const [metricsData, setMetricsData] = useState(null);
      const [accessLogs, setAccessLogs] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]);

      // Contabilização e Registro de Visitantes do Espaço Experiência
      const [visitorMetrics, setVisitorMetrics] = useState({ 
        hoje: 0, 
        semana: 0, 
        mes: 0, 
        ano: 0, 
        ano_atual: new Date().getFullYear(), 
        total: 0,
        formulario_aberto_hoje: false
      });
      const [showVisitorModal, setShowVisitorModal] = useState(false);
      const [showVisitorHistoryModal, setShowVisitorHistoryModal] = useState(false);
      const [dismissedReminderToday, setDismissedReminderToday] = useState(false);
      const [visitorsList, setVisitorsList] = useState([]);

      const carregarVisitorMetrics = () => {
        fetch('/api/visitors/metrics')
          .then(res => res.json())
          .then(data => {
            if (data && data.success) {
              setVisitorMetrics({
                hoje: data.hoje || 0,
                semana: data.semana || 0,
                mes: data.mes || 0,
                ano: data.ano !== undefined ? data.ano : (data.total || 0),
                ano_atual: data.ano_atual || new Date().getFullYear(),
                total: data.total || 0,
                formulario_aberto_hoje: Boolean(data.formulario_aberto_hoje)
              });
            }
          })
          .catch(() => {});
      };

      const carregarVisitantes = () => {
        fetch('/api/visitors')
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data)) setVisitorsList(data);
          })
          .catch(() => {});
      };

      // Vídeo Institucional da Gestão ("Veja seu discurso aqui")
      const [videoGestao, setVideoGestao] = useState(null);
      const [showVideoModal, setShowVideoModal] = useState(false);

      const carregarVideoGestao = () => {
        fetch('/api/video/gestao')
          .then(res => res.json())
          .then(data => {
            if (data && data.success && data.video) {
              setVideoGestao(data.video);
            }
          })
          .catch(() => {});
      };

      const handleOpenGoogleForm = async () => {
        const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSfQWaQrpLcHNW1HkOhe2RQ2AnpNEzb-Duna6hyP1__FxGalmQ/viewform";
        window.open(formUrl, '_blank', 'noopener,noreferrer');
        try {
          const res = await fetch('/api/visitors/form-opened', { method: 'POST' });
          const data = await res.json();
          if (data && data.success) {
            setVisitorMetrics(prev => ({ ...prev, formulario_aberto_hoje: true }));
          }
        } catch (e) {}
      };

      // Lembrete inteligente das 17:00 (se formulário não foi aberto hoje)
      // Permite testar via query param ?test_lembrete=1
      const isTestLembrete = useMemo(() => {
        try {
          return new URLSearchParams(window.location.search).get('test_lembrete') === '1';
        } catch (e) {
          return false;
        }
      }, []);
      const currentHour = new Date().getHours();
      const shouldShowFormReminder = (currentHour >= 17 || isTestLembrete) && 
        !visitorMetrics.formulario_aberto_hoje && 
        !dismissedReminderToday;

      // Busca e Filtros
      const [searchTerm, setSearchTerm] = useState('');
      const [toastMsg, setToastMsg] = useState(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 4000);
      };

      // Carregamento inicial de dados
      useEffect(() => {
        // 1. Contador silencioso de visitas (1 por sessão de navegador)
        if (!sessionStorage.getItem('totvs_visita_registrada')) {
          fetch('/api/access', { method: 'POST' })
            .then(() => sessionStorage.setItem('totvs_visita_registrada', '1'))
            .catch(() => {});
        }

        // 2. Verificar se há parâmetro de convite na URL (?convite=...)
        const urlParams = new URLSearchParams(window.location.search);
        const convParam = urlParams.get('convite');
        if (convParam) {
          setConviteToken(convParam);
          setShowAcceptInviteModal(true);
        }

        // 3. Restaurar sessão salva de administrador deste navegador
        const savedAdm = localStorage.getItem('totvs_adm_session');
        if (savedAdm) {
          try { setAdmLogado(JSON.parse(savedAdm)); } catch(e){}
        }

        // 4. Carregar métricas de visitantes presenciais
        carregarVisitorMetrics();
        carregarVisitantes();
        carregarVideoGestao();

        // 5. Buscar segmentos
        fetch('/api/segmentos')
          .then(res => res.json())
          .then(data => {
            setSegmentos(data);
            setLoading(false);
          })
          .catch(err => {
            fetch('./data/segmentos.json')
              .then(res => res.json())
              .then(data => {
                setSegmentos(data);
                setLoading(false);
              })
              .catch(() => setLoading(false));
          });
      }, []);

      // Login bem-sucedido de Administrador
      const handleLoginSuccess = (usuario) => {
        setAdmLogado(usuario);
        localStorage.setItem('totvs_adm_session', JSON.stringify(usuario));
        setShowLoginModal(false);
        showToast(`Bem-vindo, ${usuario.nome}! Modo Administrador ativado. ✅`);
      };

      // Logout do Administrador
      const handleLogoutAdm = () => {
        setAdmLogado(null);
        localStorage.removeItem('totvs_adm_session');
        showToast('Você saiu do modo administrador. Ambiente em modo somente leitura.');
      };

      // Ativação bem-sucedida de novo Administrador convidado
      const handleAcceptInviteSuccess = (usuario) => {
        setAdmLogado(usuario);
        localStorage.setItem('totvs_adm_session', JSON.stringify(usuario));
        setShowAcceptInviteModal(false);
        setConviteToken(null);
        window.history.replaceState({}, document.title, window.location.pathname);
        showToast(`Perfil ativado com sucesso! Bem-vindo, ${usuario.nome}. 🛡️`);
      };

      // Abrir Edição Completa (apenas ADM)
      const handleOpenEdit = (seg) => {
        if (!admLogado) {
          showToast('Apenas administradores podem editar o projeto.');
          setShowLoginModal(true);
          return;
        }
        setEditSegment(JSON.parse(JSON.stringify(seg)));
      };

      // Salvar com Checkpoint de Validação
      const handleTriggerSave = (editedData) => {
        setValidationModal({
          segmento: editedData,
          confirmedCheck: false
        });
      };

      const handleConfirmSave = () => {
        if (!validationModal) return;
        const segToSave = validationModal.segmento;
        const autorNome = admLogado ? admLogado.nome : 'Administrador TOTVS';
        const autorEmail = admLogado ? admLogado.email : 'admin@totvs.com.br';

        segToSave.ultima_atualizacao = {
          data: new Date().toLocaleString('pt-BR'),
          autor: autorNome
        };

        fetch(`/api/segmentos/${segToSave.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            segmento: segToSave,
            autor: { nome: autorNome, email: autorEmail },
            detalhes: `Atualização de conteúdo realizada por ${autorNome}.`
          })
        })
        .then(res => res.json())
        .then(() => {
          setSegmentos(prev => prev.map(s => s.id === segToSave.id ? segToSave : s));
          setValidationModal(null);
          setEditSegment(null);
          if (activeSegment && activeSegment.id === segToSave.id) {
            setActiveSegment(segToSave);
          }
          showToast(`Alterações do segmento "${segToSave.nome}" publicadas por ${autorNome}! ✅`);
        })
        .catch(() => {
          setSegmentos(prev => {
            const list = prev.map(s => s.id === segToSave.id ? segToSave : s);
            return list.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
          });
          setValidationModal(null);
          setEditSegment(null);
          showToast(`Salvo localmente com sucesso!`);
        });
      };

      // Salvar Edição Rápida da Foto da Bancada, Credenciais e Soluções
      const handleSaveQuickBancada = (dadosAtualizados) => {
        if (!quickBancadaSegment) return;
        const segId = quickBancadaSegment.id;
        const autorNome = admLogado ? admLogado.nome : 'Administrador TOTVS';
        const autorEmail = admLogado ? admLogado.email : 'admin@totvs.com.br';

        const segToSave = {
          ...quickBancadaSegment,
          nome: dadosAtualizados.nome !== undefined ? dadosAtualizados.nome : quickBancadaSegment.nome,
          ordem: dadosAtualizados.ordem !== undefined ? dadosAtualizados.ordem : quickBancadaSegment.ordem,
          foto_bancada: dadosAtualizados.foto_bancada !== undefined ? dadosAtualizados.foto_bancada : quickBancadaSegment.foto_bancada,
          credenciais: dadosAtualizados.credenciais !== undefined ? dadosAtualizados.credenciais : quickBancadaSegment.credenciais,
          badge_solucoes: dadosAtualizados.badge_solucoes !== undefined ? dadosAtualizados.badge_solucoes : quickBancadaSegment.badge_solucoes,
          ultima_atualizacao: {
            data: new Date().toLocaleString('pt-BR'),
            autor: autorNome
          }
        };

        fetch(`/api/segmentos/${segId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            segmento: segToSave,
            autor: { nome: autorNome, email: autorEmail },
            detalhes: `Ajuste da Estação "${segToSave.nome}" (Estação ${segToSave.ordem}) realizado por ${autorNome}.`
          })
        })
        .then(res => res.json())
        .then(() => {
          setSegmentos(prev => {
            const list = prev.map(s => s.id === segId ? segToSave : s);
            return list.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
          });
          setQuickBancadaSegment(null);
          if (activeSegment && activeSegment.id === segId) {
            setActiveSegment(segToSave);
          }
          showToast(`Estação "${segToSave.nome}" salva com sucesso! ✅`);
        })
        .catch(() => {
          setSegmentos(prev => {
            const list = prev.map(s => s.id === segId ? segToSave : s);
            return list.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
          });
          setQuickBancadaSegment(null);
          showToast(`Salvo localmente com sucesso! ✅`);
        });
      };

      // Painel ADM
      const handleOpenAdmin = () => {
        if (!admLogado) {
          setShowLoginModal(true);
          return;
        }
        setAdminModal(true);
        carregarDadosAdmin();
      };

      const carregarDadosAdmin = () => {
        fetch('/api/admin/users').then(res => res.json()).then(setAdmsList).catch(() => {});
        fetch('/api/admin/invites').then(res => res.json()).then(setConvitesList).catch(() => {});
        fetch('/api/admin/metrics').then(res => res.json()).then(d => { if (d.success) setMetricsData(d); }).catch(() => {});
        fetch('/api/logs/access').then(res => res.json()).then(setAccessLogs).catch(() => {});
        fetch('/api/logs/audit').then(res => res.json()).then(setAuditLogs).catch(() => {});
        carregarVisitorMetrics();
        carregarVisitantes();
        carregarVideoGestao();
      };

      // Filtro de busca
      const filteredSegmentos = useMemo(() => {
        if (!searchTerm.trim()) return segmentos;
        const q = searchTerm.toLowerCase();
        return segmentos.filter(s => 
          s.nome.toLowerCase().includes(q) ||
          s.tagline.toLowerCase().includes(q) ||
          s.pitch.toLowerCase().includes(q) ||
          (s.badge_solucoes && s.badge_solucoes.some(b => b.toLowerCase().includes(q)))
        );
      }, [segmentos, searchTerm]);

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          
          {/* TOAST NOTIFICAÇÃO */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-totvs-blue text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-totvs-cyan/40 animate-bounce">
              <Icons.CheckCircle />
              <span className="text-sm font-medium">{toastMsg}</span>
            </div>
          )}

          {/* HEADER PRINCIPAL */}
          <header className="bg-totvs-dark text-white border-b border-slate-700 sticky top-0 z-30 shadow-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
              
              {/* Logo & Título */}
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-totvs-blue to-totvs-cyan flex items-center justify-center font-black text-xl text-white shadow-inner">
                  T
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold text-lg tracking-tight text-white">TOTVS</span>
                    <span className="text-xs font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full bg-totvs-cyan/20 text-totvs-cyan border border-totvs-cyan/30">
                      Espaço Experiência
                    </span>
                  </div>
                  <p className="text-xs text-slate-300 font-medium">Plataforma Multiusuário de Segmentos</p>
                </div>
              </div>

              {/* Barra de Busca */}
              <div className="flex items-center gap-3 w-full order-3 sm:order-2 sm:w-auto sm:flex-1 max-w-md">
                <div className="relative w-full">
                  <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                    <Icons.Search />
                  </span>
                  <input
                    type="text"
                    placeholder="Buscar soluções (ex: MES, RFID, Consinco, PEP)..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full pl-9 pr-4 py-1.5 text-xs bg-slate-800/80 border border-slate-700 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-totvs-cyan focus:border-transparent transition"
                  />
                </div>
              </div>

              {/* Botões de Usuário Conectado e ADM */}
              <div className="flex items-center gap-3">
                {admLogado ? (
                  <div className="flex items-center gap-2">
                    <div className="flex items-center gap-2 bg-slate-800/95 text-slate-200 text-xs px-3.5 py-1.5 rounded-xl border border-totvs-cyan/40 shadow-sm">
                      <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                      <div className="text-left">
                        <span className="font-bold text-white block leading-tight">{admLogado.nome}</span>
                        <span className="text-[10px] text-totvs-cyan font-bold block">Administrador</span>
                      </div>
                    </div>
                    <button
                      onClick={handleOpenAdmin}
                      className="flex items-center gap-1.5 bg-totvs-blue hover:bg-[#003B8E] text-white text-xs font-bold px-3 py-2 rounded-xl transition shadow-sm cursor-pointer"
                      title="Painel de Gestão ADM"
                    >
                      <Icons.Shield />
                      <span>Painel ADM</span>
                    </button>
                    <button
                      onClick={handleLogoutAdm}
                      className="flex items-center gap-1 bg-rose-500/20 hover:bg-rose-600 text-rose-300 hover:text-white text-xs font-bold px-2.5 py-2 rounded-xl border border-rose-500/30 transition shadow-sm cursor-pointer"
                      title="Sair do modo administrador"
                    >
                      <Icons.LogOut />
                      <span>Sair</span>
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => setShowLoginModal(true)}
                    className="flex items-center gap-1.5 bg-white/10 hover:bg-white/20 text-white font-bold text-xs px-3.5 py-2 rounded-xl border border-white/25 transition shadow-sm backdrop-blur-md cursor-pointer hover:border-totvs-cyan/60"
                    title="Acesso restrito para Administradores com permissão de edição"
                  >
                    <Icons.Shield />
                    <span>Área ADM</span>
                  </button>
                )}
              </div>

            </div>
          </header>

          {/* LEMBRETE INTELIGENTE DAS 17:00 (FORMULÁRIO NÃO PREENCHIDO HOJE) */}
          {shouldShowFormReminder && (
            <div className="bg-gradient-to-r from-amber-600 via-amber-500 to-amber-600 text-slate-950 px-4 py-2.5 shadow-lg border-b border-amber-300/60 relative z-30 animate-in slide-in-from-top duration-300">
              <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
                <div className="flex items-center gap-2.5 text-center sm:text-left">
                  <span className="w-8 h-8 rounded-xl bg-slate-950/20 text-slate-950 flex items-center justify-center shrink-0 font-bold text-base shadow-inner">
                    <Icons.Clock />
                  </span>
                  <div>
                    <p className="text-xs sm:text-sm font-black text-slate-950 leading-tight">
                      ⚠️ Você ainda não preencheu o Formulário hoje!
                    </p>
                    <p className="text-[11px] font-medium text-slate-900/80">
                      Lembrete diário das 17:00 • Ajude a manter os dados de visitação atualizados no Espaço Experiência.
                    </p>
                  </div>
                </div>
                <div className="flex items-center gap-2 shrink-0 w-full sm:w-auto justify-end">
                  <button
                    type="button"
                    onClick={handleOpenGoogleForm}
                    className="flex-1 sm:flex-initial bg-slate-950 hover:bg-slate-900 text-white font-black text-xs px-4 py-2 rounded-xl shadow-md transition flex items-center justify-center gap-1.5 cursor-pointer"
                  >
                    <span>Abrir Formulário Agora</span>
                    <Icons.ExternalLink />
                  </button>
                  <button
                    type="button"
                    onClick={() => setDismissedReminderToday(true)}
                    className="p-2 text-slate-950/80 hover:text-slate-950 rounded-xl hover:bg-slate-950/10 transition cursor-pointer"
                    title="Dispensar lembrete por hoje"
                  >
                    <Icons.X />
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* BANNER INSTITUCIONAL */}
          <section className="relative overflow-hidden bg-gradient-to-r from-totvs-dark via-totvs-blue to-[#003B8E] text-white py-7 px-4 border-b border-totvs-cyan/20">
            {/* Grafismo sutil de fundo */}
            <div className="absolute inset-0 pointer-events-none opacity-20 select-none">
              <svg className="w-full h-full" viewBox="0 0 1200 120" preserveAspectRatio="none">

    // --- COMPONENTE: MODAL DE LOGIN DO ADMINISTRADOR ---
    function LoginModal({ onClose, onLoginSuccess }) {
      const [email, setEmail] = useState('');
      const [senha, setSenha] = useState('');
      const [showSenha, setShowSenha] = useState(false);
      const [loading, setLoading] = useState(false);
      const [erro, setErro] = useState('');

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [onClose]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setErro('');
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email.trim(), senha: senha.trim() })
          });
          const data = await res.json();
          if (data.success && data.usuario) {
            onLoginSuccess(data.usuario);
          } else {
            setErro(data.message || 'E-mail ou senha incorretos.');
          }
        } catch (err) {
          setErro('Erro de conexão ao autenticar. Tente novamente.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/75 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 border border-slate-200 animate-in fade-in zoom-in-95 duration-150 relative">
            <button
              onClick={onClose}
              className="absolute top-5 right-5 text-slate-400 hover:text-slate-700 p-1.5 rounded-xl hover:bg-slate-100 transition cursor-pointer"
              title="Fechar (ESC)"
            >
              <Icons.X />
            </button>

            <div className="text-center mb-6">
              <div className="w-12 h-12 rounded-2xl bg-totvs-blue/10 text-totvs-blue flex items-center justify-center mx-auto mb-3 font-black text-xl">
                <Icons.Shield />
              </div>
              <h3 className="font-black text-xl text-slate-800">Área do Administrador</h3>
              <p className="text-xs text-slate-500 mt-1">
                Acesso exclusivo para administradores com permissão de edição
              </p>
            </div>

            {erro && (
              <div className="mb-4 bg-rose-50 border border-rose-200 text-rose-700 text-xs p-3 rounded-xl flex items-center gap-2">
                <Icons.AlertCircle />
                <span>{erro}</span>
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div>
                <label className="block text-[11px] font-bold text-slate-700 mb-1">E-mail Corporativo:</label>
                <input
                  type="email"
                  placeholder="seu.email@totvs.com.br"
                  value={email}
                  onChange={e => setEmail(e.target.value)}

    // --- COMPONENTE: MODAL DE ATIVAÇÃO DE CONVITE DE NOVO ADM ---
    function AcceptInviteModal({ token, onClose, onAcceptSuccess }) {
      const [conviteData, setConviteData] = useState(null);
      const [carregando, setCarregando] = useState(true);
      const [erroToken, setErroToken] = useState('');
      
      const [nome, setNome] = useState('');
      const [email, setEmail] = useState('');
      const [senhaProvisoria, setSenhaProvisoria] = useState('totvs123');
      const [novaSenha, setNovaSenha] = useState('');
      const [confirmaSenha, setConfirmaSenha] = useState('');
      const [showNovaSenha, setShowNovaSenha] = useState(false);
      const [showConfirmaSenha, setShowConfirmaSenha] = useState(false);
      const [emailTocado, setEmailTocado] = useState(false);
      const [salvando, setSalvando] = useState(false);
      const [formErro, setFormErro] = useState('');

      useEffect(() => {
        if (!token) return;
        fetch(`/api/admin/invite/${token}`)
          .then(res => res.json())
          .then(data => {
            if (data.success && data.convite) {
              setConviteData(data.convite);
            } else {
              setErroToken(data.message || 'Este link de convite é inválido ou já foi utilizado.');
            }
          })
          .catch(() => setErroToken('Erro ao verificar o convite. Verifique sua conexão.'))
          .finally(() => setCarregando(false));
      }, [token]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setFormErro('');

        const emailTrim = email.trim();
        const emailRegex = /^[^s@]+@[^s@]+.[^s@]{2,}$/;
        if (!emailRegex.test(emailTrim)) {
          setFormErro('Por favor, informe um endereço de e-mail corporativo válido (exemplo: usuario@empresa.com.br).');
          return;
        }

        if (senhaProvisoria.trim() !== 'totvs123') {
          setFormErro('A senha provisória padrão é totvs123.');
          return;
        }

        if (novaSenha.trim().length < 4) {
          setFormErro('A nova senha deve possuir pelo menos 4 caracteres.');
          return;
        }

        if (novaSenha !== confirmaSenha) {
          setFormErro('A confirmação da nova senha não confere.');
          return;
        }

        setSalvando(true);
        try {
          const res = await fetch('/api/admin/accept-invite', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              token,
              nome: nome.trim(),
              email: email.trim(),
              senhaProvisoria: senhaProvisoria.trim(),
              novaSenha: novaSenha.trim()
            })
          });
          const data = await res.json();
          if (data.success && data.usuario) {
            onAcceptSuccess(data.usuario);
          } else {
            setFormErro(data.message || 'Erro ao ativar perfil de administrador.');
          }
        } catch (err) {
          setFormErro('Erro de conexão ao ativar convite.');
        } finally {
          setSalvando(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-6 sm:p-8 border border-slate-200 animate-in fade-in zoom-in-95 duration-200 relative">
            {carregando ? (
              <div className="text-center py-12">
                <div className="w-10 h-10 border-4 border-totvs-cyan border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                <p className="text-xs font-bold text-slate-600">Verificando link de convite...</p>
              </div>
            ) : erroToken ? (
              <div className="text-center py-8 space-y-4">
                <div className="w-14 h-14 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto text-2xl font-bold">
                  ⚠️
                </div>
                <h3 className="text-lg font-black text-slate-800">Convite Indisponível</h3>
                <p className="text-xs text-slate-500 max-w-sm mx-auto leading-relaxed">{erroToken}</p>
                <div className="pt-2">
                  <button
                    onClick={onClose}
                    className="px-5 py-2.5 rounded-xl bg-totvs-blue hover:bg-totvs-dark text-white font-bold text-xs transition shadow-md cursor-pointer"
                  >
                    Acessar o Espaço Experiência
                  </button>
                </div>
              </div>
            ) : (
              <div>
                <div className="text-center mb-6">
                  <div className="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-600 flex items-center justify-center mx-auto mb-2 text-2xl font-black">
                    🎉
                  </div>
                  <span className="text-[10px] font-extrabold uppercase tracking-widest text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-200 inline-block mb-1">
                    Convite de Administrador
                  </span>
                  <h3 className="font-black text-xl text-slate-800">Ative seu Perfil de ADM</h3>
                  <p className="text-xs text-slate-500 mt-1">
                    Você foi convidado por <strong>{conviteData?.criado_por || 'um Administrador'}</strong> para gerenciar o Espaço Experiência TOTVS.
                  </p>
                </div>

                {formErro && (
                  <div className="mb-4 bg-rose-50 border border-rose-200 text-rose-700 text-xs p-3 rounded-xl flex items-center gap-2">
                    <Icons.AlertCircle />
                    <span>{formErro}</span>
                  </div>
                )}

                <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-700 mb-1">Seu Nome Completo:</label>
                    <input
                      type="text"
                      placeholder="Ex: Carlos Silva"
                      value={nome}
                      onChange={e => setNome(e.target.value)}
                      className="w-full p-2.5 border border-slate-300 rounded-xl bg-white font-medium text-slate-800 focus:ring-2 focus:ring-totvs-cyan"
                      required
                      autoFocus
                    />
                  </div>

                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <label className="text-[11px] font-bold text-slate-700">Seu E-mail Corporativo:</label>
                      {emailTocado && !/^[^s@]+@[^s@]+.[^s@]{2,}$/.test(email.trim()) && email.trim().length > 0 && (
                        <span className="text-[10px] text-rose-500 font-bold">Formato inválido</span>
                      )}
                    </div>
                    <input
                      type="email"
                      placeholder="seu.nome@empresa.com.br"
                      value={email}
                      onBlur={() => setEmailTocado(true)}
                      onChange={e => {
                        setEmail(e.target.value);
                        if (!emailTocado && e.target.value.includes('@')) setEmailTocado(true);
                      }}
                      className={`w-full p-2.5 border rounded-xl bg-white font-medium text-slate-800 transition focus:ring-2 focus:ring-totvs-cyan ${
                        emailTocado && !/^[^s@]+@[^s@]+.[^s@]{2,}$/.test(email.trim()) && email.trim().length > 0
                          ? 'border-rose-400 focus:border-rose-500 bg-rose-50/20'
                          : 'border-slate-300'
                      }`}
                      required
                    />
                    {emailTocado && !/^[^s@]+@[^s@]+.[^s@]{2,}$/.test(email.trim()) && email.trim().length > 0 && (
                      <p className="text-[10px] text-rose-500 mt-1">
                        Informe um e-mail válido (ex: nome@empresa.com.br).
                      </p>
                    )}
                  </div>

                  <div className="bg-blue-50/60 p-3 rounded-2xl border border-blue-100 space-y-2">
                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="text-[11px] font-bold text-slate-700">Senha Provisória do Convite:</label>
                        <span className="text-[10px] text-totvs-blue font-bold">Padrão: totvs123</span>
                      </div>
                      <input
                        type="text"
                        value={senhaProvisoria}
                        onChange={e => setSenhaProvisoria(e.target.value)}
                        className="w-full p-2 border border-slate-300 rounded-lg bg-white font-mono text-slate-800 focus:ring-2 focus:ring-totvs-cyan"
                        required
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                      <div>
                        <label className="block text-[10.5px] font-bold text-slate-700 mb-1">Nova Senha Definitiva:</label>
                        <div className="relative">
                          <input
                            type={showNovaSenha ? 'text' : 'password'}
                            placeholder="Mínimo 4 caracteres"
                            value={novaSenha}
                            onChange={e => setNovaSenha(e.target.value)}
                            className="w-full p-2 pr-8 border border-slate-300 rounded-lg bg-white font-medium text-slate-800 focus:ring-2 focus:ring-totvs-cyan text-xs"
                            required
                          />
                          <button
                            type="button"
                            onClick={() => setShowNovaSenha(!showNovaSenha)}
                            title={showNovaSenha ? "Ocultar senha" : "Visualizar senha"}
                            className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-totvs-blue transition p-0.5 rounded cursor-pointer"
                          >
                            {showNovaSenha ? <Icons.EyeOff /> : <Icons.Eye />}
                          </button>
                        </div>
                      </div>
                      <div>
                        <label className="block text-[10.5px] font-bold text-slate-700 mb-1">Confirmar Nova Senha:</label>
                        <div className="relative">
                          <input
                            type={showConfirmaSenha ? 'text' : 'password'}
                            placeholder="Repita a nova senha"
                            value={confirmaSenha}
                            onChange={e => setConfirmaSenha(e.target.value)}

                            required
                          />
                          <button
                            type="button"
                            onClick={() => setShowConfirmaSenha(!showConfirmaSenha)}
                            title={showConfirmaSenha ? "Ocultar senha" : "Visualizar senha para confirmação"}
                            className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-totvs-blue transition p-0.5 rounded cursor-pointer"
                          >
                            {showConfirmaSenha ? <Icons.EyeOff /> : <Icons.Eye />}
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="pt-2 flex items-center justify-between gap-3">
                    <button
                      type="button"
                      onClick={onClose}
                      className="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold transition text-xs cursor-pointer"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      disabled={salvando}
                      className="flex-1 py-2.5 px-4 rounded-xl bg-gradient-to-r from-totvs-blue to-totvs-cyan hover:from-[#003B8E] hover:to-[#00B4D8] text-white font-black text-xs transition shadow-md flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50"
                    >
                      <Icons.Check />
                      <span>{salvando ? 'Ativando...' : 'Ativar e Entrar como ADM'}</span>
                    </button>
                  </div>
                </form>
              </div>
            )}
          </div>
        </div>
      );
    }

      const [form, setForm] = useState(() => {
        const copy = JSON.parse(JSON.stringify(segment));
        if (!copy.midias) copy.midias = {};
        if (!copy.midias.videos) copy.midias.videos = [];
        if (!copy.midias.fotos) copy.midias.fotos = [];
        if (!copy.credenciais) copy.credenciais = { equipamento: `PC ${copy.nome}`, usuario: 'ens.experiencia@totvs.com.br', senha: 'Experienciastotvs@2026' };
        if (typeof copy.foto_bancada === 'undefined') copy.foto_bancada = '';
        return copy;
      });

      // Estados para Foto da Bancada
      const [uploadingBancada, setUploadingBancada] = useState(false);
      const [bancadaUploadMsg, setBancadaUploadMsg] = useState('');

      // Estados para Novo Vídeo
      const [novoVideoTitulo, setNovoVideoTitulo] = useState('');
      const [novoVideoUrl, setNovoVideoUrl] = useState('');
      const [uploadingVideo, setUploadingVideo] = useState(false);
      const [videoUploadMsg, setVideoUploadMsg] = useState('');

      // Estados para Nova Foto de Apoio
      const [novaFotoTitulo, setNovaFotoTitulo] = useState('');
      const [novaFotoUrl, setNovaFotoUrl] = useState('');
      const [uploadingFoto, setUploadingFoto] = useState(false);
      const [fotoUploadMsg, setFotoUploadMsg] = useState('');

      // Função Universal de Upload Binário Direto (/api/upload)
      const handleFileUpload = async (file, tipo) => {
        if (!file) return;
        const isBancada = tipo === 'bancada';
        const isVideo = tipo === 'video';

        if (isBancada) {
          setUploadingBancada(true);
          setBancadaUploadMsg(`Enviando foto da bancada "${file.name}" para o servidor local... ⏳`);
        } else if (isVideo) {
          setUploadingVideo(true);
          setVideoUploadMsg(`Enviando "${file.name}" para o servidor local... ⏳`);
        } else {
          setUploadingFoto(true);
          setFotoUploadMsg(`Enviando "${file.name}" para o servidor local... ⏳`);
        }

        try {
          const res = await fetch('/api/upload', {
            method: 'POST',
            headers: {
              'X-Filename': encodeURIComponent(file.name),
              'Content-Type': file.type || 'application/octet-stream'
            },
            body: file
          });
          const data = await res.json();
          if (data.success && data.url) {
            if (isBancada) {
              setForm(prev => ({ ...prev, foto_bancada: data.url }));
              setBancadaUploadMsg(`Foto da bancada carregada com sucesso! ✅`);
            } else if (isVideo) {
              setNovoVideoUrl(data.url);
              setVideoUploadMsg(`Upload concluído com sucesso! ✅ (${(data.tamanho_bytes / 1024 / 1024).toFixed(2)} MB)`);
            } else {
              setNovaFotoUrl(data.url);
              setFotoUploadMsg(`Upload concluído com sucesso! ✅`);
            }
          } else {
            throw new Error(data.message || 'Falha ao processar arquivo.');
          }
        } catch (err) {
          alert(`Erro ao fazer upload do arquivo: ${err.message}`);
          if (isBancada) setBancadaUploadMsg('❌ Erro no upload da foto da bancada.');
          else if (isVideo) setVideoUploadMsg('❌ Erro no upload. Tente novamente.');
          else setFotoUploadMsg('❌ Erro no upload. Tente novamente.');
        } finally {
          if (isBancada) setUploadingBancada(false);
          else if (isVideo) setUploadingVideo(false);
          else setUploadingFoto(false);
        }
      };

      // Adicionar Vídeo à Estação
      const handleAddVideo = () => {
        if (!novoVideoUrl.trim()) {
          alert('Selecione um arquivo de vídeo do seu computador ou informe a URL do vídeo.');
          return;
        }
        const titulo = novoVideoTitulo.trim() || `Vídeo Demonstrativo de ${form.nome}`;
        const novoItem = { titulo, url: novoVideoUrl.trim() };
        setForm(prev => ({
          ...prev,
          midias: {
            ...prev.midias,
            videos: [...(prev.midias.videos || []), novoItem]
          }
        }));
        setNovoVideoTitulo('');
        setNovoVideoUrl('');
        setVideoUploadMsg('');
      };

      const handleRemoveVideo = (idx) => {
        setForm(prev => ({
          ...prev,
          midias: {
            ...prev.midias,
            videos: prev.midias.videos.filter((_, i) => i !== idx)

        }));
      };

      // Adicionar Foto à Estação

            fotos: [...(prev.midias.fotos || []), novoItem]

        }));

        setNovaFotoUrl('');
        setFotoUploadMsg('');

        setForm(prev => ({
          ...prev,
          midias: {
            ...prev.midias,
            fotos: prev.midias.fotos.filter((_, i) => i !== idx)

            ...prev,

    // --- COMPONENTE: MODAL DO VÍDEO INSTITUCIONAL DA GESTÃO (LIGHTBOX CINEMA 16:9) ---
    function VideoGestaoModal({ video, onClose }) {
      const [videoError, setVideoError] = useState(false);

      useEffect(() => {
        setVideoError(false);
      }, [video]);

      useEffect(() => {
        const originalBodyOverflow = document.body.style.overflow;
        const originalHtmlOverflow = document.documentElement.style.overflow;
        document.body.style.overflow = 'hidden';
        document.documentElement.style.overflow = 'hidden';

        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);

        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          document.body.style.overflow = originalBodyOverflow || '';
          document.documentElement.style.overflow = originalHtmlOverflow || '';
        };
      }, [onClose]);

      if (!video) return null;

      // Detectar se é link de embed externo (YouTube, Google Drive, Vimeo)
      const isEmbed = video.tipo === 'link' || (video.url && (
        video.url.includes('drive.google.com') ||
        video.url.includes('youtube.com') ||
        video.url.includes('youtu.be') ||
        video.url.includes('vimeo.com')
      ));

      let embedUrl = video.url || '';
      if (isEmbed && video.url) {
        if (video.url.includes('drive.google.com/file/d/')) {
          embedUrl = video.url.replace(/\/view(\?.*)?$/, '/preview');
        } else if (video.url.includes('youtube.com/watch')) {
          try {
            const vidId = new URL(video.url).searchParams.get('v');
            if (vidId) embedUrl = `https://www.youtube.com/embed/${vidId}?autoplay=1`;
          } catch(e) {}
        } else if (video.url.includes('youtu.be/')) {
          const vidId = video.url.split('youtu.be/')[1]?.split('?')[0];
          if (vidId) embedUrl = `https://www.youtube.com/embed/${vidId}?autoplay=1`;
        }
      }

      return (
        <div 
          className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-2 sm:p-4 md:p-6 overflow-hidden overscroll-none animate-in fade-in duration-200"

                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full bg-totvs-cyan/20 text-totvs-cyan border border-totvs-cyan/40">
                      Discurso Institucional

                    <span className="text-xs text-slate-400 font-medium hidden sm:inline">Espaço Experiência TOTVS</span>

              {video.url ? (

                  <iframe

    // --- COMPONENTE: HISTÓRICO DE VISITANTES (MESES & ANOS ANTERIORES) ---
    function VisitorHistoryModal({ onClose, currentYear = new Date().getFullYear(), showToast }) {
      const [selectedYear, setSelectedYear] = useState(currentYear);
      const [selectedMonth, setSelectedMonth] = useState(null);
      const [historyData, setHistoryData] = useState(null);
      const [loading, setLoading] = useState(true);

      // Bloquear rolagem do fundo (body + html) e fechar com ESC
      useEffect(() => {
        const originalBodyOverflow = document.body.style.overflow;
        const originalHtmlOverflow = document.documentElement.style.overflow;
        document.body.style.overflow = 'hidden';
        document.documentElement.style.overflow = 'hidden';

        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);

        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          document.body.style.overflow = originalBodyOverflow || '';
          document.documentElement.style.overflow = originalHtmlOverflow || '';
        };
      }, [onClose]);

      useEffect(() => {
        setLoading(true);
        const url = selectedMonth
          ? `/api/visitors/history?ano=${selectedYear}&mes=${selectedMonth}`
          : `/api/visitors/history?ano=${selectedYear}`;
        fetch(url)
          .then(res => res.json())
          .then(data => {
            if (data && data.success) {
              setHistoryData(data);
            }
          })
          .catch(() => {})
          .finally(() => setLoading(false));
      }, [selectedYear, selectedMonth]);

      const anosDisponiveis = historyData?.anos_disponiveis || [currentYear];
      const meses = historyData?.meses || [];
      const visitantesMes = historyData?.visitantes_mes || [];

      return (
        <div 
          className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-3 sm:p-4 md:p-6 overflow-hidden overscroll-none"
          onClick={(e) => {
            if (e.target === e.currentTarget) onClose();
          }}
          onTouchMove={(e) => {
            if (e.target === e.currentTarget) e.preventDefault();
          }}
          onWheel={(e) => {
            if (e.target === e.currentTarget) e.preventDefault();
          }}
        >
          <div 
            className="bg-white rounded-3xl shadow-2xl max-w-2xl w-full max-h-[92vh] sm:max-h-[88vh] flex flex-col overflow-hidden border border-slate-200 animate-in fade-in zoom-in-95 duration-150 my-auto"
            onClick={(e) => e.stopPropagation()}
          >
            {/* Header Fixo */}
            <div 
              className="bg-gradient-to-r from-totvs-dark via-totvs-blue to-[#003B8E] text-white p-4 sm:p-5 shrink-0 relative flex items-center justify-between"
              onTouchMove={(e) => e.stopPropagation()}

              <div className="bg-gradient-to-br from-slate-900 to-totvs-dark text-white p-4 sm:p-5 rounded-2xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border border-slate-700 shadow-md">

                  <span className="text-base font-extrabold text-white">

              </div>

              {/* Grade de 12 Meses */}
              <div>
                <div className="flex items-center justify-between mb-2.5">
                  <span className="text-xs font-bold text-slate-700 uppercase tracking-wider">
                    Meses de {selectedYear} (Clique em um mês para detalhar)
                  </span>
                  {selectedMonth && (
                    <button
                      type="button"
                      onClick={() => setSelectedMonth(null)}
                      className="text-xs text-totvs-blue hover:underline font-semibold cursor-pointer"
                    >
                      Limpar filtro de mês
                    </button>
                  )}

                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5">
                  {meses.map(m => {
                    const isSelected = selectedMonth === m.mes;
                    const hasData = m.total_pessoas > 0;
                    return (
                      <div
                        key={m.mes}
                        onClick={() => {

                          hasData ? 'cursor-pointer hover:shadow-md' : 'opacity-60 cursor-default'
                        } ${
                          isSelected
                            ? 'bg-totvs-blue text-white border-totvs-blue shadow-lg ring-2 ring-totvs-cyan'
                            : hasData
                            ? 'bg-white hover:bg-slate-50 border-slate-200 shadow-sm'

                      >

                      <Icons.Building />
                      <span>Visitas registradas em {meses.find(m => m.mes === selectedMonth)?.nome} de {selectedYear} ({visitantesMes.length}):</span>

                    <button
                      type="button"
                      onClick={() => setSelectedMonth(null)}
                      className="text-xs text-slate-500 hover:text-slate-800 p-1 rounded-lg"

                    </button>

                  {visitantesMes.length === 0 ? (
                    <p className="text-xs text-slate-500">Nenhum registro detalhado para este período.</p>

                    <div className="space-y-2 max-h-56 overflow-y-auto pr-1 scrollbar-thin">
                      {visitantesMes.map(v => (
                        <div key={v.id} className="bg-white p-2.5 rounded-xl border border-slate-200 flex items-center justify-between text-xs shadow-xs">
                          <div>

            {/* Footer Fixo */}

              className="shrink-0 bg-slate-50 px-4 sm:px-6 py-3.5 sm:py-4 border-t border-slate-200 flex items-center justify-end"

              <button
