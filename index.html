            {/* TOAST NOTIFICAÇÃO */}
            {toastMsg && (
              <div className="fixed bottom-6 right-6 z-50 bg-totvs-blue text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-totvs-cyan/40 animate-bounce">
                <Icons.CheckCircle />
                <span className="text-sm font-medium">{toastMsg}</span>
              </div>
            )}

            {/* HEADER PRINCIPAL NOBRE (MANTÉM APENAS: BRANDING, VÍDEO & CONTADORES) */}
            <header className="bg-totvs-dark text-white border-b border-slate-700/80 sticky top-0 z-30 shadow-md">
              <div className="max-w-[1720px] mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3 sm:gap-4">
                
                {/* 1. Lado Esquerdo: Logo TOTVS Oficial + Espaço Experiência + Subtítulo */}
                <div className="flex items-center gap-3 shrink-0">
                  <TotvsLogo className="h-7 text-white" />
                  <div className="h-5 w-px bg-slate-700/80 mx-0.5 hidden sm:block"></div>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-[10px] font-black uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-totvs-cyan/15 text-totvs-cyan border border-totvs-cyan/30 shadow-2xs">
                        Espaço Experiência
                      </span>
                    </div>
                    <p className="text-[11px] text-slate-300 font-medium flex items-center gap-1.5 mt-0.5">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                      <span>Showroom Inteligente • {segmentos.length || 11} Estações de Tecnologia</span>
                    </p>
                  </div>
                </div>

                {/* 2. Centro: Link Discurso da Liderança (16:9 • Veja seu discurso aqui !!!) */}
                {videoGestao && videoGestao.ativo !== false ? (
                  <div className="flex-1 flex justify-center max-w-xl order-3 xl:order-2 w-full xl:w-auto">
                    <button
                      type="button"
                      onClick={() => setShowVideoModal(true)}
                      className="w-full sm:w-auto flex items-center gap-3.5 bg-gradient-to-r from-totvs-blue/35 via-slate-800/85 to-totvs-cyan/20 hover:from-totvs-blue/55 hover:to-totvs-cyan/35 border border-totvs-cyan/50 hover:border-totvs-cyan px-4 py-2 rounded-2xl transition-all duration-300 group shadow-md hover:shadow-totvs-cyan/20 cursor-pointer transform hover:-translate-y-0.5"
                      title="Assistir ao Discurso Institucional da Liderança em Vídeo"
                    >
                      <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-totvs-cyan to-teal-300 text-slate-950 flex items-center justify-center font-black text-sm shrink-0 shadow-md group-hover:scale-110 group-hover:rotate-3 transition-transform">
                        <Icons.Play />
                      </div>
                      <div className="text-left leading-tight pr-1">
                        <span className="text-[9.5px] font-black uppercase text-totvs-cyan tracking-wider flex items-center gap-1">
                          <span>Discurso da Liderança</span>
                          <span className="text-[8.5px] px-1 py-0.2 rounded bg-totvs-cyan/20 text-totvs-cyan font-bold">16:9</span>
                        </span>
                        <span className="text-xs sm:text-sm font-extrabold text-white truncate max-w-[260px] sm:max-w-[340px] block mt-0.5 group-hover:text-cyan-100 transition-colors">
                          {videoGestao.mensagem || 'Assistir Discurso Institucional'}
                        </span>
                      </div>
                    </button>
                  </div>
                ) : (
                  <div className="flex-1 hidden xl:block"></div>
                )}

                {/* 3. Lado Direito: Contadores de Visitantes */}
                <div className="flex items-center gap-2 sm:gap-3 shrink-0 order-2 xl:order-3 ml-auto xl:ml-0">
                  <div className="flex items-center gap-1 sm:gap-1.5 bg-slate-800/80 p-1 rounded-xl border border-slate-700/80 shadow-xs">
                    <div className="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-white/5 border border-white/10 text-xs">
                      <span className="text-[9.5px] text-slate-400 font-extrabold uppercase">Hoje:</span>
                      <span className="font-black text-white">{visitorMetrics.hoje}</span>
                    </div>

                    <div className="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-white/5 border border-white/10 text-xs">
                      <span className="text-[9.5px] text-slate-400 font-extrabold uppercase">Sem:</span>
                      <span className="font-black text-white">{visitorMetrics.semana}</span>
                    </div>

                    <div className="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-white/5 border border-white/10 text-xs">
                      <span className="text-[9.5px] text-slate-400 font-extrabold uppercase">Mês:</span>
                      <span className="font-black text-white">{visitorMetrics.mes}</span>
                    </div>

                    <div className="hidden sm:flex items-center gap-1 px-2.5 py-1 rounded-lg bg-white/5 border border-white/10 text-xs">
                      <span className="text-[9.5px] text-slate-400 font-extrabold uppercase">Ano:</span>
                      <span className="font-black text-white">{visitorMetrics.ano !== undefined ? visitorMetrics.ano : (visitorMetrics.total || 0)}</span>
                    </div>

                    {/* Botão Registrar Visitante */}
                    <button
                      type="button"
                      onClick={() => {
                        if (authEspecialistaObrigatoria && !admLogado) {
                          showToast('Identifique-se para registrar visitantes presenciais.');
                          setShowLoginModal(true);
                          return;
                        }
                        setShowVisitorModal(true);
                      }}
                      className="flex items-center gap-1.5 bg-gradient-to-r from-totvs-cyan to-teal-300 hover:from-cyan-300 hover:to-teal-200 text-slate-900 font-black px-2.5 sm:px-3 py-1 rounded-lg text-xs shadow-xs transition transform hover:scale-102 active:scale-98 cursor-pointer ml-0.5"
                      title={authEspecialistaObrigatoria && !admLogado ? "Identifique-se para registrar visitantes presenciais" : "Registrar visita presencial no Espaço Experiência TOTVS"}
                    >
                      <Icons.UserPlus />
                      <span className="hidden md:inline">Registrar Visitante</span>
                      <span className="md:hidden">Registrar</span>
                    </button>
                  </div>

                  {/* Identificação de Usuário / Entrar */}
                  {!admLogado ? (
                    <button
                      type="button"
                      onClick={() => setShowLoginModal(true)}
                      className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-totvs-blue/30 hover:bg-totvs-blue/50 text-totvs-cyan hover:text-white border border-totvs-cyan/40 text-xs font-bold transition shadow-xs cursor-pointer ml-1"
                      title="Acessar com perfil de Especialista, PMM ou Administrador"
                    >
                      <Icons.Shield />
                      <span className="hidden sm:inline">Entrar</span>
                      <span className="text-[10px] sm:hidden">Entrar</span>
                    </button>
                  ) : (
                    <button
                      type="button"
                      onClick={() => {
                        if (admLogado.perfil === 'especialista') {
                          setShowMeuPerfilModal(true);
                        } else {
                          handleOpenAdmin();
                        }
                      }}
                      className={`flex items-center gap-2 px-2.5 py-1 rounded-xl border text-xs transition cursor-pointer ml-1 ${
                        admLogado.perfil === 'especialista'
                          ? 'bg-purple-950/50 hover:bg-purple-900/60 border-purple-400/40 text-purple-200'
                          : 'bg-slate-800/90 hover:bg-slate-700 border-slate-700 text-white'
                      }`}
                      title={admLogado.perfil === 'especialista' ? "Meu Perfil de Especialista" : "Painel do Administrador"}
                    >
                      {admLogado.foto ? (
                        <img src={admLogado.foto} alt={admLogado.nome} className="w-5 h-5 rounded-full object-cover border border-totvs-cyan" />
                      ) : (
                        <div className={`w-5 h-5 rounded-full text-white flex items-center justify-center font-black text-[10px] ${
                          admLogado.perfil === 'especialista' ? 'bg-purple-700' : 'bg-totvs-blue'
                        }`}>
                          {admLogado.nome ? admLogado.nome.charAt(0).toUpperCase() : 'U'}
                        </div>
                      )}
                      <span className="font-bold text-xs truncate max-w-[110px] hidden md:inline">{admLogado.nome}</span>
                      <span className={`text-[8.5px] font-black uppercase px-1.5 py-0.2 rounded ${
                        admLogado.dono_produto 
                          ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-400/30' 
                          : admLogado.perfil === 'especialista'
                            ? 'bg-purple-500/20 text-purple-300 border border-purple-400/30'
                            : (admLogado.perfil === 'pmm' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-400/30' : 'bg-totvs-cyan/20 text-totvs-cyan border border-totvs-cyan/30')
                      }`}>
                        {admLogado.dono_produto ? 'DONO' : (admLogado.perfil === 'especialista' ? 'ESP' : (admLogado.perfil === 'pmm' ? 'PMM' : 'ADM'))}
                      </span>
                    </button>
                  )}
                </div>

              </div>
            </header>

          {/* LEMBRETE INTELIGENTE DAS 17:00 (FORMULÁRIO NÃO PREENCHIDO HOJE) */}
          {shouldShowFormReminder && (
            <div className="bg-gradient-to-r from-amber-600 via-amber-500 to-amber-600 text-slate-950 px-4 py-2 shadow-md border-b border-amber-300/60 relative z-30 animate-in slide-in-from-top duration-300">
              <div className="max-w-[1720px] mx-auto flex flex-col sm:flex-row items-center justify-between gap-2.5">
                <div className="flex items-center gap-2 text-center sm:text-left">
                  <span className="w-6 h-6 rounded-lg bg-slate-950/20 text-slate-950 flex items-center justify-center shrink-0 font-bold text-xs shadow-inner">
                    <Icons.Clock />
                  </span>
                  <div>
                    <p className="text-xs font-black text-slate-950 leading-tight">
                      ⚠️ Você ainda não preencheu o Formulário hoje!
                    </p>
                    <p className="text-[10.5px] font-medium text-slate-900/85">
                      Lembrete diário das 17:00 • Ajude a manter os dados de visitação atualizados.
                    </p>
                  </div>
                </div>
                <div className="flex items-center gap-2 shrink-0 w-full sm:w-auto justify-end">
                  <button
                    type="button"
                    onClick={handleOpenGoogleForm}
                    className="flex-1 sm:flex-initial bg-slate-950 hover:bg-slate-900 text-white font-black text-[11px] px-3 py-1.5 rounded-lg shadow-sm transition flex items-center justify-center gap-1.5 cursor-pointer"
                  >
                    <span>Abrir Formulário</span>
                    <Icons.ExternalLink />
                  </button>
                  <button
                    type="button"
                    onClick={() => setDismissedReminderToday(true)}
                    className="p-1.5 text-slate-950/80 hover:text-slate-950 rounded-lg hover:bg-slate-950/10 transition cursor-pointer"
                    title="Dispensar lembrete por hoje"
                  >
                    <Icons.X />
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* GRID DE CARDS NA ORDEM DA JORNADA (EXPANDIDO PARA ATÉ 5 COLUNAS COMPACTAS) */}
          <main className="max-w-[1720px] mx-auto px-3 sm:px-4 lg:px-6 py-4 flex-1 w-full">
            {loading ? (
              <div className="text-center py-20">
                <div className="w-12 h-12 border-4 border-totvs-cyan border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <p className="text-sm font-semibold text-slate-600">Carregando estações do Espaço Experiência...</p>
              </div>
            ) : filteredSegmentos.length === 0 ? (
              <div className="text-center py-16 bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
                <p className="text-slate-500 font-medium">Nenhum segmento encontrado para a busca "{searchTerm}".</p>
                <button
                  onClick={() => setSearchTerm('')}
                  className="mt-3 text-xs font-semibold text-totvs-cyan hover:underline"
                >
                  Limpar busca
                </button>
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-3.5 sm:gap-4">
                {filteredSegmentos.map((seg) => {
                  const IconComp = Icons[seg.icone] || Icons.Factory;
                  const theme = SegmentThemes[seg.id] || defaultTheme;

                  return (
                    <div
                      key={seg.id}
                      className={`bg-white rounded-2xl border border-slate-200/90 shadow-2xs transition-all duration-300 flex flex-col relative group hover:-translate-y-1 hover:shadow-md hover:z-40 ${theme.glowBorder}`}
                    >
                      {/* Topo do Card com Gradiente e Ícone Compacto */}
                      <div className={`p-2.5 sm:p-3 relative overflow-hidden rounded-t-2xl bg-gradient-to-br ${theme.gradientHeader} text-white border-b border-white/10`}>
                        {/* Grafismo Geométrico Tech */}
                        <CardTechGraphic accentColor={theme.accentColor} />

                        <div className="relative z-10 flex items-start justify-between gap-2">
                          <div className="flex items-center gap-2.5 min-w-0">
                            <div className="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-white/15 backdrop-blur-md text-white border border-white/20 flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform duration-300 shadow-inner">
                              <IconComp />
                            </div>
                            <div className="min-w-0">
                              <span className={`inline-block text-[8.5px] font-extrabold uppercase tracking-wider px-1.5 py-0.2 rounded-full mb-0.5 ${theme.tagBg}`}>
                                Estação {seg.ordem.toString().padStart(2, '0')}

                          {admLogado && admLogado.perfil !== 'especialista' && (
                            <button
                              type="button"
                              onClick={() => setQuickBancadaSegment(seg)}
                              className="flex items-center gap-1 px-2 py-0.5 rounded-lg bg-white/20 hover:bg-white/35 text-white text-[9.5px] font-extrabold border border-white/30 shadow-2xs transition backdrop-blur-md cursor-pointer shrink-0"
                              title={`Editar dados e configurações da Estação ${seg.ordem.toString().padStart(2, '0')}`}
                            >
                              <Icons.Edit />
                              <span>Editar</span>
                            </button>
                          )}
                        </div>
                      </div>

                      {/* Capa com Foto da Bancada Física */}
                      <StationPhotoCover seg={seg} onOpenPhoto={setLightboxSegment} />

                      <div className="p-2.5 sm:p-3 flex-1 flex flex-col justify-between space-y-2 bg-[#F0F5FA] rounded-b-2xl">
                        {/* Badges de Soluções do Segmento */}
                        <div className="space-y-1 pt-0.5">
                          <span className="text-[9px] font-extrabold uppercase tracking-wider text-slate-500 flex items-center gap-1">
                            <span>Soluções em Destaque:</span>
                          </span>
                          <div className="flex flex-wrap gap-1">
                            {seg.badge_solucoes && seg.badge_solucoes.map((badge, bIdx) => (
                              <span
                                key={bIdx}
                                className={`text-[10px] font-bold px-2 py-0.5 rounded-md border shadow-2xs ${theme.badgeBg}`}
                              >
                                {badge}
                              </span>
                            ))}
                          </div>
                        </div>

                        {/* Rodapé do Card com Ação */}
                        <div className="pt-1.5 border-t border-slate-200/60">
                          <button
                            onClick={() => setActiveSegment(seg)}
                            className="w-full flex items-center justify-center gap-1.5 bg-gradient-to-r from-totvs-blue via-totvs-vibrant to-totvs-cyan hover:from-totvs-vibrant hover:to-totvs-accent text-white text-xs font-bold py-1.5 sm:py-2 px-3 rounded-xl transition-all duration-300 shadow-xs hover:shadow-md transform active:scale-95 cursor-pointer"
                          >
                            <span>Abrir Guia</span>
                            <Icons.ChevronRight />
                          </button>
                        </div>

                        {/* Última atualização */}
                        <div className="text-[9px] text-slate-400 flex items-center justify-between pt-0.5 font-mono">
                          <span className="truncate max-w-[120px]">Por: {seg.ultima_atualizacao?.autor || 'Especialista'}</span>
                          <span>{seg.ultima_atualizacao?.data?.split(' ')[0]}</span>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </main>

          {/* MODAL DETALHE DO SEGMENTO (MODO COPILOTO) */}
          {activeSegment && (
            <SegmentDetailModal
              segment={activeSegment}
              admLogado={admLogado}
              onClose={() => setActiveSegment(null)}
              onSegmentChange={(updatedSeg) => {
                setActiveSegment(updatedSeg);
                setSegmentos(prev => prev.map(s => s.id === updatedSeg.id ? updatedSeg : s));
              }}
              showToast={showToast}
            />
          )}

          {/* MODAL DE EDIÇÃO DESCENTRALIZADA COMPLETA */}
          {editSegment && (
            <SegmentEditModal
              segment={editSegment}
              usuarioAtivo={admLogado}
              onClose={() => setEditSegment(null)}
              onSave={handleTriggerSave}
            />
          )}

          {/* MODAL RÁPIDO: EDITAR FOTO DA BANCADA E CREDENCIAIS DE PC */}
          {quickBancadaSegment && (
            <QuickBancadaModal
              segment={quickBancadaSegment}
              onClose={() => setQuickBancadaSegment(null)}
              onSave={handleSaveQuickBancada}
            />
          )}

          {/* MODAL DE CHECKPOINT / VALIDAÇÃO EXPLÍCITA ANTES DE SALVAR */}
          {validationModal && (
            <ValidationModal
              data={validationModal}
              usuarioAtivo={admLogado}
              onCancel={() => setValidationModal(null)}
              onConfirm={handleConfirmSave}
            />
          )}

          {/* MODAL DE LOGIN DO ADMINISTRADOR */}
          {showLoginModal && (
            <LoginModal
              onClose={() => setShowLoginModal(false)}
              onLoginSuccess={handleLoginSuccess}
            />
          )}

          {/* MODAL DE TROCA DE SENHA OBRIGATÓRIA (PRIMEIRO ACESSO OU PÓS-RESET) */}
          {showForcarTrocaSenhaModal && usuarioTrocaSenhaPendente && (
            <ForcarTrocaSenhaModal
              usuario={usuarioTrocaSenhaPendente}
              onSuccess={(usuarioAtualizado) => {
                setShowForcarTrocaSenhaModal(false);
                setUsuarioTrocaSenhaPendente(null);
                setAdmLogado(usuarioAtualizado);
                sessionStorage.setItem('totvs_adm_session', JSON.stringify(usuarioAtualizado));
                try { localStorage.removeItem('totvs_adm_session'); } catch(e){}
                const perfilLabel = usuarioAtualizado.perfil === 'especialista' ? 'Especialista' : (usuarioAtualizado.perfil === 'pmm' ? 'PMM' : 'Administrador');
                showToast(`Olá, ${usuarioAtualizado.nome}! Sua nova senha pessoal foi cadastrada com sucesso! Perfil de ${perfilLabel} liberado! 🎉`);
              }}
              onClose={() => {
                setShowForcarTrocaSenhaModal(false);
                setUsuarioTrocaSenhaPendente(null);
              }}
              showToast={showToast}
            />
          )}

          {/* MODAL DE ATIVAÇÃO DE CONVITE (VIA URL ?convite=TOKEN) */}
          {showAcceptInviteModal && conviteToken && (
            <AcceptInviteModal
              token={conviteToken}
              onClose={() => {
                setShowAcceptInviteModal(false);
                setConviteToken(null);
                window.history.replaceState({}, document.title, window.location.pathname);
              }}
              onAcceptSuccess={handleAcceptInviteSuccess}
            />
          )}

          {/* MODAL DE HISTÓRICO DE VISITANTES (MESES & ANOS ANTERIORES) - EXCLUSIVO ADM */}
          {showVisitorHistoryModal && admLogado && (admLogado.perfil === 'adm' || admLogado.dono_produto) && admLogado.perfil !== 'especialista' && (
            <VisitorHistoryModal
              currentYear={visitorMetrics.ano_atual || new Date().getFullYear()}
              onClose={() => setShowVisitorHistoryModal(false)}
              showToast={showToast}
              visitorsList={visitorsList}
            />
          )}

          {/* MODAL DE REGISTRO DE VISITANTE NO ESPAÇO EXPERIÊNCIA (ACESSO ABERTO) */}
          {showVisitorModal && (
            <VisitorRegisterModal
              admLogado={admLogado}
              plantonistaHoje={plantonistaHoje}
              onClose={() => setShowVisitorModal(false)}
              onSuccess={(newMetrics) => {
                if (newMetrics) setVisitorMetrics(newMetrics);
                carregarVisitantes();
                carregarVisitorMetrics();
              }}
              onFormOpened={() => {
                setVisitorMetrics(prev => ({ ...prev, formulario_aberto_hoje: true }));
              }}
              showToast={showToast}
            />
          )}

          {/* MODAL PAINEL ADM */}
          {adminModal && (
            <AdminModal
              admLogado={admLogado}
              authEspecialistaObrigatoria={authEspecialistaObrigatoria}
              onAuthModeChange={(novoModo) => setAuthEspecialistaObrigatoria(novoModo)}
              onUpdateAdmProfile={handleUpdateAdmProfile}
              activeTab={adminTab}
              onTabChange={setAdminTab}
              admsList={admsList}
              onAdmsChange={carregarDadosAdmin}
              convitesList={convitesList}
              onConvitesChange={carregarDadosAdmin}
              metricsData={metricsData}
              accessLogs={accessLogs}
              auditLogs={auditLogs}
              segmentos={segmentos}
              visitorsList={visitorsList}
              onVisitorsChange={carregarDadosAdmin}
              visitorMetrics={visitorMetrics}
              onOpenVisitorModal={() => setShowVisitorModal(true)}
              onClose={() => setAdminModal(false)}
              onRefresh={carregarDadosAdmin}
              onLogout={handleLogoutAdm}
              videoGestao={videoGestao}
              onVideoGestaoChange={carregarVideoGestao}
              showToast={showToast}
            />
          )}

          {/* MODAL EXCLUSIVO "MEU PERFIL" DO ESPECIALISTA */}
          {showMeuPerfilModal && admLogado && (
            <MeuPerfilModal
              usuario={admLogado}
              onClose={() => setShowMeuPerfilModal(false)}
              onUpdateUser={handleUpdateAdmProfile}
              onLogout={() => {
                setShowMeuPerfilModal(false);
                handleLogoutAdm();
              }}
              showToast={showToast}
            />
          )}

          {/* MODAL LIGHTBOX DE FOTO AMPLIADA */}
          {lightboxSegment && (
            <PhotoLightboxModal
              segment={lightboxSegment}
              onClose={() => setLightboxSegment(null)}
            />
          )}

          {/* MODAL VÍDEO INSTITUCIONAL DA GESTÃO (LIGHTBOX CINEMA 16:9) */}
          {showVideoModal && (
            <VideoGestaoModal
              video={videoGestao}
              onClose={() => setShowVideoModal(false)}
            />
          )}

          {/* MODAL DO CALENDÁRIO DOS PLANTONISTAS DO ESPAÇO */}
          {showPlantonistasModal && (
            <PlantonistasModal
              onClose={() => setShowPlantonistasModal(false)}
              admLogado={admLogado}
              authEspecialistaObrigatoria={authEspecialistaObrigatoria}
              showToast={showToast}
            />
          )}

          {/* FOOTER CORPORATIVO */}
          <footer className="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 mt-auto">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
              <p>TOTVS S.A. • Espaço Experiência • Todos os direitos reservados.</p>
              <p className="text-slate-400">Ambiente Multiusuário de Capacitação e Monitoramento de Utilização</p>
            </div>
          </footer>

          </div>
        </div>
      );
    }

    // --- COMPONENTE: MODAL "MEU PERFIL" DO ESPECIALISTA ---
    function MeuPerfilModal({ usuario, onClose, onUpdateUser, onLogout, showToast }) {
      const [nomeInput, setNomeInput] = useState(usuario.nome || '');
      const [novaSenha, setNovaSenha] = useState('');
      const [confirmaSenha, setConfirmaSenha] = useState('');
      const [salvandoPerfil, setSalvandoPerfil] = useState(false);
      const [erroPerfil, setErroPerfil] = useState('');
      const [fotoCarregando, setFotoCarregando] = useState(false);
      const fileInputRef = useRef(null);

      // Bloquear scroll ao abrir modal
      useEffect(() => {
        const originalOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          document.body.style.overflow = originalOverflow;
        };
      }, [onClose]);

      const handleFileSelected = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
          if (showToast) showToast('Por favor, selecione um arquivo de imagem (JPEG, PNG ou WEBP).');
          return;
        }

        if (file.size > 2 * 1024 * 1024) {
          if (showToast) showToast('A foto deve ter no máximo 2MB.');
          return;
        }

        setFotoCarregando(true);
        const reader = new FileReader();
        reader.onload = async (evt) => {
          const base64 = evt.target.result;
          try {
            if (window.google && google.script && google.script.run) {
              google.script.run
                .withSuccessHandler((res) => {
                  setFotoCarregando(false);
                  if (res && res.success) {
                    const updated = { ...usuario, foto: base64 };
                    onUpdateUser(updated);
                    if (showToast) showToast('Foto de perfil atualizada com sucesso! 📸');
                  } else {
                    if (showToast) showToast('Erro ao salvar foto: ' + (res?.message || 'Falha'));
                  }
                })
                .withFailureHandler(() => {
                  setFotoCarregando(false);
                  if (showToast) showToast('Erro de comunicação com o Google Apps Script.');
                })
                .atualizarFotoUsuario(usuario.email, base64);
            } else {
              const res = await fetch('/api/admin/avatar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: usuario.email, foto: base64 })
              });
              const data = await res.json();
              setFotoCarregando(false);
              if (data.success) {
                const updated = { ...usuario, foto: base64 };
                onUpdateUser(updated);
                if (showToast) showToast('Foto de perfil atualizada com sucesso! 📸');
              } else {
                if (showToast) showToast(data.message || 'Erro ao salvar foto de perfil.');
              }
            }
          } catch (err) {
            setFotoCarregando(false);
            if (showToast) showToast('Erro ao atualizar foto de perfil.');
          }
        };
        reader.readAsDataURL(file);
      };

      const handleSalvarPerfil = async (e) => {
        e.preventDefault();
        setErroPerfil('');

        const nomeLimpo = (nomeInput || '').trim();
        if (!nomeLimpo) {
          setErroPerfil('O nome completo não pode ficar em branco.');
          return;
        }

        const senhaLimpa = novaSenha.trim();
        if (senhaLimpa) {
          const senhaValida = /^(?=.*[a-zA-Z])(?=.*[0-9]).{6,}$/.test(senhaLimpa);
          if (!senhaValida) {
            setErroPerfil('A nova senha deve possuir no mínimo 6 caracteres e conter letras e números.');
            return;
          }
          if (senhaLimpa !== confirmaSenha.trim()) {
            setErroPerfil('A confirmação da nova senha não confere.');
            return;
          }
        }

        if (!senhaLimpa && nomeLimpo === (usuario.nome || '').trim()) {
          setErroPerfil('Nenhuma alteração foi realizada.');
          return;
        }

        setSalvandoPerfil(true);
        const payload = {
          email: usuario.email,
          nome: nomeLimpo,
          novaSenha: senhaLimpa || undefined,
          autorEmail: usuario.email,
          autorNome: usuario.nome
        };

        try {
          if (window.google && google.script && google.script.run) {
            google.script.run
              .withSuccessHandler((res) => {
                setSalvandoPerfil(false);
                if (res && res.success) {
                  setNovaSenha('');
                  setConfirmaSenha('');
                  const updated = { ...usuario, nome: nomeLimpo };
                  onUpdateUser(updated);
                  if (showToast) showToast('Perfil atualizado com sucesso! ✨');
                } else {
                  setErroPerfil(res?.message || 'Erro ao salvar perfil.');
                }
              })
              .withFailureHandler(() => {
                setSalvandoPerfil(false);
                setErroPerfil('Falha de conexão com o servidor.');
              })
              .atualizarPerfilUsuario(payload);
          } else {
            const res = await fetch('/api/admin/update-profile', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            const data = await res.json();
            setSalvandoPerfil(false);
            if (data.success) {
              setNovaSenha('');
              setConfirmaSenha('');
              const updated = data.usuario || { ...usuario, nome: nomeLimpo };
              onUpdateUser(updated);
              if (showToast) showToast('Perfil atualizado com sucesso! ✨');
            } else {
              setErroPerfil(data.message || 'Erro ao atualizar perfil.');
            }
          }
        } catch (err) {
          setSalvandoPerfil(false);
          setErroPerfil('Erro de conexão ao salvar perfil.');
        }
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl shadow-2xl max-w-lg w-full border border-slate-200 overflow-hidden animate-in fade-in zoom-in-95 duration-200">
            {/* Topo / Header */}
            <div className="bg-gradient-to-r from-totvs-dark via-slate-900 to-purple-900 p-5 text-white flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <span className="w-8 h-8 rounded-xl bg-purple-500/20 text-purple-300 border border-purple-400/40 flex items-center justify-center text-sm font-black shadow-xs">
                  🌟
                </span>
                <div>
                  <h3 className="font-extrabold text-sm sm:text-base text-white">Meu Perfil • Especialista</h3>
                  <p className="text-[11px] text-slate-300">Espaço Experiência TOTVS</p>
                </div>
              </div>
              <button
                type="button"
                onClick={onClose}
                className="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-slate-300 hover:text-white flex items-center justify-center transition cursor-pointer"
                title="Fechar (ESC)"
              >
                ✕
              </button>
            </div>

            {/* Conteúdo */}
            <div className="p-5 sm:p-6 space-y-5">
              {/* Card de Identificação */}
              <div className="flex flex-col sm:flex-row items-center sm:items-start gap-4 p-4 rounded-2xl bg-purple-50/50 border border-purple-100">
                <div className="relative group shrink-0">
                  {usuario.foto ? (
                    <img
                      src={usuario.foto}
                      alt={usuario.nome}
                      className="w-20 h-20 rounded-2xl object-cover border-2 border-purple-400 shadow-md"
                    />
                  ) : (
                    <div className="w-20 h-20 rounded-2xl bg-gradient-to-tr from-purple-700 to-totvs-blue text-white flex items-center justify-center font-black text-2xl border-2 border-purple-300 shadow-md">
                      {usuario.nome ? usuario.nome.charAt(0).toUpperCase() : 'E'}
                    </div>
                  )}

                  <button
                    type="button"
                    onClick={() => fileInputRef.current?.click()}
                    disabled={fotoCarregando}
                    className="absolute -bottom-1 -right-1 p-2 rounded-xl bg-purple-700 hover:bg-purple-800 text-white shadow-md border-2 border-white transition cursor-pointer group-hover:scale-105"
                    title="Alterar Foto de Perfil"
                  >
                    <Icons.Camera />
                  </button>
                  <input
                    ref={fileInputRef}
                    type="file"
                    accept="image/*"
                    className="hidden"
                    onChange={handleFileSelected}
                  />
                </div>

                <div className="text-center sm:text-left min-w-0 flex-1">
                  <div className="flex flex-wrap items-center justify-center sm:justify-start gap-2">
                    <h4 className="font-extrabold text-base text-slate-900 truncate">{usuario.nome}</h4>
                    <span className="text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 border border-purple-200">
                      Especialista
                    </span>
                  </div>
                  <p className="text-xs text-totvs-blue font-mono mt-0.5 truncate">{usuario.email}</p>
                  <p className="text-[11px] text-slate-500 font-medium mt-1">
                    {usuario.cargo || 'Especialista do Espaço Experiência'}
                  </p>

                  <div className="mt-2 text-[10.5px] text-purple-900 bg-white/80 rounded-xl p-2.5 border border-purple-200/80 leading-relaxed text-left">
                    <strong>Permissões de Acesso:</strong>
                    <ul className="list-disc list-inside mt-0.5 space-y-0.5 text-slate-600">
                      <li>Registro de visitantes presenciais no showroom;</li>
                      <li>Edição da escala diária de plantonistas no calendário;</li>
                      <li>Visualização completa de todas as estações e guias (somente leitura).</li>
                    </ul>
                  </div>
                </div>
              </div>

              {/* Formulário: Editar Perfil e Senha */}
              <form onSubmit={handleSalvarPerfil} className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-3">
                <h5 className="font-bold text-xs uppercase tracking-wider text-slate-700 flex items-center gap-1.5">
                  <Icons.Edit />
                  <span>Editar Meus Dados Cadastrais</span>
                </h5>

                {erroPerfil && (
                  <div className="p-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs flex items-center gap-2">
                    <Icons.AlertCircle />
                    <span>{erroPerfil}</span>
                  </div>
                )}

                <div>
                  <label className="block text-[11px] font-bold text-slate-600 mb-1">
                    Nome Completo *
                  </label>
                  <input
                    type="text"
                    placeholder="Seu nome completo"
                    value={nomeInput}
                    onChange={(e) => setNomeInput(e.target.value)}
                    className="w-full text-xs px-3 py-2 rounded-xl bg-white border border-slate-300 text-slate-800 focus:outline-none focus:ring-2 focus:ring-purple-400 font-medium"
                    required
                  />
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-600 mb-1">
                      Nova Senha (opcional)
                    </label>
                    <input
                      type="password"
                      placeholder="Deixe em branco p/ manter atual"
                      value={novaSenha}
                      onChange={(e) => setNovaSenha(e.target.value)}
                      className="w-full text-xs px-3 py-2 rounded-xl bg-white border border-slate-300 text-slate-800 focus:outline-none focus:ring-2 focus:ring-purple-400"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-600 mb-1">
                      Confirmar Nova Senha
                    </label>
                    <input
                      type="password"
                      placeholder="Repita a nova senha se alterar"
                      value={confirmaSenha}
                      onChange={(e) => setConfirmaSenha(e.target.value)}
                      className="w-full text-xs px-3 py-2 rounded-xl bg-white border border-slate-300 text-slate-800 focus:outline-none focus:ring-2 focus:ring-purple-400"
                    />
                  </div>
                </div>

                <div className="flex items-center justify-between pt-1">
                  <span className="text-[10px] text-slate-400">
                    Mínimo 6 chars (letras e números) se alterar senha.
                  </span>
                  <button
                    type="submit"
                    disabled={salvandoPerfil || !nomeInput.trim()}
                    className={`px-4 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 cursor-pointer ${
                      salvandoPerfil || !nomeInput.trim()
                        ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
                        : 'bg-purple-700 hover:bg-purple-800 text-white shadow-xs'
                    }`}
                  >
                    <Icons.CheckCircle />
                    <span>{salvandoPerfil ? 'Salvando...' : 'Salvar Alterações'}</span>
                  </button>
                </div>
              </form>

              {/* Ações de Saída e Fechamento */}
              <div className="flex items-center justify-between pt-2 border-t border-slate-100">
                <button
                  type="button"
                  onClick={onLogout}
                  className="px-4 py-2 rounded-xl text-rose-600 hover:bg-rose-50 text-xs font-bold transition flex items-center gap-1.5 cursor-pointer"
                >
                  <Icons.LogOut />
                  <span>Sair da Minha Conta</span>
                </button>

                <button
                  type="button"
                  onClick={onClose}
                  className="px-5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition cursor-pointer"
                >
                  Fechar
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- COMPONENTE: MODAL DE IDENTIFICAÇÃO / LOGIN CORPORATIVO ---
    function LoginModal({ onClose, onLoginSuccess }) {
      const [email, setEmail] = useState('');
      const [senha, setSenha] = useState('');
      const [showSenha, setShowSenha] = useState(false);
      const [loading, setLoading] = useState(false);
      const [erro, setErro] = useState('');

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [onClose]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setErro('');
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email.trim(), senha: senha.trim() })
          });
          const data = await res.json();
          if (data.success && data.usuario) {
            onLoginSuccess(data.usuario);
          } else {
            setErro(data.message || 'E-mail ou senha incorretos.');
          }
        } catch (err) {
          setErro('Erro de conexão ao autenticar. Tente novamente.');
        } finally {
          setLoading(false);
        }
      };

      return (

            <div className="text-center mb-6">

              <h3 className="font-black text-xl text-slate-800">Identificação Corporativa</h3>
              <p className="text-xs text-slate-500 mt-1">
                Acesse como Especialista, PMM ou Administrador do Espaço Experiência

            {erro && (

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">

                <input

                    {showSenha ? <Icons.EyeOff /> : <Icons.Eye />}

    // --- COMPONENTE: MODAL OBRIGATÓRIO DE DEFINIÇÃO DE NOVA SENHA (PÓS-RESET / PRIMEIRO ACESSO) ---
    function ForcarTrocaSenhaModal({ usuario, onSuccess, onClose, showToast }) {
      const [novaSenha, setNovaSenha] = useState('');
      const [confirmaSenha, setConfirmaSenha] = useState('');
      const [showSenha, setShowSenha] = useState(false);
      const [salvando, setSalvando] = useState(false);
      const [erro, setErro] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErro('');

        const senhaValida = /^(?=.*[a-zA-Z])(?=.*[0-9]).{6,}$/.test(novaSenha.trim());
        if (!senhaValida) {
          setErro('A nova senha deve possuir no mínimo 6 caracteres e conter obrigatoriamente letras e números.');
          return;
        }

        if (novaSenha !== confirmaSenha) {
          setErro('A confirmação da nova senha não confere.');
          return;
        }

        setSalvando(true);
        try {
          const res = await fetch('/api/auth/definir-nova-senha', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: usuario.email,
              novaSenha: novaSenha.trim()
            })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            if (showToast) showToast('Nova senha cadastrada com sucesso! Bem-vindo(a)! 🎉');
            if (onSuccess) onSuccess(data.usuario || { ...usuario, precisa_trocar_senha: false });
          } else {
            setErro(data.message || 'Erro ao cadastrar nova senha.');
          }
        } catch (err) {
          setErro('Erro de conexão ao salvar nova senha. Tente novamente.');
        } finally {
          setSalvando(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 sm:p-8 border border-slate-200 animate-in fade-in zoom-in-95 duration-200 relative">
            <div className="text-center mb-6">
              <div className="w-12 h-12 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center mx-auto mb-3 font-black text-2xl">
                🔑
              </div>
              <span className="text-[10px] font-extrabold uppercase tracking-widest px-2.5 py-0.5 rounded-full border border-amber-300 bg-amber-50 text-amber-800 inline-block mb-1">
                Ação Obrigatória • Senha Resetada
              </span>
              <h3 className="font-black text-xl text-slate-800">Defina sua Nova Senha</h3>
              <p className="text-xs text-slate-500 mt-1">
                Olá, <strong>{usuario.nome}</strong>. Sua senha foi redefinida pelo Administrador. Por segurança, crie sua nova senha pessoal para continuar.
              </p>
            </div>

            {erro && (
              <div className="mb-4 bg-rose-50 border border-rose-200 text-rose-700 text-xs p-3 rounded-xl flex items-center gap-2">
                <Icons.AlertCircle />
                <span>{erro}</span>
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div>
                <label className="block text-[11px] font-bold text-slate-700 mb-1">
                  Nova Senha (mín. 6 caracteres com letras e números):
                </label>
                <div className="relative">
                  <input
                    type={showSenha ? "text" : "password"}
                    placeholder="Digite sua nova senha segura"
                    value={novaSenha}
                    onChange={e => setNovaSenha(e.target.value)}
                    className="w-full p-2.5 pr-9 border border-slate-300 rounded-xl bg-white font-medium text-slate-800 focus:ring-2 focus:ring-totvs-cyan"
                    required
                    autoFocus
                  />
                  <button
                    type="button"
                    onClick={() => setShowSenha(!showSenha)}
                    className="absolute right-2.5 top-2.5 text-slate-400 hover:text-slate-600 cursor-pointer"
                  >
                    {showSenha ? <Icons.EyeOff /> : <Icons.Eye />}
                  </button>
                </div>
              </div>

              <div>
                <label className="block text-[11px] font-bold text-slate-700 mb-1">
                  Confirmar Nova Senha:
                </label>
                <input
                  type={showSenha ? "text" : "password"}
                  placeholder="Repita a nova senha exatamente igual"
                  value={confirmaSenha}
                  onChange={e => setConfirmaSenha(e.target.value)}
                  className="w-full p-2.5 border border-slate-300 rounded-xl bg-white font-medium text-slate-800 focus:ring-2 focus:ring-totvs-cyan"
                  required
                />
              </div>

              <div className="pt-2 flex items-center gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs cursor-pointer"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  disabled={salvando}
                  className="flex-1 py-2.5 px-4 rounded-xl bg-gradient-to-r from-totvs-blue to-totvs-cyan hover:from-[#003B8E] hover:to-[#00B4D8] text-white font-black text-xs transition shadow-md flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50"
                >
                  <Icons.Check />
                  <span>{salvando ? 'Salvando...' : 'Salvar Nova Senha e Acessar'}</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- COMPONENTE: MODAL DE ATIVAÇÃO DE CONVITE DE NOVO USUÁRIO ---
    function AcceptInviteModal({ token, onClose, onAcceptSuccess }) {
      const [conviteData, setConviteData] = useState(null);
      const [carregando, setCarregando] = useState(true);
      const [erroToken, setErroToken] = useState('');
      
      const [nome, setNome] = useState('');
      const [email, setEmail] = useState('');
      const [foto, setFoto] = useState('');
      const [senhaProvisoria, setSenhaProvisoria] = useState('totvs123');
      const [novaSenha, setNovaSenha] = useState('');
      const [confirmaSenha, setConfirmaSenha] = useState('');
      const [showNovaSenha, setShowNovaSenha] = useState(false);
      const [showConfirmaSenha, setShowConfirmaSenha] = useState(false);
      const [salvando, setSalvando] = useState(false);
      const [formErro, setFormErro] = useState('');
      const fileInputRef = useRef(null);

      useEffect(() => {
        if (!token) return;
        fetch(`/api/admin/invite/${token}`)
          .then(res => res.json())
          .then(data => {
            if (data.success && data.convite) {
              setConviteData(data.convite);
              if (data.convite.nome) setNome(data.convite.nome);
              if (data.convite.email) setEmail(data.convite.email);
              setSenhaProvisoria(data.convite.senha_provisoria || 'totvs123');
            } else {
              setErroToken(data.message || 'Este link de convite é inválido ou já foi utilizado.');
            }
          })
          .catch(() => setErroToken('Erro ao verificar o convite. Verifique sua conexão.'))
          .finally(() => setCarregando(false));
      }, [token]);

      const isEspecialista = (conviteData?.perfil === 'especialista') || (token && token.startsWith('esp_'));
      const isPmm = !isEspecialista && ((conviteData?.perfil === 'pmm') || (token && token.startsWith('pmm_')));

      const handleFotoChange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          setFormErro('Por favor, selecione um arquivo de imagem (JPEG, PNG ou WEBP).');
          return;
        }
        if (file.size > 2 * 1024 * 1024) {
          setFormErro('A foto deve ter no máximo 2MB.');
          return;
        }
        const reader = new FileReader();
        reader.onload = (evt) => {
          setFoto(evt.target.result);
        };
        reader.readAsDataURL(file);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setFormErro('');

        const nomeTrim = nome.trim();
        if (!nomeTrim || nomeTrim.length < 3) {
          setFormErro('Por favor, informe seu nome completo (mínimo 3 caracteres).');
          return;
        }

        const emailTrim = email.trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
        if (!emailRegex.test(emailTrim)) {
          setFormErro('Por favor, informe um endereço de e-mail corporativo válido (exemplo: usuario@totvs.com.br).');
          return;
        }

        const senhaNorm = senhaProvisoria.trim();
        if (senhaNorm !== 'totvs123' && senhaNorm !== '123') {
          setFormErro('Senha provisória incorreta. A senha padrão informada no convite é totvs123.');
          return;
        }

        // Validação obrigatória: letras E números, mínimo 6 caracteres
        const senhaAlfanumerica = /^(?=.*[a-zA-Z])(?=.*[0-9]).{6,}$/.test(novaSenha.trim());
        if (!senhaAlfanumerica) {
          setFormErro('A nova senha deve possuir no mínimo 6 caracteres e conter obrigatoriamente letras e números.');
          return;
        }

        if (novaSenha !== confirmaSenha) {
          setFormErro('A confirmação da nova senha não confere.');
          return;
        }

        setSalvando(true);
        try {
          const res = await fetch('/api/admin/accept-invite', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              token,
              nome: nomeTrim,
              email: emailTrim,
              senhaProvisoria: senhaProvisoria.trim(),
              novaSenha: novaSenha.trim(),
              foto: foto
            })
          });
          const data = await res.json();
          if (data.success && data.usuario) {
            onAcceptSuccess(data.usuario);
          } else {
            setFormErro(data.message || 'Erro ao ativar perfil de usuário.');
          }
        } catch (err) {
          setFormErro('Erro de conexão ao ativar convite. Verifique sua rede.');
        } finally {
          setSalvando(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-6 sm:p-8 border border-slate-200 animate-in fade-in zoom-in-95 duration-200 relative">
            {carregando ? (
              <div className="text-center py-12">
                <div className="w-10 h-10 border-4 border-totvs-cyan border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                <p className="text-xs font-bold text-slate-600">Verificando link de convite exclusivo...</p>
              </div>
            ) : erroToken ? (
              <div className="text-center py-8 space-y-4">
                <div className="w-14 h-14 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto text-2xl font-bold">
                  ⚠️
                </div>
                <h3 className="text-lg font-black text-slate-800">Convite Indisponível</h3>
                <p className="text-xs text-slate-500 max-w-sm mx-auto leading-relaxed">{erroToken}</p>
                <div className="pt-2">
                  <button
                    onClick={onClose}
                    className="px-5 py-2.5 rounded-xl bg-totvs-blue hover:bg-totvs-dark text-white font-bold text-xs transition shadow-md cursor-pointer"
                  >
                    Acessar o Espaço Experiência
                  </button>
                </div>
              </div>
            ) : (
              <div>
                <div className="text-center mb-6">
                  <div className="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-600 flex items-center justify-center mx-auto mb-2 text-2xl font-black">
                    🎉
                  </div>
                  <span className={`text-[10px] font-extrabold uppercase tracking-widest px-2.5 py-0.5 rounded-full border inline-block mb-1 ${
                    isEspecialista
                      ? 'bg-purple-50 text-purple-700 border-purple-200'
                      : (isPmm ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-totvs-blue/10 text-totvs-blue border-totvs-blue/20')
                  }`}>
                    {isEspecialista 
                      ? 'Convite Oficial • Especialista do Espaço Experiência' 
                      : (isPmm ? 'Convite Oficial de PMM (Gestor de Segmento)' : 'Convite Oficial de Administrador')}
                  </span>
                  <h3 className="font-black text-xl text-slate-800">
                    {isEspecialista 
                      ? 'Ative seu Acesso de Especialista' 
                      : (isPmm ? 'Ative seu Acesso de PMM' : 'Ative seu Perfil de ADM')}
                  </h3>
                  <p className="text-xs text-slate-500 mt-1">
                    {isEspecialista
                      ? <span>Você foi convidado para o <strong>Espaço Experiência TOTVS</strong> com perfil de Especialista para registrar visitantes e gerenciar a escala diária no calendário de plantonistas.</span>
                      : (isPmm
                          ? <span>Você foi convidado por <strong>{conviteData?.criado_por || 'um Administrador'}</strong> para gerenciar e atualizar os conteúdos e roteiros das estações como PMM (Gestor de Segmento).</span>
                          : <span>Você foi convidado por <strong>{conviteData?.criado_por || 'um Administrador'}</strong> para gerenciar e administrar o Espaço Experiência TOTVS com perfil de Administrador Geral.</span>
                        )
                    }
                  </p>
                </div>

                {/* Card de Identificação Pré-cadastrada */}
                {conviteData && (conviteData.nome || conviteData.email) && (
                  <div className="mb-4 p-3 bg-slate-50 border border-slate-200 rounded-2xl flex items-center justify-between text-xs">
                    <div>
                      <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Pré-cadastro confirmado:</span>
                      <strong className="text-slate-800 block text-xs">{conviteData.nome || (isEspecialista ? 'Especialista' : (isPmm ? 'Novo PMM' : 'Novo Administrador'))}</strong>
                      <span className="text-[11px] text-totvs-blue font-mono block">{conviteData.email}</span>
                    </div>
                    <span className={`px-2 py-0.5 rounded-full font-bold text-[10px] shrink-0 ${
                      isEspecialista
                        ? 'bg-purple-100 text-purple-800'
                        : (isPmm ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800')
                    }`}>
                      {isEspecialista ? 'Perfil: Especialista' : (isPmm ? 'Perfil: PMM' : 'Perfil: ADM')} • ✓ Validado
                    </span>
                  </div>
                )}

                {formErro && (
                  <div className="mb-4 bg-rose-50 border border-rose-200 text-rose-700 text-xs p-3 rounded-xl flex items-center gap-2">
                    <Icons.AlertCircle />
                    <span>{formErro}</span>
                  </div>
                )}

                <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-700 mb-1">Seu Nome Completo:</label>
                    <input
                      type="text"
                      placeholder="Ex: Carlos Silva"
                      value={nome}
                      onChange={e => setNome(e.target.value)}
                      className="w-full p-2.5 border border-slate-300 rounded-xl bg-white font-medium text-slate-800 focus:ring-2 focus:ring-totvs-cyan"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-700 mb-1">Seu E-mail Corporativo:</label>
                    <input
                      type="email"
                      placeholder="seu.nome@totvs.com.br"
                      value={email}
                      onChange={e => setEmail(e.target.value)}
                      className="w-full p-2.5 border border-slate-300 rounded-xl bg-white font-medium text-slate-800 focus:ring-2 focus:ring-totvs-cyan"
                      required
                    />
                  </div>

                  {/* Foto de Perfil Opcional */}
                  <div className="flex items-center gap-3 p-3 bg-slate-50 border border-slate-200 rounded-2xl">
                    <div className="relative shrink-0">
                      {foto ? (
                        <img src={foto} alt="Prévia" className="w-12 h-12 rounded-xl object-cover border-2 border-totvs-cyan" />
                      ) : (
                        <div className="w-12 h-12 rounded-xl bg-slate-200 text-slate-400 flex items-center justify-center font-bold text-lg">
                          <Icons.Camera />
                        </div>
                      )}
                    </div>
                    <div className="flex-1">
                      <span className="text-[11px] font-bold text-slate-700 block">Foto de Perfil (Opcional):</span>
                      <p className="text-[10px] text-slate-400">Adicione uma foto para seu perfil corporativo.</p>
                      <button
                        type="button"
                        onClick={() => fileInputRef.current?.click()}
                        className="mt-1 text-[11px] text-totvs-blue hover:underline font-bold cursor-pointer"
                      >
                        {foto ? 'Alterar foto' : 'Selecionar foto do dispositivo'}
                      </button>
                      <input
                        ref={fileInputRef}
                        type="file"
                        accept="image/*"
                        className="hidden"
                        onChange={handleFotoChange}
                      />
                    </div>

                  <div className="bg-blue-50/60 p-3 rounded-2xl border border-blue-100 space-y-2.5">
                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="text-[11px] font-bold text-slate-700">Senha Provisória Recebida:</label>
                        <span className="text-[10px] text-totvs-blue font-bold">Padrão do convite: totvs123</span>
                      </div>
                      <input
                        type="text"
                        value={senhaProvisoria}
                        onChange={e => setSenhaProvisoria(e.target.value)}
                        placeholder="totvs123"
                        className="w-full p-2 border border-slate-300 rounded-lg bg-white font-mono text-slate-800 focus:ring-2 focus:ring-totvs-cyan"
                        required
                      />
                    </div>

                    <div className="pt-1 border-t border-blue-100">
                      <span className="text-[10px] font-bold uppercase tracking-wider text-slate-600 block mb-1">

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">

                              className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-totvs-blue transition p-0.5 rounded cursor-pointer"

                              {showConfirmaSenha ? <Icons.EyeOff /> : <Icons.Eye />}
                            </button>
                          </div>
                        </div>
                      </div>

    // Helper: Resolução inteligente de URLs de vídeo (Google Drive, YouTube ou HTML5 Nativo)
    function parseVideoUrl(url) {
      if (!url || typeof url !== 'string') return { tipo: 'empty', url: '', embedUrl: '' };
      const clean = url.trim();
      
      // Google Drive link
      const driveMatch = clean.match(/(?:drive\.google\.com\/(?:file\/d\/|open\?id=))([a-zA-Z0-9_-]+)/);
      if (driveMatch && driveMatch[1]) {
        return {
          tipo: 'drive',
          embedUrl: `https://drive.google.com/file/d/${driveMatch[1]}/preview`,
          originalUrl: clean
        };
      }

      // YouTube link
      const ytMatch = clean.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([a-zA-Z0-9_-]{11})/);
      if (ytMatch && ytMatch[1]) {
        return {
          tipo: 'youtube',
          embedUrl: `https://www.youtube.com/embed/${ytMatch[1]}`,
          originalUrl: clean
        };
      }

      return {
        tipo: 'video',
        embedUrl: resolveMediaUrl(clean),
        originalUrl: clean
      };
    }

    // Helper: Compressor de Fotos de Equipamentos via HTML5 Canvas
    function compressEquipmentPhoto(file, maxWidth = 1200, maxHeight = 900, quality = 0.85) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth || height > maxHeight) {
              const ratio = Math.min(maxWidth / width, maxHeight / height);
              width = Math.round(width * ratio);
              height = Math.round(height * ratio);
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => reject(new Error('Falha ao processar imagem.'));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('Falha ao ler arquivo.'));
        reader.readAsDataURL(file);
      });
    }

    // --- COMPONENTE: MODAL DE EDIÇÃO DESCENTRALIZADA COM GESTÃO DE MÍDIAS ---
    function SegmentEditModal({ segment, usuarioAtivo, onClose, onSave }) {
      const [form, setForm] = useState(() => {
        const copy = JSON.parse(JSON.stringify(segment));
        if (!copy.midias) copy.midias = {};
        if (!copy.midias.videos) copy.midias.videos = [];
        if (!copy.midias.fotos) copy.midias.fotos = [];
        if (!copy.credenciais) copy.credenciais = { equipamento: `PC ${copy.nome}`, usuario: 'ens.experiencia@totvs.com.br', senha: 'Experienciastotvs@2026' };
        if (typeof copy.foto_bancada === 'undefined') copy.foto_bancada = '';
        return copy;
      });

      // Estados para Foto da Bancada
      const [uploadingBancada, setUploadingBancada] = useState(false);
      const [bancadaUploadMsg, setBancadaUploadMsg] = useState('');

      // Estados para Novo Vídeo
      const [novoVideoTitulo, setNovoVideoTitulo] = useState('');
      const [novoVideoUrl, setNovoVideoUrl] = useState('');
      const [uploadingVideo, setUploadingVideo] = useState(false);
      const [videoUploadMsg, setVideoUploadMsg] = useState('');

      // Estados para Nova Foto de Apoio
      const [novaFotoTitulo, setNovaFotoTitulo] = useState('');
      const [novaFotoUrl, setNovaFotoUrl] = useState('');
      const [uploadingFoto, setUploadingFoto] = useState(false);
      const [fotoUploadMsg, setFotoUploadMsg] = useState('');

      // Função Universal de Upload Binário Direto (/api/upload)
      const handleFileUpload = async (file, tipo) => {
        if (!file) return;
        const isBancada = tipo === 'bancada';
        const isVideo = tipo === 'video';

        if (isBancada) {
          setUploadingBancada(true);
          setBancadaUploadMsg(`Enviando foto da bancada "${file.name}" para o servidor local... ⏳`);
        } else if (isVideo) {
          setUploadingVideo(true);
          setVideoUploadMsg(`Enviando "${file.name}" para o servidor local... ⏳`);
        } else {
          setUploadingFoto(true);
          setFotoUploadMsg(`Enviando "${file.name}" para o servidor local... ⏳`);
        }

        try {
          const res = await fetch('/api/upload', {
            method: 'POST',
            headers: {
              'X-Filename': encodeURIComponent(file.name),
              'Content-Type': file.type || 'application/octet-stream'
            },
            body: file
          });
          const data = await res.json();
          if (data.success && data.url) {
            if (isBancada) {
              setForm(prev => ({ ...prev, foto_bancada: data.url }));
              setBancadaUploadMsg(`Foto da bancada carregada com sucesso! ✅`);
            } else if (isVideo) {
              setNovoVideoUrl(data.url);
              setVideoUploadMsg(`Upload concluído com sucesso! ✅ (${(data.tamanho_bytes / 1024 / 1024).toFixed(2)} MB)`);
            } else {
              setNovaFotoUrl(data.url);
              setFotoUploadMsg(`Upload concluído com sucesso! ✅`);
            }
          } else {
            throw new Error(data.message || 'Falha ao processar arquivo.');
          }
        } catch (err) {
          alert(`Erro ao fazer upload do arquivo: ${err.message}`);
          if (isBancada) setBancadaUploadMsg('❌ Erro no upload da foto da bancada.');
          else if (isVideo) setVideoUploadMsg('❌ Erro no upload. Tente novamente.');
          else setFotoUploadMsg('❌ Erro no upload. Tente novamente.');
        } finally {
          if (isBancada) setUploadingBancada(false);
          else if (isVideo) setUploadingVideo(false);
          else setUploadingFoto(false);
        }
      };

      // Adicionar Vídeo à Estação
      const handleAddVideo = () => {
        if (!novoVideoUrl.trim()) {
          alert('Selecione um arquivo de vídeo do seu computador ou informe a URL do vídeo.');
          return;
        }
        const titulo = novoVideoTitulo.trim() || `Vídeo Demonstrativo de ${form.nome}`;
        const novoItem = { titulo, url: novoVideoUrl.trim() };
        setForm(prev => ({
          ...prev,
          midias: {
            ...prev.midias,
            videos: [...(prev.midias.videos || []), novoItem]
          }
        }));
        setNovoVideoTitulo('');
        setNovoVideoUrl('');
        setVideoUploadMsg('');
      };

      const handleRemoveVideo = (idx) => {
        setForm(prev => ({
          ...prev,
          midias: {
            ...prev.midias,
            videos: prev.midias.videos.filter((_, i) => i !== idx)
          }
        }));
      };

      // Adicionar Foto à Estação
      const handleAddFoto = () => {
        if (!novaFotoUrl.trim()) {
          alert('Selecione um arquivo de foto do seu computador ou informe a URL da imagem.');
          return;
        }
        const titulo = novaFotoTitulo.trim() || `Equipamento de ${form.nome}`;
        const novoItem = { titulo, url: novaFotoUrl.trim() };
        setForm(prev => ({
          ...prev,
          midias: {
            ...prev.midias,
            fotos: [...(prev.midias.fotos || []), novoItem]
          }
        }));
        setNovaFotoTitulo('');
        setNovaFotoUrl('');
        setFotoUploadMsg('');
      };

      const handleRemoveFoto = (idx) => {
        setForm(prev => ({
          ...prev,
          midias: {
            ...prev.midias,
            fotos: prev.midias.fotos.filter((_, i) => i !== idx)
          }
        }));
      };

      const handleAddSolucao = () => {
        const nova = prompt('Informe o nome da nova solução TOTVS:');
        if (nova && nova.trim()) {
          setForm(prev => ({
            ...prev,
            badge_solucoes: [...(prev.badge_solucoes || []), nova.trim()]
          }));
        }
      };

      const handleRemoveSolucao = (idx) => {
        setForm(prev => ({
          ...prev,
          badge_solucoes: prev.badge_solucoes.filter((_, i) => i !== idx)
        }));
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-2xl max-w-4xl w-full overflow-hidden border border-slate-200 animate-in fade-in zoom-in-95 duration-200">
            
            <div className="bg-totvs-blue text-white p-5 flex items-center justify-between">
              <div>
                <span className="text-xs font-bold uppercase tracking-wider text-totvs-cyan">Edição Colaborativa Multiusuário</span>
                <h3 className="text-xl font-bold">Editar: {segment.nome}</h3>
              </div>
              <button onClick={onClose} className="text-slate-300 hover:text-white p-1 rounded-lg transition">
                <Icons.X />
              </button>
            </div>

            <form
              onSubmit={(e) => {
                e.preventDefault();
                onSave(form);
              }}
              className="p-6 space-y-6 max-h-[75vh] overflow-y-auto text-xs"
            >
              <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 text-[11px] text-slate-600 flex items-center justify-between">
                <span>Editando como Analista: <strong>{usuarioAtivo ? usuarioAtivo.nome : 'Especialista TOTVS'}</strong></span>
                <span className="text-totvs-blue font-semibold">{usuarioAtivo?.email}</span>
              </div>

              {/* SEÇÃO: IDENTIFICAÇÃO DA ESTAÇÃO */}

                <h4 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                  <Icons.Edit />
                  <span>Identificação da Estação & Segmento</span>
                </h4>
                <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                  <div className="sm:col-span-1">
                    <label className="block text-[11px] font-bold text-slate-600 mb-1">
                      Nº da Estação:
                    </label>
                    <input
                      type="number"
                      min="1"
                      max="99"
                      value={form.ordem || 1}
                      onChange={e => setForm({ ...form, ordem: parseInt(e.target.value, 10) || 1 })}
                      className="w-full p-2.5 border border-slate-300 rounded-xl bg-white font-bold text-slate-800 text-xs text-center focus:ring-2 focus:ring-totvs-cyan"
                      required
                    />
                  </div>
                  <div className="sm:col-span-3">
                    <label className="block text-[11px] font-bold text-slate-600 mb-1">
                      Nome do Segmento / Card:
                    </label>
                    <input
                      type="text"
                      value={form.nome || ''}
                      onChange={e => setForm({ ...form, nome: e.target.value })}
                      placeholder="Ex: TOTVS Manufatura"
                      className="w-full p-2.5 border border-slate-300 rounded-xl bg-white font-bold text-slate-800 text-xs focus:ring-2 focus:ring-totvs-cyan"
                      required
                    />
                  </div>
                </div>
              </div>

              {/* SEÇÃO PRINCIPAL: BANCADA FÍSICA & CREDENCIAIS DE ACESSO */}
              <div className="bg-gradient-to-br from-blue-50/70 via-indigo-50/40 to-slate-50 p-4 rounded-2xl border-2 border-totvs-blue/20 shadow-xs space-y-4">
                <div className="flex items-center justify-between pb-2 border-b border-blue-200/60">
